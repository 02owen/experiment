<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRAPS — Baccalaureate Mathematics Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&family=Syne:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg-primary: #1e1e1e;
      --bg-card: #252526;
      --bg-elevated: #2d2d30;
      --border-subtle: #333333;
      --border-active: #555555;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0a0;
      --text-muted: #767676;
      --accent: #4ea1f3;
      --accent-hover: #3b8be0;
      --accent-bg: rgba(78, 161, 243, 0.12);
      --success: #4ec9b0;
      --success-bg: rgba(78, 201, 176, 0.12);
      --danger: #f16c6c;
      --danger-bg: rgba(241, 108, 108, 0.12);
      --font-mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --font-ar-mono: "IBM Plex Mono", "IBM Plex Sans Arabic", "JetBrains Mono", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-mono);
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.75rem 1.25rem 4rem;
    }

    button, input, select, textarea {
      font-family: var(--font-mono);
    }

    .container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      position: relative;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--border-subtle);
      position: relative;
    }

    .brand-logo {
      display: inline-block;
      font-family: "Syne", var(--font-mono);
      font-weight: 800;
      font-size: 1.95rem;
      line-height: 1;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-primary);
      user-select: none;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    .lang-btn {
      height: 48px;
      padding: 0 0.85rem;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      color: var(--text-primary);
      font-family: var(--font-ar-mono);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .lang-btn:hover {
      background: var(--bg-elevated);
      border-color: var(--border-active);
    }

    .lang-btn.active {
      background: var(--accent-bg);
      color: var(--accent);
      border-color: var(--accent);
    }

    .hamburger-btn {
      width: 48px;
      height: 48px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      color: var(--text-primary);
      cursor: pointer;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .hamburger-btn:hover {
      background: var(--bg-elevated);
      border-color: var(--border-active);
    }

    .hamburger-line {
      width: 18px;
      height: 2px;
      background: currentColor;
      border-radius: 2px;
    }

    .menu-drawer {
      display: none;
      position: absolute;
      top: calc(100% + 0.5rem);
      right: 0;
      width: 360px;
      max-width: 100%;
      max-height: 78vh;
      overflow-y: auto;
      background: var(--bg-card);
      border: 1px solid var(--border-active);
      border-radius: 10px;
      padding: 0.65rem;
      z-index: 50;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
    }

    .menu-drawer.open {
      display: block;
    }

    .menu-all-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-primary);
      padding: 0.5rem 0.7rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 0.35rem;
    }

    .menu-all-btn:hover,
    .menu-all-btn.active {
      background: var(--accent-bg);
      color: var(--accent);
      border-color: rgba(78, 161, 243, 0.35);
    }

    .book-section {
      border-top: 1px solid var(--border-subtle);
      padding-top: 0.35rem;
      margin-top: 0.25rem;
    }

    .book-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: transparent;
      border: none;
      color: var(--text-primary);
      padding: 0.5rem 0.65rem;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
    }

    .book-header:hover {
      background: var(--bg-elevated);
    }

    .book-chevron {
      font-size: 0.75rem;
      color: var(--text-secondary);
      transition: transform 0.15s ease;
    }

    .book-section.collapsed .book-chevron {
      transform: rotate(-90deg);
    }

    .book-section.collapsed .unit-list,
    .book-section.collapsed .saved-menu-list {
      display: none;
    }

    .unit-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      padding: 0.15rem 0 0.35rem 0.6rem;
    }

    .unit-item-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 0.42rem 0.65rem;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .unit-item-btn:hover {
      background: var(--bg-elevated);
      color: var(--text-primary);
    }

    .unit-item-btn.active {
      background: var(--accent-bg);
      color: var(--accent);
      font-weight: 500;
    }

    .saved-menu-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      padding: 0.25rem 0.25rem 0.35rem;
    }

    .saved-menu-empty {
      font-size: 0.76rem;
      color: var(--text-muted);
      padding: 0.3rem 0.4rem;
    }

    .saved-menu-item {
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 7px;
      padding: 0.55rem 0.65rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .saved-menu-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.7rem;
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
    }

    .saved-menu-preview {
      font-size: 0.76rem;
      color: var(--text-primary);
      line-height: 1.45;
      max-height: 4.5rem;
      overflow: hidden;
    }

    .saved-menu-actions {
      display: flex;
      gap: 0.4rem;
      justify-content: flex-end;
    }

    .btn-mini {
      font-size: 0.72rem;
      padding: 0.25rem 0.55rem;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      color: var(--text-primary);
      transition: all 0.12s ease;
    }

    .btn-mini:hover {
      border-color: var(--border-active);
    }

    .btn-mini.delete:hover {
      background: var(--danger-bg);
      border-color: rgba(241, 108, 108, 0.45);
      color: var(--danger);
    }

    /* Two-Section Problem Block */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      overflow: hidden;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      min-height: 54px;
      padding: 0.85rem 1.5rem;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
    }

    .meta-badges {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
      overflow: hidden;
      flex-wrap: wrap;
    }

    .badge {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 0.24rem 0.65rem;
      border-radius: 5px;
      color: var(--accent);
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-book {
      color: var(--success);
    }

    .badge-unit {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta-right {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-shrink: 0;
    }

    .seed-tag {
      font-size: 0.7rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .problem-number {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .problem-body {
      padding: 1.75rem;
    }

    .problem-statement {
      font-size: 1rem;
      color: var(--text-primary);
      line-height: 1.85;
    }

    .problem-statement .katex-display {
      margin: 1rem 0;
    }

    /* Centered Icon Action Controls */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
    }

    .btn-group {
      display: flex;
      gap: 0.85rem;
      align-items: center;
      justify-content: center;
    }

    button.icon-btn {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    button.icon-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    button.icon-btn.primary {
      background: var(--accent);
      color: #111111;
      border-color: var(--accent);
    }

    button.icon-btn.primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    button.icon-btn.secondary:hover {
      background: var(--bg-elevated);
      border-color: var(--border-active);
    }

    button.icon-btn.active-toggle {
      background: var(--accent-bg);
      color: var(--accent);
      border-color: var(--accent);
    }

    button.icon-btn.saved {
      background: var(--success-bg);
      color: var(--success);
      border-color: rgba(78, 201, 176, 0.45);
    }

    button.icon-btn.saved svg {
      fill: var(--success);
    }

    button.icon-btn.copied {
      background: var(--success-bg);
      color: var(--success);
      border-color: rgba(78, 201, 176, 0.45);
    }

    .status-note {
      font-size: 0.78rem;
      color: var(--text-secondary);
      min-height: 1.15rem;
      text-align: center;
    }

    .solution-card {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-left: 3px solid var(--success);
      border-radius: 10px;
      padding: 1.75rem;
    }

    .solution-card.visible {
      display: block;
    }

    .solution-header {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--success);
      font-weight: 600;
      margin-bottom: 1.1rem;
    }

    .steps-list {
      list-style: none;
      counter-reset: step-counter;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .steps-list li {
      counter-increment: step-counter;
      position: relative;
      padding-left: 2.2rem;
      font-size: 0.92rem;
      line-height: 1.85;
    }

    .steps-list li::before {
      content: counter(step-counter);
      position: absolute;
      left: 0;
      top: 0.25rem;
      width: 1.45rem;
      height: 1.45rem;
      border-radius: 50%;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 0.74rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .final-answer-box {
      margin-top: 1.35rem;
      padding: 0.9rem 1.15rem;
      background: var(--success-bg);
      border: 1px solid rgba(78, 201, 176, 0.3);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 0.96rem;
    }

    .final-answer-box strong {
      color: var(--success);
      margin-right: 0.5rem;
    }

    /* LTR Layout Stability & Mono-Styled Arabic Typography */
    .ar-text {
      font-family: var(--font-ar-mono);
      direction: ltr;
      unicode-bidi: isolate;
      letter-spacing: 0;
      text-transform: none;
    }

    .problem-statement.ar-mode,
    .steps-list.ar-mode li,
    .final-answer-box.ar-mode,
    .saved-menu-preview.ar-mode {
      font-family: var(--font-ar-mono);
      direction: ltr;
      text-align: left;
      letter-spacing: 0;
    }

    .katex {
      font-size: 1.04em;
      direction: ltr;
      unicode-bidi: isolate;
    }

    @media (max-width: 600px) {
      .card-meta {
        padding: 0.75rem 1rem;
        flex-wrap: wrap;
      }
      .problem-body, .solution-card {
        padding: 1.2rem;
      }
      .brand-logo {
        font-size: 1.65rem;
      }
      .lang-btn {
        height: 42px;
        padding: 0 0.65rem;
        font-size: 0.76rem;
      }
      .hamburger-btn {
        width: 42px;
        height: 42px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="brand-logo">TRAPS</span>

      <div class="header-actions">
        <button class="lang-btn" id="btn-lang-ar" type="button" title="Toggle Arabic Translation" aria-label="Toggle Arabic Translation" aria-pressed="false">
          <span class="ar-text">عربي</span>
        </button>

        <button class="hamburger-btn" id="btn-menu" aria-label="Toggle Curriculum Menu" aria-expanded="false">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </button>
      </div>

      <nav class="menu-drawer" id="menu-drawer" aria-label="Books, Units and Saved Problems">
        <button class="menu-all-btn active" data-unit="all">All Books &amp; Units (Random)</button>

        <div class="book-section" data-book="analysis">
          <button class="book-header" type="button">
            <span>1. Analysis</span>
            <span class="book-chevron">▾</span>
          </button>
          <ul class="unit-list" data-book-units="analysis"></ul>
        </div>

        <div class="book-section" data-book="algebra-vectors">
          <button class="book-header" type="button">
            <span>2. Algebra and Vectors</span>
            <span class="book-chevron">▾</span>
          </button>
          <ul class="unit-list" data-book-units="algebra-vectors"></ul>
        </div>

        <div class="book-section" data-book="saved">
          <button class="book-header" type="button">
            <span>Saved Problems (<span id="menu-saved-count">0</span>)</span>
            <span class="book-chevron">▾</span>
          </button>
          <div class="saved-menu-list" id="saved-menu-container"></div>
        </div>
      </nav>
    </header>

    <main class="card">
      <div class="card-meta" id="tags-section">
        <div class="meta-badges">
          <span class="badge badge-book" id="problem-book">Loading...</span>
          <span class="badge badge-unit" id="problem-unit">Loading...</span>
        </div>
        <div class="meta-right">
          <span class="seed-tag" id="problem-seed">SEED: --------</span>
          <span class="problem-number" id="problem-id">#001</span>
        </div>
      </div>
      <div class="problem-body" id="problem-section">
        <div class="problem-statement" id="problem-text"></div>
      </div>
    </main>

    <div class="controls">
      <div class="btn-group">
        <button class="icon-btn primary" id="btn-new" type="button" title="New Problem" aria-label="New Problem">
          <svg viewBox="0 0 24 24">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <polyline points="21 3 21 9 15 9" />
          </svg>
        </button>

        <button class="icon-btn secondary" id="btn-toggle-solution" type="button" title="Show Solution" aria-label="Show Solution">
          <svg id="icon-eye" viewBox="0 0 24 24">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>

        <button class="icon-btn secondary" id="btn-save-problem" type="button" title="Save Problem" aria-label="Save Problem">
          <svg viewBox="0 0 24 24">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
          </svg>
        </button>

        <button class="icon-btn secondary" id="btn-share-link" type="button" title="Copy Shareable Seeded Link" aria-label="Copy Shareable Seeded Link">
          <svg id="icon-share" viewBox="0 0 24 24">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
          </svg>
        </button>
      </div>
      <span class="status-note" id="status-note"></span>
    </div>

    <section class="solution-card" id="solution-card">
      <div class="solution-header" id="solution-header">Step-by-Step Derivation</div>
      <ol class="steps-list" id="solution-steps"></ol>
      <div class="final-answer-box" id="final-answer"></div>
    </section>
  </div>

  <script>
    /* =========================================================================
       1. SEEDED PRNG (MULBERRY32) & EXACT ALGEBRAIC UTILITIES
       ========================================================================= */
    const DIFFICULTY = "bac";
    let activeRng = Math.random;

    function createSeededRng(seedUint32) {
      let a = seedUint32 >>> 0;
      return function () {
        a |= 0;
        a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function generateRandomSeed() {
      if (window.crypto && typeof window.crypto.getRandomValues === "function") {
        const buf = new Uint32Array(1);
        window.crypto.getRandomValues(buf);
        return (buf[0] >>> 0) || 1;
      }
      return (Math.floor(Math.random() * 0xffffffff) >>> 0) || 1;
    }

    function encodeSeedBase36(seedUint32) {
      return (seedUint32 >>> 0).toString(36).toUpperCase();
    }

    function parseSeedParam(rawParam) {
      if (!rawParam) return null;
      const trimmed = rawParam.trim();
      if (/^[0-9a-zA-Z]{1,10}$/.test(trimmed)) {
        const parsed = parseInt(trimmed, 36);
        if (Number.isFinite(parsed) && parsed > 0) {
          return (parsed >>> 0);
        }
      }
      if (/^\d{1,12}$/.test(trimmed)) {
        const parsed = Number(trimmed);
        if (Number.isFinite(parsed) && parsed > 0) {
          return (parsed >>> 0);
        }
      }
      return null;
    }

    const MathFmt = {
      gcd(a, b) {
        a = Math.abs(Math.round(a));
        b = Math.abs(Math.round(b));
        while (b !== 0) {
          const t = b;
          b = a % b;
          a = t;
        }
        return a === 0 ? 1 : a;
      },

      frac(n, d = 1) {
        if (d === 0) throw new Error("Division by zero");
        if (n === 0) return { n: 0, d: 1 };
        if (d < 0) { n = -n; d = -d; }
        const g = this.gcd(n, d);
        return { n: n / g, d: d / g };
      },

      addFrac(f1, f2) {
        return this.frac(f1.n * f2.d + f2.n * f1.d, f1.d * f2.d);
      },

      subFrac(f1, f2) {
        return this.frac(f1.n * f2.d - f2.n * f1.d, f1.d * f2.d);
      },

      texFrac(f) {
        if (f.n === 0) return "0";
        const sign = f.n < 0 ? "-" : "";
        const absN = Math.abs(f.n);
        if (f.d === 1) return `${sign}${absN}`;
        return `${sign}\\frac{${absN}}{${f.d}}`;
      },

      signedNum(k) {
        if (k === 0) return "";
        return k > 0 ? ` + ${k}` : ` - ${Math.abs(k)}`;
      },

      linear(a, b, v = "x") {
        let out = "";
        if (a !== 0) {
          if (a === 1) out += v;
          else if (a === -1) out += `-${v}`;
          else out += `${a}${v}`;
        }
        if (b !== 0) {
          out += out === "" ? `${b}` : this.signedNum(b);
        }
        return out === "" ? "0" : out;
      },

      rational(a, b, c, d, v = "x") {
        return `\\frac{${this.linear(a, b, v)}}{${this.linear(c, d, v)}}`;
      },

      coeff(k, sym, leading = true) {
        if (k === 0) return "";
        if (leading) {
          if (k === 1) return sym;
          if (k === -1) return `-${sym}`;
          return `${k}${sym}`;
        }
        if (k === 1) return ` + ${sym}`;
        if (k === -1) return ` - ${sym}`;
        return k > 0 ? ` + ${k}${sym}` : ` - ${Math.abs(k)}${sym}`;
      },

      simplifySqrt(n) {
        if (n === 0) return { out: 0, inside: 1 };
        let out = 1;
        let inside = n;
        for (let i = 2; i * i <= inside; i++) {
          while (inside % (i * i) === 0) {
            out *= i;
            inside /= (i * i);
          }
        }
        return { out, inside };
      },

      texSqrt(n) {
        if (n === 0) return "0";
        const { out, inside } = this.simplifySqrt(n);
        if (inside === 1) return `${out}`;
        if (out === 1) return `\\sqrt{${inside}}`;
        return `${out}\\sqrt{${inside}}`;
      },

      texPi(f) {
        if (f.n === 0) return "0";
        const sign = f.n < 0 ? "-" : "";
        const absN = Math.abs(f.n);
        const numStr = absN === 1 ? "\\pi" : `${absN}\\pi`;
        if (f.d === 1) return `${sign}${numStr}`;
        return `${sign}\\frac{${numStr}}{${f.d}}`;
      },

      comb(n, k) {
        if (k < 0 || k > n) return 0;
        let res = 1;
        for (let i = 1; i <= k; i++) {
          res = (res * (n - i + 1)) / i;
        }
        return Math.round(res);
      },

      perm(n, k) {
        if (k < 0 || k > n) return 0;
        let res = 1;
        for (let i = 0; i < k; i++) {
          res *= (n - i);
        }
        return Math.round(res);
      }
    };

        steps: [
          `Apply the product rule: $f'(x) = ${k}e^{${MathFmt.coeff(a, "x", true)}} + ${a}\\big(${MathFmt.linear(k, m, "x")}\\big)e^{${MathFmt.coeff(a, "x", true)}}$.`,
          `Factor out $e^{${MathFmt.coeff(a, "x", true)}}$: $f'(x) = \\big(${MathFmt.linear(xCoeff, constPart, "x")}\\big)e^{${MathFmt.coeff(a, "x", true)}}$.`,
          `As $x \\to +\\infty$, the limit is $${a < 0 ? "0" : (k > 0 ? "+\\infty" : "-\\infty")}$.`
        ],
        stepsAr: [
          `نطبق قاعدة اشتقاق الجداء: $f'(x) = ${k}e^{${MathFmt.coeff(a, "x", true)}} + ${a}\\big(${MathFmt.linear(k, m, "x")}\\big)e^{${MathFmt.coeff(a, "x", true)}}$.`,
          `نخرج $e^{${MathFmt.coeff(a, "x", true)}}$ عاملاً مشتركاً: $f'(x) = \\big(${MathFmt.linear(xCoeff, constPart, "x")}\\big)e^{${MathFmt.coeff(a, "x", true)}}$.`,

    function genIntegration() {
      const p = Rand.int(1, 4);
      const a = 3 * Rand.nonZeroInt(-2, 2);

      const c3 = a / 3;

      return {
        book: "Analysis",
        bookAr: "التحليل",
        unit: "Integration",
        unitAr: "التكامل",
        statement: `Evaluate the definite integral:

        statementAr: `احسب التكامل المحدد:
        $$I = \\int_{0}^{${p}} \\left(${a}x^2${MathFmt.coeff(b, "x", false)}${MathFmt.signedNum(c)}\\right) dx$$`,
        steps: [
          `An antiderivative is $F(x) = ${MathFmt.coeff(c3, "x^3", true)}${MathFmt.coeff(c2, "x^2", false)}${MathFmt.coeff(c, "x", false)}$.`,
          `Evaluate $I = F(${p}) - F(0) = ${exactVal}$.`

        stepsAr: [
          `أحد التوابع الأصلية هو $F(x) = ${MathFmt.coeff(c3, "x^3", true)}${MathFmt.coeff(c2, "x^2", false)}${MathFmt.coeff(c, "x", false)}$.`,
          `نحسب $I = F(${p}) - F(0) = ${exactVal}$.`
        ],
        answer: `I = ${exactVal}`,
        answerLabelAr: "الجواب النهائي"
      };
    }

    function genVector() {
      const u = [Rand.nonZeroInt(-4, 4), Rand.nonZeroInt(-4, 4), Rand.nonZeroInt(-4, 4)];
      const v = [Rand.nonZeroInt(-4, 4), Rand.nonZeroInt(-4, 4), Rand.nonZeroInt(-4, 4)];
      const dot = u[0] * v[0] + u[1] * v[1] + u[2] * v[2];
      const cx = u[1] * v[2] - u[2] * v[1];
      const cy = u[2] * v[0] - u[0] * v[2];
      const cz = u[0] * v[1] - u[1] * v[0];
      const normSq = cx * cx + cy * cy + cz * cz;

      return {
        book: "Algebra and Vectors",
        bookAr: "الجبر والأشعة",
        unit: "Vector",
        unitAr: "الأشعة",
        statement: `In an orthonormal basis $(\\vec{i}, \\vec{j}, \\vec{k})$, let $\\vec{u}(${u[0]}, ${u[1]}, ${u[2]})$ and $\\vec{v}(${v[0]}, ${v[1]}, ${v[2]})$. Compute $\\vec{u} \\cdot \\vec{v}$ and $\\|\\vec{u} \\times \\vec{v}\\|$.`,
        statementAr: `في معلم متجانس $(\\vec{i}, \\vec{j}, \\vec{k})$، ليكن $\\vec{u}(${u[0]}, ${u[1]}, ${u[2]})$ و $\\vec{v}(${v[0]}, ${v[1]}, ${v[2]})$. احسب الجداء السلمي $\\vec{u} \\cdot \\vec{v}$ وطويلة الجداء الشعاعي $\\|\\vec{u} \\times \\vec{v}\\|$.`,
        steps: [
          `Dot product: $\\vec{u} \\cdot \\vec{v} = (${u[0]})(${v[0]}) + (${u[1]})(${v[1]}) + (${u[2]})(${v[2]}) = ${dot}$.`,
          `Cross product: $\\vec{u} \\times \\vec{v} = (${cx}, ${cy}, ${cz})$, so $\\|\\vec{u} \\times \\vec{v}\\| = \\sqrt{${normSq}} = ${MathFmt.texSqrt(normSq)}$.`
        ],
        stepsAr: [
          `الجداء السلمي: $\\vec{u} \\cdot \\vec{v} = (${u[0]})(${v[0]}) + (${u[1]})(${v[1]}) + (${u[2]})(${v[2]}) = ${dot}$.`,
          `الجداء الشعاعي: $\\vec{u} \\times \\vec{v} = (${cx}, ${cy}, ${cz})$، إذن $\\|\\vec{u} \\times \\vec{v}\\| = \\sqrt{${normSq}} = ${MathFmt.texSqrt(normSq)}$.`
        ],
        answer: `\\vec{u} \\cdot \\vec{v} = ${dot}, \\quad \\|\\vec{u} \\times \\vec{v}\\| = ${MathFmt.texSqrt(normSq)}`,
        answerLabelAr: "الجواب النهائي"
      };
    }

    function genComplexNumbers() {
      const m = Rand.pick([1, 2, 3]);
      const iLabel = m === 1 ? "i" : (m === 2 ? "-1" : "-i");
      const iArg = MathFmt.frac(m, 2);

      const alphas = [
        { tex: "\\frac{\\pi}{6}", f: MathFmt.frac(1, 6) },
        { tex: "\\frac{\\pi}{4}", f: MathFmt.frac(1, 4) },
        { tex: "\\frac{\\pi}{3}", f: MathFmt.frac(1, 3) },
        { tex: "-\\frac{\\pi}{3}", f: MathFmt.frac(-1, 3) },
        { tex: "\\frac{2\\pi}{3}", f: MathFmt.frac(2, 3) }
      ];
      const alpha = Rand.pick(alphas);

      const denoms = [
        { tex: "1 - \\sqrt{3}", arg: MathFmt.frac(1, 1), reason: "$1 - \\sqrt{3} < 0 \\implies \\arg(1 - \\sqrt{3}) \\equiv \\pi \\pmod{2\\pi}$" },
        { tex: "1 + i\\sqrt{3}", arg: MathFmt.frac(1, 3), reason: "$1 + i\\sqrt{3} = 2e^{i\\pi/3} \\implies \\arg(1 + i\\sqrt{3}) \\equiv \\frac{\\pi}{3} \\pmod{2\\pi}$" },
        { tex: "-1 + i\\sqrt{3}", arg: MathFmt.frac(2, 3), reason: "$-1 + i\\sqrt{3} = 2e^{i2\\pi/3} \\implies \\arg(-1 + i\\sqrt{3}) \\equiv \\frac{2\\pi}{3} \\pmod{2\\pi}$" },
        { tex: "\\sqrt{3} + i", arg: MathFmt.frac(1, 6), reason: "$\\sqrt{3} + i = 2e^{i\\pi/6} \\implies \\arg(\\sqrt{3} + i) \\equiv \\frac{\\pi}{6} \\pmod{2\\pi}$" }
      ];
      const denom = Rand.pick(denoms);

      let rawArg = MathFmt.subFrac(MathFmt.addFrac(iArg, alpha.f), denom.arg);
      let norm = { n: rawArg.n, d: rawArg.d };
      while (norm.n > norm.d) norm = MathFmt.subFrac(norm, MathFmt.frac(2, 1));
      while (norm.n <= -norm.d) norm = MathFmt.addFrac(norm, MathFmt.frac(2, 1));

      return {
        book: "Algebra and Vectors",
        bookAr: "الجبر والأشعة",
        unit: "Complex Numbers",
        unitAr: "الأعداد العقدية",
        statement: `Find the principal argument $\\arg(Z) \\in ]-\\pi, \\pi]$ for:
        $$Z = \\frac{${iLabel} \\cdot e^{i${alpha.tex}}}{${denom.tex}}$$`,
        statementAr: `أوجد الزاوية الرئيسية $\\arg(Z) \\in ]-\\pi, \\pi]$ للعدد العقدي:
        $$Z = \\frac{${iLabel} \\cdot e^{i${alpha.tex}}}{${denom.tex}}$$`,
        steps: [
          `Use $\\arg\\!\\left(\\frac{u \\cdot v}{w}\\right) \\equiv \\arg(u) + \\arg(v) - \\arg(w) \\pmod{2\\pi}$.`,
          `Here $\\arg(${iLabel}) \\equiv ${MathFmt.texPi(iArg)}$, $\\arg(e^{i${alpha.tex}}) \\equiv ${MathFmt.texPi(alpha.f)}$, and ${denom.reason}.`,
          `Reducing into $]-\\pi, \\pi]$ gives $${MathFmt.texPi(norm)}$.`
        ],
        stepsAr: [
          `نستخدم $\\arg\\!\\left(\\frac{u \\cdot v}{w}\\right) \\equiv \\arg(u) + \\arg(v) - \\arg(w) \\pmod{2\\pi}$.`,
          `هنا $\\arg(${iLabel}) \\equiv ${MathFmt.texPi(iArg)}$ و $\\arg(e^{i${alpha.tex}}) \\equiv ${MathFmt.texPi(alpha.f)}$ و ${denom.reason}$.`,
          `بإرجاع الزاوية إلى المجال $]-\\pi, \\pi]$ نجد $${MathFmt.texPi(norm)}$.`
        ],
        answer: `\\arg(Z) = ${MathFmt.texPi(norm)}`,
        answerLabelAr: "الجواب النهائي"
      };
    }

    function genComplexGeometry() {
      const ax = Rand.nonZeroInt(-3, 3);
      const ay = Rand.nonZeroInt(-3, 3);
      const bx = ax + 2;
      const by = ay;
      const angleChoice = Rand.pick([
        { tex: "\\frac{\\pi}{2}", dx: 0, dy: 2 },
        { tex: "\\frac{\\pi}{4}", dx: 2, dy: 2 },
        { tex: "-\\frac{\\pi}{2}", dx: 0, dy: -2 }
      ]);
      const cx = ax + angleChoice.dx;
      const cy = ay + angleChoice.dy;

      return {
        book: "Algebra and Vectors",
        bookAr: "الجبر والأشعة",
        unit: "Applications of Complex Numbers in Geometry",
        unitAr: "تطبيقات الأعداد العقدية في الهندسة",
        statement: `In the Argand plane, let $A$, $B$, and $C$ have affixes $z_A = ${ax}${ay >= 0 ? ` + ${ay}i` : ` - ${Math.abs(ay)}i`}$, $z_B = ${bx}${by >= 0 ? ` + ${by}i` : ` - ${Math.abs(by)}i`}$, and $z_C = ${cx}${cy >= 0 ? ` + ${cy}i` : ` - ${Math.abs(cy)}i`}$. Determine a measure of $\\widehat{(\\vec{AB}, \\vec{AC})}$.`,
        statementAr: `في المستوي العقدي، لتكن النقاط $A$ و $B$ و $C$ ذات اللواحق $z_A = ${ax}${ay >= 0 ? ` + ${ay}i` : ` - ${Math.abs(ay)}i`}$ و $z_B = ${bx}${by >= 0 ? ` + ${by}i` : ` - ${Math.abs(by)}i`}$ و $z_C = ${cx}${cy >= 0 ? ` + ${cy}i` : ` - ${Math.abs(cy)}i`}$. أوجد قياس الزاوية $\\widehat{(\\vec{AB}, \\vec{AC})}$.`,
        steps: [
          `$\\widehat{(\\vec{AB}, \\vec{AC})} \\equiv \\arg\\!\\left(\\dfrac{z_C - z_A}{z_B - z_A}\\right) \\pmod{2\\pi}$.`,
          `Here $z_B - z_A = 2$ and $z_C - z_A = ${angleChoice.dx}${angleChoice.dy >= 0 ? ` + ${angleChoice.dy}i` : ` - ${Math.abs(angleChoice.dy)}i`}$, giving argument $${angleChoice.tex}$.`
        ],
        stepsAr: [
          `$\\widehat{(\\vec{AB}, \\vec{AC})} \\equiv \\arg\\!\\left(\\dfrac{z_C - z_A}{z_B - z_A}\\right) \\pmod{2\\pi}$.`,
          `هنا $z_B - z_A = 2$ و $z_C - z_A = ${angleChoice.dx}${angleChoice.dy >= 0 ? ` + ${angleChoice.dy}i` : ` - ${Math.abs(angleChoice.dy)}i`}$، والزاوية تساوي $${angleChoice.tex}$.`
        ],
        answer: `\\widehat{(\\vec{AB}, \\vec{AC})} = ${angleChoice.tex} \\pmod{2\\pi}`,
        answerLabelAr: "الجواب النهائي"
      };
    }

    function genCountingTechniques() {
      const mode = Rand.pick(["combinations", "arrangements"]);
      if (mode === "combinations") {
        const men = Rand.int(4, 7);
        const women = Rand.int(3, 6);
        const kMen = Rand.int(1, 3);
        const kWomen = Rand.int(1, 3);
        const totalSize = kMen + kWomen;
        const cMen = MathFmt.comb(men, kMen);
        const cWomen = MathFmt.comb(women, kWomen);
        const ans = cMen * cWomen;

        return {
          book: "Algebra and Vectors",
          bookAr: "الجبر والأشعة",
          unit: "Counting Techniques",
          unitAr: "طرائق العد",
          statement: `A committee of $${totalSize}$ members is selected simultaneously from $${men}$ men and $${women}$ women. How many committees contain exactly $${kMen}$ ${kMen === 1 ? "man" : "men"} and $${kWomen}$ ${kWomen === 1 ? "woman" : "women"}?`,
          statementAr: `نختار لجنة مؤلفة من $${totalSize}$ أعضاء دفعة واحدة من بين $${men}$ رجال و $${women}$ نساء. بكم طريقة يمكن تشكيل لجنة تضم $${kMen}$ ${kMen === 1 ? "رجلاً" : "رجال"} و $${kWomen}$ ${kWomen === 1 ? "امرأة" : "نساء"} بالضبط؟`,
          steps: [
            `Since order does not matter in a committee, use combinations $\\binom{n}{r} = \\dfrac{n!}{r!(n-r)!}$.`,
            `Select $${kMen}$ ${kMen === 1 ? "man" : "men"} out of $${men}$ in $\\binom{${men}}{${kMen}} = ${cMen}$ ways, and $${kWomen}$ ${kWomen === 1 ? "woman" : "women"} out of $${women}$ in $\\binom{${women}}{${kWomen}} = ${cWomen}$ ways.`,
            `By the fundamental counting principle (multiplication rule), total committees $= ${cMen} \\times ${cWomen} = ${ans}$.`
          ],
          stepsAr: [
            `لأن الترتيب غير مهم في اللجنة نستخدم التوافيق $\\binom{n}{r} = \\dfrac{n!}{r!(n-r)!}$.`,
            `نختار الرجال بـ $\\binom{${men}}{${kMen}} = ${cMen}$ طريقة، والنساء بـ $\\binom{${women}}{${kWomen}} = ${cWomen}$ طريقة.`,
            `بحسب المبدأ الأساسي للعد، العدد الكلي للجان هو ${cMen} \\times ${cWomen} = ${ans}$.`
          ],
          answer: `${ans}`,
          answerLabelAr: "الجواب النهائي"
        };
      } else {
        const n = Rand.int(5, 8);
        const k = Rand.int(2, 4);
        const ans = MathFmt.perm(n, k);

        return {
          book: "Algebra and Vectors",
          bookAr: "الجبر والأشعة",
          unit: "Counting Techniques",
          unitAr: "طرائق العد",
          statement: `From a group of $${n}$ distinct candidates, how many ordered selections of $${k}$ distinct positions (for example: President, Vice-President, Secretary, Treasurer) can be formed without repetition?`,
          statementAr: `من بين $${n}$ مرشحين مختلفين، بكم طريقة يمكن اختيار $${k}$ مناصب متمايزة ومرتبة (مثلاً: رئيس، نائب رئيس، أمين سر، أمين صندوق) دون تكرار؟`,
          steps: [
            `Because the $${k}$ positions are distinct and repetition is not allowed, use arrangements (permutations) $A_{n}^{k} = \\dfrac{n!}{(n-k)!}$.`,
            `Compute $A_{${n}}^{${k}} = ${n} \\times ${n - 1}${k >= 3 ? ` \\times ${n - 2}` : ""}${k >= 4 ? ` \\times ${n - 3}` : ""} = ${ans}$.`
          ],
          stepsAr: [
            `لأن المناصب متمايزة والترتيب مهم دون تكرار نستخدم التراتيب $A_{n}^{k} = \\dfrac{n!}{(n-k)!}$.`,
            `نحسب $A_{${n}}^{${k}} = ${n} \\times ${n - 1}${k >= 3 ? ` \\times ${n - 2}` : ""}${k >= 4 ? ` \\times ${n - 3}` : ""} = ${ans}$.`
          ],
          answer: `${ans}`,
          answerLabelAr: "الجواب النهائي"
        };
      }
    }

    function genProbability() {
      const r = Rand.int(3, 6);
      const b = Rand.int(2, 5);
      const total = r + b;
      const prob = MathFmt.frac(r * (r - 1), total * (total - 1));

      return {
        book: "Algebra and Vectors",
        bookAr: "الجبر والأشعة",
        unit: "Probability",
        unitAr: "الاحتمالات",
        statement: `An urn contains $${r}$ red balls and $${b}$ blue balls. Two balls are drawn successively without replacement. Compute the probability that both drawn balls are red.`,
        statementAr: `يحتوي صندوق على $${r}$ كرات حمراء و $${b}$ كرات زرقاء. نسحب كرتين على التتالي دون إعادة. احسب احتمال أن تكون الكرتان المسحوبتان حمراوين.`,
        steps: [
          `Total balls: $N = ${total}$.`,
          `$P(R_1 \\cap R_2) = \\dfrac{${r}}{${total}} \\cdot \\dfrac{${r - 1}}{${total - 1}} = \\dfrac{${r * (r - 1)}}{${total * (total - 1)}} = ${MathFmt.texFrac(prob)}$.`
        ],
        stepsAr: [
          `العدد الكلي للكرات: $N = ${total}$.`,
          `$P(R_1 \\cap R_2) = \\dfrac{${r}}{${total}} \\cdot \\dfrac{${r - 1}}{${total - 1}} = \\dfrac{${r * (r - 1)}}{${total * (total - 1)}} = ${MathFmt.texFrac(prob)}$.`
        ],
        answer: `P = ${MathFmt.texFrac(prob)}`,
        answerLabelAr: "الجواب النهائي"
      };
    }

      dom.btnSave.classList.toggle("saved", saved);
      dom.btnSave.classList.toggle("secondary", !saved);
      const label = saved ? "Saved" : "Save Problem";
      dom.btnSave.title = label;
      dom.btnSave.setAttribute("aria-label", label);
    }

    function renderSavedInMenu() {
      dom.menuSavedCount.textContent = String(state.savedProblems.length);
      if (state.savedProblems.length === 0) {
        dom.savedMenuContainer.innerHTML = `<p class="saved-menu-empty">No saved problems yet.</p>`;
        return;
      }

      dom.savedMenuContainer.innerHTML = state.savedProblems.map((item, idx) => {
        const previewText = state.arabicMode && item.statementAr ? item.statementAr : item.statement;
        const unitLabel = state.arabicMode && item.unitAr ? item.unitAr : item.unit;
        return `
          <div class="saved-menu-item" data-id="${encodeURIComponent(item.id)}">
            <div class="saved-menu-top">
              <span>#${idx + 1} &middot; <span class="${state.arabicMode ? "ar-text" : ""}">${unitLabel}</span></span>
            </div>
            <div class="saved-menu-preview ${state.arabicMode ? "ar-mode" : ""}">${previewText}</div>
            <div class="saved-menu-actions">
              <button class="btn-mini open" type="button" data-action="open">Open</button>
              <button class="btn-mini delete" type="button" data-action="delete">Delete</button>
            </div>
          </div>
        `;
      }).join("");

      typesetMath(dom.savedMenuContainer);
    }

    function setSolutionVisibility(visible) {
      state.solutionVisible = visible;
      if (visible) {
        dom.solutionCard.classList.add("visible");
        dom.btnToggle.classList.add("active-toggle");
        dom.btnToggle.title = "Hide Solution";
        dom.btnToggle.setAttribute("aria-label", "Hide Solution");
        dom.iconEye.innerHTML = `
          <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
          <line x1="1" y1="1" x2="23" y2="23" />
        `;
      } else {
        dom.solutionCard.classList.remove("visible");
        dom.btnToggle.classList.remove("active-toggle");
        dom.btnToggle.title = "Show Solution";
        dom.btnToggle.setAttribute("aria-label", "Show Solution");
        dom.iconEye.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
          <circle cx="12" cy="12" r="3" />
        `;
      }
    }

    function applyProblemDisplay() {
      const problem = state.currentProblem;
      if (!problem) return;

      const isAr = state.arabicMode;
      const bookLabel = isAr && problem.bookAr ? problem.bookAr : problem.book;
      const unitLabel = isAr && problem.unitAr ? problem.unitAr : problem.unit;
      const statementContent = isAr && problem.statementAr ? problem.statementAr : problem.statement;
      const stepsList = isAr && problem.stepsAr ? problem.stepsAr : problem.steps;
      const answerLabel = isAr && problem.answerLabelAr ? problem.answerLabelAr : "Final Answer";

      dom.problemBook.textContent = bookLabel;
      dom.problemBook.classList.toggle("ar-text", isAr);

      dom.problemUnit.textContent = unitLabel;
      dom.problemUnit.classList.toggle("ar-text", isAr);

      dom.problemText.innerHTML = statementContent;
      dom.problemText.classList.toggle("ar-mode", isAr);

      dom.solutionHeader.textContent = isAr ? "خطوات الحل" : "Step-by-Step Derivation";
      dom.solutionHeader.classList.toggle("ar-text", isAr);

      dom.solutionSteps.innerHTML = stepsList
        .map(step => `<li>${step}</li>`)
        .join("");
      dom.solutionSteps.classList.toggle("ar-mode", isAr);

      dom.finalAnswer.innerHTML = `<strong>${answerLabel}:</strong> $${problem.answer}$`;
      dom.finalAnswer.classList.toggle("ar-mode", isAr);

      typesetMath(dom.problemText);
      typesetMath(dom.solutionCard);
    }

    function renderProblem(problem, labelNumber, meta) {
      state.currentProblem = problem;
      state.currentMeta = meta;
      setSolutionVisibility(false);
      updateSaveButtonState();

      dom.problemSeed.textContent = `SEED:${encodeSeedBase36(meta.seed)}`;
      dom.problemId.textContent = `#${String(labelNumber).padStart(3, "0")}`;

      applyProblemDisplay();
      syncUrlToProblem(meta);
    }

    function generateSeededProblem({ generatorId, seed }) {
      const seedNum = (seed >>> 0) || 1;
      const unitObj = ALL_UNITS.find(u => u.id === generatorId);

      activeRng = createSeededRng(seedNum);
      const selectedUnit = unitObj || Rand.pick(ALL_UNITS);
      const problem = selectedUnit.fn();
      activeRng = Math.random;

      return {
        problem,
        meta: {
          generatorId: selectedUnit.id,
          difficulty: DIFFICULTY,
          seed: seedNum
        }
      };
    }

    function loadNewProblem(forcedSeed = null, forcedGenId = null) {
      const genId = forcedGenId || (state.activeUnit === "all" ? null : state.activeUnit);
      const seed = forcedSeed !== null ? forcedSeed : generateRandomSeed();
      const { problem, meta } = generateSeededProblem({
        generatorId: genId,
        seed
      });

      state.problemIndex += 1;
      dom.statusNote.textContent = "";
      renderProblem(problem, state.problemIndex, meta);
    }

    dom.btnLangAr.addEventListener("click", () => {
      state.arabicMode = !state.arabicMode;
      dom.btnLangAr.classList.toggle("active", state.arabicMode);
      dom.btnLangAr.setAttribute("aria-pressed", String(state.arabicMode));
      applyProblemDisplay();
      renderSavedInMenu();
      dom.statusNote.textContent = state.arabicMode ? "Arabic translation active." : "English active.";
    });

    async function copyShareLink() {
      if (!state.currentMeta) return;
      const shareUrl = buildShareUrl(state.currentMeta);
      let copied = false;

      if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
        try {
          await navigator.clipboard.writeText(shareUrl);
          copied = true;
        } catch {
          copied = false;
        }
      }

      if (!copied) {
        const tempInput = document.createElement("input");
        tempInput.value = shareUrl;
        document.body.appendChild(tempInput);
        tempInput.select();
        try {
          copied = document.execCommand("copy");
        } catch {
          copied = false;
        }
        document.body.removeChild(tempInput);
      }

      if (copied) {
        dom.btnShare.classList.add("copied");
        dom.btnShare.classList.remove("secondary");
        dom.iconShare.innerHTML = `<polyline points="20 6 9 17 4 12" />`;
        dom.statusNote.textContent = "Copied seeded link.";
        setTimeout(() => {
          dom.btnShare.classList.remove("copied");
          dom.btnShare.classList.add("secondary");
          dom.iconShare.innerHTML = `
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
          `;
        }, 1600);
      } else {
        dom.statusNote.textContent = shareUrl;
      }
    }

    dom.btnShare.addEventListener("click", copyShareLink);

    dom.btnSave.addEventListener("click", () => {
      if (!state.currentProblem) return;
      const sig = getProblemSignature(state.currentProblem);
      const exists = state.savedProblems.some(item => item.id === sig);
      if (exists) {
        dom.statusNote.textContent = "Already saved.";
        updateSaveButtonState();
        return;
      }

      state.savedProblems.unshift({
        id: sig,
        book: state.currentProblem.book,
        bookAr: state.currentProblem.bookAr,
        unit: state.currentProblem.unit,
        unitAr: state.currentProblem.unitAr,
        statement: state.currentProblem.statement,
        statementAr: state.currentProblem.statementAr,
        steps: state.currentProblem.steps,
        stepsAr: state.currentProblem.stepsAr,
        answer: state.currentProblem.answer,
        answerLabelAr: state.currentProblem.answerLabelAr,
        meta: state.currentMeta ? { ...state.currentMeta } : null
      });
      persistSavedToStorage(state.savedProblems);
      updateSaveButtonState();
      renderSavedInMenu();
      dom.statusNote.textContent = "Saved.";
    });

    dom.savedMenuContainer.addEventListener("click", (e) => {
      const actionBtn = e.target.closest("[data-action]");
      if (!actionBtn) return;
      const card = actionBtn.closest(".saved-menu-item");
      if (!card) return;
      const id = decodeURIComponent(card.dataset.id);
      const action = actionBtn.dataset.action;

      if (action === "delete") {
        state.savedProblems = state.savedProblems.filter(item => item.id !== id);
        persistSavedToStorage(state.savedProblems);
        updateSaveButtonState();
        renderSavedInMenu();
        dom.statusNote.textContent = "Deleted.";
      } else if (action === "open") {
        const found = state.savedProblems.find(item => item.id === id);
        if (found) {
          dom.statusNote.textContent = "Opened saved problem.";
          if (found.meta && found.meta.seed) {
            const rebuilt = generateSeededProblem(found.meta);
            renderProblem(rebuilt.problem, state.problemIndex, rebuilt.meta);
          } else {
            renderProblem(found, state.problemIndex, state.currentMeta || {
              generatorId: "sequences",
              difficulty: DIFFICULTY,
              seed: generateRandomSeed()
            });
          }
          setMenuOpen(false);
        }
      }
    });

    dom.btnMenu.addEventListener("click", (e) => {
      e.stopPropagation();
      setMenuOpen(!state.menuOpen);
    });

    document.querySelectorAll(".book-header").forEach(headerBtn => {
      headerBtn.addEventListener("click", () => {
        headerBtn.parentElement.classList.toggle("collapsed");
      });
    });

    dom.menuDrawer.addEventListener("click", (e) => {
      const unitBtn = e.target.closest("[data-unit]");
      if (!unitBtn) return;
      state.activeUnit = unitBtn.dataset.unit;
      highlightActiveUnit();
      setMenuOpen(false);
      loadNewProblem();
    });

    document.addEventListener("click", (e) => {
      if (state.menuOpen && !dom.menuDrawer.contains(e.target) && !dom.btnMenu.contains(e.target)) {
        setMenuOpen(false);
      }
    });

    dom.btnNew.addEventListener("click", () => loadNewProblem());

    dom.btnToggle.addEventListener("click", () => {
      setSolutionVisibility(!state.solutionVisible);
    });

    function initFromUrlOrRandom() {
      const params = new URLSearchParams(window.location.search);
      const paramGen = params.get("gen");
      const paramSeed = parseSeedParam(params.get("seed"));

      const matchedUnit = ALL_UNITS.find(u => u.id === paramGen);
      if (matchedUnit && paramSeed !== null) {
        state.activeUnit = matchedUnit.id;
        highlightActiveUnit();
        const { problem, meta } = generateSeededProblem({
          generatorId: matchedUnit.id,
          seed: paramSeed
        });
        state.problemIndex += 1;
        dom.statusNote.textContent = "Loaded from seeded link.";
        renderProblem(problem, state.problemIndex, meta);
      } else if (paramSeed !== null) {
        highlightActiveUnit();
        const { problem, meta } = generateSeededProblem({
          generatorId: null,
          seed: paramSeed
        });
        state.problemIndex += 1;
        dom.statusNote.textContent = "Loaded from seeded link.";
        renderProblem(problem, state.problemIndex, meta);
      } else {
        if (matchedUnit) {
          state.activeUnit = matchedUnit.id;
        }
        highlightActiveUnit();
        loadNewProblem();
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      populateMenuUnits();
      renderSavedInMenu();
      const waitForKatex = setInterval(() => {
        if (typeof renderMathInElement === "function") {
          clearInterval(waitForKatex);
          initFromUrlOrRandom();
        }
      }, 30);
    });
  </script>
</body>
</html>
