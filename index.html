<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRAPS — Baccalaureate Mathematics Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg-primary: #1e1e1e;
      --bg-card: #252526;
      --bg-elevated: #2d2d30;
      --border-subtle: #333333;
      --border-active: #555555;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0a0;
      --text-muted: #767676;
      --accent: #4ea1f3;
      --accent-hover: #3b8be0;
      --accent-bg: rgba(78, 161, 243, 0.12);
      --success: #4ec9b0;
      --success-bg: rgba(78, 201, 176, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1.25rem 4rem;
    }

    .container {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      padding-bottom: 0.9rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand-logo {
      position: relative;
      display: inline-block;
      font-family: "Holing", "Pacifico", cursive;
      font-size: 2.35rem;
      line-height: 1.15;
      letter-spacing: 0.02em;
      color: #ef4437;
      transform: rotate(-4deg);
      padding-right: 10px;
      padding-bottom: 6px;
      user-select: none;
      text-shadow:
        2px 2px 0 #1e1e1e,
        4px 4px 0 #26c6da,
        6px 6px 0 #111111;
    }

    .brand-logo::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      color: #ef4437;
      -webkit-text-stroke: 1.5px #ef4437;
      pointer-events: none;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .title-group p {
      font-size: 0.84rem;
      color: var(--text-secondary);
    }

    .session-stats {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.82rem;
      color: var(--text-secondary);
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
    }

    .session-stats span strong {
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
    }

    .curriculum-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 1.1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .book-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .book-tab {
      background: var(--bg-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 7px;
      padding: 0.45rem 0.9rem;
      font-size: 0.84rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .book-tab:hover {
      color: var(--text-primary);
      border-color: var(--border-active);
    }

    .book-tab.active {
      background: var(--accent-bg);
      color: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
    }

    .unit-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .pill {
      background: var(--bg-primary);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 0.34rem 0.8rem;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }

    .pill:hover {
      border-color: var(--border-active);
      color: var(--text-primary);
    }

    .pill.active {
      background: var(--accent-bg);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 500;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 1.75rem;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.15rem;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
    }

    .meta-badges {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .badge {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      color: var(--accent);
      font-weight: 600;
    }

    .badge-book {
      color: var(--success);
    }

    .problem-statement {
      font-size: 1.08rem;
      color: var(--text-primary);
      line-height: 1.8;
    }

    .problem-statement .katex-display {
      margin: 1rem 0;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .btn-group {
      display: flex;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    button.btn {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.6rem 1.15rem;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--border-subtle);
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    button.btn-primary {
      background: var(--accent);
      color: #111111;
      border-color: var(--accent);
      font-weight: 600;
    }

    button.btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    button.btn-secondary {
      background: var(--bg-card);
      color: var(--text-primary);
    }

    button.btn-secondary:hover {
      background: var(--bg-elevated);
      border-color: var(--border-active);
    }

    .solution-card {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-left: 3px solid var(--success);
      border-radius: 10px;
      padding: 1.75rem;
    }

    .solution-card.visible {
      display: block;
    }

    .solution-header {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--success);
      font-weight: 600;
      margin-bottom: 1.1rem;
    }

    .steps-list {
      list-style: none;
      counter-reset: step-counter;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .steps-list li {
      counter-increment: step-counter;
      position: relative;
      padding-left: 2.2rem;
      font-size: 0.98rem;
      line-height: 1.75;
    }

    .steps-list li::before {
      content: counter(step-counter);
      position: absolute;
      left: 0;
      top: 0.2rem;
      width: 1.45rem;
      height: 1.45rem;
      border-radius: 50%;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 0.78rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .final-answer-box {
      margin-top: 1.35rem;
      padding: 0.9rem 1.15rem;
      background: var(--success-bg);
      border: 1px solid rgba(78, 201, 176, 0.3);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 1.05rem;
    }

    .final-answer-box strong {
      color: var(--success);
      margin-right: 0.5rem;
    }

    .katex {
      font-size: 1.08em;
    }

    @media (max-width: 600px) {
      .card, .solution-card {
        padding: 1.25rem;
      }
      .brand-logo {
        font-size: 1.95rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title-group">
        <span class="brand-logo" data-text="TRAPS">TRAPS</span>
        <p>Baccalaureate Analysis, Algebra &amp; Vectors</p>
      </div>
      <div class="session-stats">
        <span>Generated: <strong id="stat-generated">0</strong></span>
        <span>Solved: <strong id="stat-solved">0</strong></span>
      </div>
    </header>

    <div class="curriculum-panel">
      <div class="book-tabs" id="book-tabs">
        <button class="book-tab active" data-book="all">All Books</button>
        <button class="book-tab" data-book="analysis">1. Analysis</button>
        <button class="book-tab" data-book="algebra-vectors">2. Algebra and Vectors</button>
      </div>
      <div class="unit-pills" id="unit-pills"></div>
    </div>

    <main class="card">
      <div class="card-meta">
        <div class="meta-badges">
          <span class="badge badge-book" id="problem-book">Loading...</span>
          <span class="badge" id="problem-unit">Loading...</span>
        </div>
        <span id="problem-id">#001</span>
      </div>
      <div class="problem-statement" id="problem-text"></div>
    </main>

    <div class="controls">
      <div class="btn-group">
        <button class="btn btn-primary" id="btn-new">New Problem</button>
        <button class="btn btn-secondary" id="btn-toggle-solution">Show Solution</button>
      </div>
    </div>

    <section class="solution-card" id="solution-card">
      <div class="solution-header">Step-by-Step Derivation</div>
      <ol class="steps-list" id="solution-steps"></ol>
      <div class="final-answer-box" id="final-answer"></div>
    </section>
  </div>

  <script>
    /* =========================================================================
       1. EXACT ALGEBRAIC & SYMBOLIC UTILITIES
       ========================================================================= */
    const MathFmt = {
      gcd(a, b) {
        a = Math.abs(Math.round(a));
        b = Math.abs(Math.round(b));
        while (b !== 0) {
          const t = b;
          b = a % b;
          a = t;
        }
        return a === 0 ? 1 : a;
      },

      frac(n, d = 1) {
        if (d === 0) throw new Error("Division by zero");
        if (n === 0) return { n: 0, d: 1 };
        if (d < 0) { n = -n; d = -d; }
        const g = this.gcd(n, d);
        return { n: n / g, d: d / g };
      },

      addFrac(f1, f2) {
        return this.frac(f1.n * f2.d + f2.n * f1.d, f1.d * f2.d);
      },

      subFrac(f1, f2) {
        return this.frac(f1.n * f2.d - f2.n * f1.d, f1.d * f2.d);
      },

      mulFrac(f1, f2) {
        return this.frac(f1.n * f2.n, f1.d * f2.d);
      },

      texFrac(f) {
        if (f.n === 0) return "0";
        const sign = f.n < 0 ? "-" : "";
        const absN = Math.abs(f.n);
        if (f.d === 1) return `${sign}${absN}`;
        return `${sign}\\frac{${absN}}{${f.d}}`;
      },

      signedNum(k) {
        if (k === 0) return "";
        return k > 0 ? ` + ${k}` : ` - ${Math.abs(k)}`;
      },

      linear(a, b, v = "x") {
        let out = "";
        if (a !== 0) {
          if (a === 1) out += v;
          else if (a === -1) out += `-${v}`;
          else out += `${a}${v}`;
        }
        if (b !== 0) {
          out += out === "" ? `${b}` : this.signedNum(b);
        }
        return out === "" ? "0" : out;
      },

      rational(a, b, c, d, v = "x") {
        return `\\frac{${this.linear(a, b, v)}}{${this.linear(c, d, v)}}`;
      },

      coeff(k, sym, leading = true) {
        if (k === 0) return "";
        if (leading) {
          if (k === 1) return sym;
          if (k === -1) return `-${sym}`;
          return `${k}${sym}`;
        }
        if (k === 1) return ` + ${sym}`;
        if (k === -1) return ` - ${sym}`;
        return k > 0 ? ` + ${k}${sym}` : ` - ${Math.abs(k)}${sym}`;
      },

      simplifySqrt(n) {
        if (n === 0) return { out: 0, inside: 1 };
        let out = 1;
        let inside = n;
        for (let i = 2; i * i <= inside; i++) {
          while (inside % (i * i) === 0) {
            out *= i;
            inside /= (i * i);
          }
        }
        return { out, inside };
      },

      texSqrt(n) {
        if (n === 0) return "0";
        const { out, inside } = this.simplifySqrt(n);
        if (inside === 1) return `${out}`;
        if (out === 1) return `\\sqrt{${inside}}`;
        return `${out}\\sqrt{${inside}}`;
      },

      texPi(f) {
        if (f.n === 0) return "0";
        const sign = f.n < 0 ? "-" : "";
        const absN = Math.abs(f.n);
        const numStr = absN === 1 ? "\\pi" : `${absN}\\pi`;
        if (f.d === 1) return `${sign}${numStr}`;
        return `${sign}\\frac{${numStr}}{${f.d}}`;
      }
    };

    const Rand = {
      int(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      },
      pick(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      },
      nonZeroInt(min, max) {
        let v = 0;
        while (v === 0) v = this.int(min, max);
        return v;
      }
    };

    /* =========================================================================
       2. BOOK 1: ANALYSIS GENERATORS (7 UNITS)
       ========================================================================= */

    // Unit 1: Sequences
    function genSequences() {
      const mode = Rand.pick(["arithmetic-geometric", "recurrence-fixed-point"]);
      if (mode === "arithmetic-geometric") {
        // u_{n+1} = a * u_n + b with a != 1, fixed point L = b/(1-a), v_n = u_n - L is geometric with ratio a
        const a = Rand.pick([2, 3, -2, -3]);
        const oneMinusA = 1 - a;
        const k = Rand.nonZeroInt(-3, 3);
        const b = k * oneMinusA; // so L = k is an exact integer!
        let u0 = k;
        while (u0 === k) {
          u0 = k + Rand.nonZeroInt(-4, 4);
        }
        const v0 = u0 - k;
        const targetN = Rand.int(4, 7);
        // v_n = v0 * a^n => u_n = k + v0 * a^n
        const aPowN = Math.pow(a, targetN);
        const uN = k + v0 * aPowN;

        return {
          book: "Analysis",
          unit: "Sequences",
          statement: `Let $(u_n)_{n \\ge 0}$ be the sequence defined by $u_0 = ${u0}$ and for all $n \\ge 0$:
          $$u_{n+1} = ${MathFmt.coeff(a, "u_n", true)}${MathFmt.signedNum(b)}$$
          Find the closed form of $u_n$ and compute $u_{${targetN}}$.`,
          steps: [
            `Solve $L = ${MathFmt.coeff(a, "L", true)}${MathFmt.signedNum(b)}$ to find the fixed point:
            $$(${oneMinusA})L = ${b} \\implies L = ${k}$$`,
            `Define $v_n = u_n - ${k}$. Then:
            $$v_{n+1} = u_{n+1} - ${k} = ${MathFmt.coeff(a, "u_n", true)}${MathFmt.signedNum(b - k)} = ${a}(u_n - ${k}) = ${a}v_n$$
            So $(v_n)$ is geometric with first term $v_0 = ${u0} - (${k}) = ${v0}$ and common ratio $q = ${a}$.`,
            `Therefore $v_n = ${v0} \\cdot (${a})^n$, which gives:
            $$u_n = ${k}${v0 > 0 ? ` + ${v0}` : ` - ${Math.abs(v0)}`} \\cdot (${a})^n$$`,
            `Substitute $n = ${targetN}$:
            $$u_{${targetN}} = ${k}${v0 > 0 ? ` + ${v0}` : ` - ${Math.abs(v0)}`} \\cdot (${a})^{${targetN}} = ${k}${v0 > 0 ? ` + ${v0}` : ` - ${Math.abs(v0)}`} \\cdot (${aPowN}) = ${uN}$$`
          ],
          answer: `u_n = ${k}${v0 > 0 ? ` + ${v0}` : ` - ${Math.abs(v0)}`} \\cdot (${a})^n, \\quad u_{${targetN}} = ${uN}`
        };
      } else {
        // Telescoping sum / rational sequence u_n = 1/(k*(k+1))
        const m = Rand.int(4, 9);
        // S_m = sum_{k=1}^m 1/(k(k+1)) = 1 - 1/(m+1) = m/(m+1)
        const sFrac = MathFmt.frac(m, m + 1);
        return {
          book: "Analysis",
          unit: "Sequences",
          statement: `For each integer $n \\ge 1$, let $u_n = \\dfrac{1}{n(n+1)}$ and let $S_n = \\displaystyle\\sum_{k=1}^{n} u_k$. Compute $S_{${m}}$ and find $\\displaystyle\\lim_{n \\to +\\infty} S_n$.`,
          steps: [
            `Decompose the general term into partial fractions:
            $$u_k = \\frac{1}{k(k+1)} = \\frac{1}{k} - \\frac{1}{k+1}$$`,
            `Sum from $k = 1$ to $n$ to obtain a telescoping sum:
            $$S_n = \\left(1 - \\frac{1}{2}\\right) + \\left(\\frac{1}{2} - \\frac{1}{3}\\right) + \\cdots + \\left(\\frac{1}{n} - \\frac{1}{n+1}\\right) = 1 - \\frac{1}{n+1} = \\frac{n}{n+1}$$`,
            `Evaluate at $n = ${m}$: $S_{${m}} = \\dfrac{${m}}{${m + 1}}$, and as $n \\to +\\infty$, $\\dfrac{1}{n+1} \\to 0$, so $S_n \\to 1$.`
          ],
          answer: `S_{${m}} = \\frac{${sFrac.n}}{${sFrac.d}}, \\quad \\lim_{n \\to +\\infty} S_n = 1`
        };
      }
    }

    // Unit 2: Limits (incorporating reference composite rational & floor limit traps)
    function genLimits() {
      const type = Rand.pick(["composite-trap", "floor-trap"]);
      if (type === "composite-trap") {
        const c = Rand.pick([1, 2, 3]);
        const r = Rand.nonZeroInt(-4, 4);
        const a = c * r;
        const d = -c * r;
        let b = a * r;
        while (b === a * r || a * r + b === 0) {
          b = a * r + Rand.nonZeroInt(-6, 6);
        }
        const dirSign = Rand.pick([-1, 1]);
        const dirTex = dirSign === -1 ? "-\\infty" : "+\\infty";
        const k = b - a * r;
        const approachDir = (k * dirSign > 0) ? "+" : "-";
        const numAtR = a * r + b;
        const denomSign = approachDir === "+" ? 1 : -1;
        const finalInf = (numAtR * denomSign > 0) ? "+\\infty" : "-\\infty";

        return {
          book: "Analysis",
          unit: "Limits",
          statement: `Let $f$ be defined on $\\mathbb{R} \\setminus \\{${r}\\}$ by $f(x) = ${MathFmt.rational(a, b, c, d, "x")}$. Evaluate:
          $$\\lim_{x \\to ${dirTex}} f\\big[f(x)\\big]$$`,
          steps: [
            `As $x \\to ${dirTex}$, $f(x) = ${r} + \\dfrac{${k}}{${MathFmt.linear(c, d, "x")}} \\to ${r}^{${approachDir}}$ because $\\dfrac{${k}}{${MathFmt.linear(c, d, "x")}} \\to 0^{${approachDir}}$.`,
            `Since $${r}$ is the vertical asymptote of $f$, setting $u = f(x) \\to ${r}^{${approachDir}}$ gives numerator $\\to ${numAtR}$ and denominator $\\to 0^{${approachDir}}$.`
          ],
          answer: `\\lim_{x \\to ${dirTex}} f\\big[f(x)\\big] = ${finalInf}`
        };
      } else {
        const a = Rand.int(1, 5);
        const b = Rand.int(1, 6);
        const c = Rand.int(1, 4);
        const d = Rand.int(1, 7);
        const numTex = MathFmt.linear(a, b, "(x - E(x))");
        const denTex = MathFmt.linear(c, d, "x");
        return {
          book: "Analysis",
          unit: "Limits",
          statement: `Let $E(x)$ be the floor function and $f(x) = \\sqrt{\\dfrac{${numTex}}{${denTex}}}$ on $[0, +\\infty[$. Compute $\\displaystyle\\lim_{x \\to +\\infty} f(x)$.`,
          steps: [
            `Since $0 \\le x - E(x) < 1$ for all $x \\in \\mathbb{R}$, we have $${b} \\le ${numTex} < ${a + b}$.`,
            `For $x > 0$, dividing by $${denTex} > 0$ squeezes the radicand between two rational functions tending to $0$ as $x \\to +\\infty$.`,
            `By the Squeeze Theorem and continuity of $\\sqrt{\\cdot}$ at $0$, the limit is $0$.`
          ],
          answer: `\\lim_{x \\to +\\infty} f(x) = 0`
        };
      }
    }

    // Unit 3: Differentiation (incorporating reference chain rule + trig sign traps)
    function genDifferentiation() {
      const k = Rand.nonZeroInt(-5, 5);
      const innerIsCos = Rand.pick([true, false]);
      const innerFn = innerIsCos ? "\\cos x" : "\\sin x";
      const innerDeriv = innerIsCos ? "-\\sin x" : "\\cos x";
      const interval = innerIsCos
        ? Rand.pick([
            { tex: "]-\\pi, 0[", sign: -1, cond: "\\sin x < 0" },
            { tex: "]0, \\pi[", sign: 1, cond: "\\sin x > 0" }
          ])
        : Rand.pick([
            { tex: "\\left]-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right[", sign: 1, cond: "\\cos x > 0" },
            { tex: "\\left]\\frac{\\pi}{2}, \\frac{3\\pi}{2}\\right[", sign: -1, cond: "\\cos x < 0" }
          ]);
      const finalConst = innerIsCos ? (-k * interval.sign) : (k * interval.sign);
      const absTex = innerIsCos ? "|\\sin x|" : "|\\cos x|";
      const signedAbs = interval.sign === 1
        ? (innerIsCos ? "\\sin x" : "\\cos x")
        : (innerIsCos ? "-\\sin x" : "-\\cos x");

      return {
        book: "Analysis",
        unit: "Differentiation",
        statement: `Let $f$ be differentiable on $]-1, 1[$ with $f'(x) = \\dfrac{${k}}{\\sqrt{1 - x^2}}$, and define $g(x) = f(${innerFn})$ on $${interval.tex}$. Find $g'(x)$.`,
        steps: [
          `By the chain rule, $g'(x) = (${innerDeriv}) \\cdot \\dfrac{${k}}{\\sqrt{1 - ${innerIsCos ? "\\cos^2 x" : "\\sin^2 x"}}}$.`,
          `Since $\\sqrt{1 - ${innerIsCos ? "\\cos^2 x" : "\\sin^2 x"}} = ${absTex}$ and $${interval.cond}$ on $${interval.tex}$, we have $${absTex} = ${signedAbs}$.`,
          `Simplify: $g'(x) = \\dfrac{${k}(${innerDeriv})}{${signedAbs}} = ${finalConst}$.`
        ],
        answer: `g'(x) = ${finalConst}`
      };
    }

    // Unit 4: Monotonicity of a Sequence
    function genMonotonicitySequence() {
      const mode = Rand.pick(["difference", "ratio"]);
      if (mode === "difference") {
        // u_n = a*n + b + c/n for n >= 1; u_{n+1} - u_n = a - c/(n(n+1))
        const c = Rand.pick([2, 3, 4, 6]);
        const a = Rand.int(1, 3);
        const b = Rand.nonZeroInt(-5, 5);
        // For n >= 1, n(n+1) >= 2. If a * n(n+1) > c for all n >= 1, strictly increasing!
        // Choose c < 2 * a so u_{n+1} - u_n > 0 for all n >= 1
        const safeC = Math.min(c, 2 * a - 1) > 0 ? Math.min(c, 2 * a - 1) : 1;
        const isIncreasing = a * 2 > safeC;

        return {
          book: "Analysis",
          unit: "Monotonicity of a Sequence",
          statement: `Let $(u_n)_{n \\ge 1}$ be the sequence defined for all $n \\ge 1$ by:
          $$u_n = ${MathFmt.coeff(a, "n", true)}${MathFmt.signedNum(b)} + \\frac{${safeC}}{n}$$
          Study the monotonicity of $(u_n)_{n \\ge 1}$ by computing $u_{n+1} - u_n$.`,
          steps: [
            `Compute the consecutive difference for $n \\ge 1$:
            $$u_{n+1} - u_n = \\left(${a}(n+1)${MathFmt.signedNum(b)} + \\frac{${safeC}}{n+1}\\right) - \\left(${a}n${MathFmt.signedNum(b)} + \\frac{${safeC}}{n}\\right)$$`,
            `Combine terms over a common denominator:
            $$u_{n+1} - u_n = ${a} - ${safeC}\\left(\\frac{1}{n} - \\frac{1}{n+1}\\right) = ${a} - \\frac{${safeC}}{n(n+1)} = \\frac{${a}n(n+1) - ${safeC}}{n(n+1)}$$`,
            `Since $n \\ge 1$, we have $n(n+1) \\ge 2$, so ${isIncreasing
              ? `$${a}n(n+1) - ${safeC} \\ge ${2 * a - safeC} > 0$, meaning $u_{n+1} - u_n > 0$ for all $n \\ge 1$.`
              : `check sign carefully.`}`
          ],
          answer: isIncreasing
            ? `(u_n)_{n \\ge 1} \\text{ is strictly increasing}`
            : `(u_n)_{n \\ge 1} \\text{ is strictly decreasing}`
        };
      } else {
        // u_n = a^n / n! -> u_{n+1}/u_n = a / (n+1)
        const a = Rand.int(2, 6);
        return {
          book: "Analysis",
          unit: "Monotonicity of a Sequence",
          statement: `Consider the positive sequence $(u_n)_{n \\ge 1}$ defined by $u_n = \\dfrac{${a}^n}{n!}$. Compute $\\dfrac{u_{n+1}}{u_n}$ and determine for which ranks $n$ the sequence is strictly decreasing.`,
          steps: [
            `Since $u_n > 0$ for all $n \\ge 1$, form the ratio:
            $$\\frac{u_{n+1}}{u_n} = \\frac{${a}^{n+1}}{(n+1)!} \\cdot \\frac{n!}{${a}^n} = \\frac{${a}}{n+1}$$`,
            `We have $\\dfrac{u_{n+1}}{u_n} < 1 \\iff \\dfrac{${a}}{n+1} < 1 \\iff n + 1 > ${a} \\iff n \\ge ${a}$.`
          ],
          answer: `\\frac{u_{n+1}}{u_n} = \\frac{${a}}{n+1}; \\text{ strictly decreasing for } n \\ge ${a}`
        };
      }
    }

    // Unit 5: Logarithmic Function
    function genLogarithmic() {
      const mode = Rand.pick(["equation", "derivative-limit"]);
      if (mode === "equation") {
        // ln(x + a) + ln(x + b) = ln(c) => (x+a)(x+b) = c
        // Pick integer roots x1, x2 such that x + a > 0 and x + b > 0
        const r1 = Rand.int(2, 6);
        const a = Rand.int(1, 4);
        const b = Rand.int(1, 4);
        // Let x = r1 be a solution: c = (r1 + a)(r1 + b)
        const c = (r1 + a) * (r1 + b);
        const minDomain = Math.max(-a, -b);

        return {
          book: "Analysis",
          unit: "Logarithmic Function",
          statement: `Solve in $\\mathbb{R}$ the logarithmic equation:
          $$\\ln(${MathFmt.linear(1, a, "x")}) + \\ln(${MathFmt.linear(1, b, "x")}) = \\ln(${c})$$`,
          steps: [
            `Determine the domain of validity: we need ${MathFmt.linear(1, a, "x")} > 0$ and ${MathFmt.linear(1, b, "x")} > 0$, so $x > ${minDomain}$.`,
            `Use $\\ln A + \\ln B = \\ln(AB)$ and injectivity of $\\ln$ on $]0, +\\infty[$:
            $$(${MathFmt.linear(1, a, "x")})(${MathFmt.linear(1, b, "x")}) = ${c}$$
            $$x^2 + ${a + b}x + ${a * b - c} = 0$$`,
            `Check $x = ${r1}$: $(${r1 + a})(${r1 + b}) = ${c}$ and $${r1} > ${minDomain}$. Any root with $x \\le ${minDomain}$ is rejected.`
          ],
          answer: `x = ${r1}`
        };
      } else {
        const k = Rand.nonZeroInt(-5, 5);
        const a = Rand.nonZeroInt(-4, 4);
        return {
          book: "Analysis",
          unit: "Logarithmic Function",
          statement: `Let $f(x) = ${MathFmt.coeff(k, "\\ln\\big(" + MathFmt.linear(1, a, "x") + "\\big)", true)}$ on $]${-a}, +\\infty[$. Compute $f'(x)$ and evaluate $\\displaystyle\\lim_{x \\to (${-a})^+} f(x)$.`,
          steps: [
            `Differentiate using $(\\ln u)' = \\dfrac{u'}{u}$ with $u = ${MathFmt.linear(1, a, "x")}$ and $u' = 1$:
            $$f'(x) = \\frac{${k}}{${MathFmt.linear(1, a, "x")}}$$`,
            `As $x \\to (${-a})^+$, ${MathFmt.linear(1, a, "x")} \\to 0^+$, so $\\ln(${MathFmt.linear(1, a, "x")}) \\to -\\infty$. Multiplying by $${k}$ yields $${k > 0 ? "-\\infty" : "+\\infty"}$.`
          ],
          answer: `f'(x) = \\frac{${k}}{${MathFmt.linear(1, a, "x")}}, \\quad \\lim_{x \\to (${-a})^+} f(x) = ${k > 0 ? "-\\infty" : "+\\infty"}`
        };
      }
    }

    // Unit 6: Exponential Function
    function genExponential() {
      const k = Rand.nonZeroInt(-4, 4);
      const a = Rand.nonZeroInt(-4, 4);
      // f(x) = (k*x + m)*e^{a*x} -> derivative (k + a*(k*x + m))*e^{a*x}
      const m = Rand.nonZeroInt(-5, 5);
      const constPart = k + a * m;
      const xCoeff = a * k;

      return {
        book: "Analysis",
        unit: "Exponential Function",
        statement: `Let $f$ be the function defined on $\\mathbb{R}$ by:
        $$f(x) = \\big(${MathFmt.linear(k, m, "x")}\\big)e^{${MathFmt.coeff(a, "x", true)}}$$
        Compute $f'(x)$ in factored form and determine $\\displaystyle\\lim_{x \\to +\\infty} f(x)$ when $a = ${a}$.`,
        steps: [
          `Apply the product rule $(uv)' = u'v + uv'$ with $u(x) = ${MathFmt.linear(k, m, "x")}$ and $v(x) = e^{${MathFmt.coeff(a, "x", true)}}$:
          $$f'(x) = ${k}e^{${MathFmt.coeff(a, "x", true)}} + (${a})(${MathFmt.linear(k, m, "x")})e^{${MathFmt.coeff(a, "x", true)}}$$`,
          `Factor out $e^{${MathFmt.coeff(a, "x", true)}}$ and simplify the polynomial factor:
          $$f'(x) = \\big(${MathFmt.linear(xCoeff, constPart, "x")}\\big)e^{${MathFmt.coeff(a, "x", true)}}$$`,
          `As $x \\to +\\infty$, ${a < 0
            ? `$e^{${MathFmt.coeff(a, "x", true)}} \\to 0$ dominates any polynomial growth, so $f(x) \\to 0$.`
            : `both $${MathFmt.linear(k, m, "x")}$ and $e^{${MathFmt.coeff(a, "x", true)}}$ grow without bound, so the limit is $${(k > 0 ? "+" : "-")}\\infty$.`}`
        ],
        answer: `f'(x) = \\big(${MathFmt.linear(xCoeff, constPart, "x")}\\big)e^{${MathFmt.coeff(a, "x", true)}}, \\quad \\lim_{x \\to +\\infty} f(x) = ${a < 0 ? "0" : (k > 0 ? "+\\infty" : "-\\infty")}`
      };
    }

    // Unit 7: Integration
    function genIntegration() {
      // Definite integral of (a*x^2 + b*x + c) from 0 to p
      const p = Rand.int(1, 4);
      const a = 3 * Rand.nonZeroInt(-2, 2); // divisible by 3 for clean antiderivative
      const b = 2 * Rand.nonZeroInt(-3, 3); // divisible by 2 for clean antiderivative
      const c = Rand.nonZeroInt(-5, 5);

      // Antiderivative F(x) = (a/3) x^3 + (b/2) x^2 + c x
      const c3 = a / 3;
      const c2 = b / 2;

      const fAtP = MathFmt.frac(a * Math.pow(p, 3), 3).n + MathFmt.frac(b * Math.pow(p, 2), 2).n + c * p;
      // Since a is multiple of 3 and b is multiple of 2, fAtP is an exact integer!
      const exactVal = (a / 3) * Math.pow(p, 3) + (b / 2) * Math.pow(p, 2) + c * p;

      return {
        book: "Analysis",
        unit: "Integration",
        statement: `Evaluate the definite integral:
        $$I = \\int_{0}^{${p}} \\left(${a}x^2${MathFmt.coeff(b, "x", false)}${MathFmt.signedNum(c)}\\right) dx$$`,
        steps: [
          `Find an antiderivative $F(x)$ of $f(x) = ${a}x^2${MathFmt.coeff(b, "x", false)}${MathFmt.signedNum(c)}$:
          $$F(x) = ${MathFmt.coeff(c3, "x^3", true)}${MathFmt.coeff(c2, "x^2", false)}${MathFmt.coeff(c, "x", false)}$$`,
          `Evaluate $F(${p}) - F(0)$ with $F(0) = 0$:
          $$I = F(${p}) - 0 = ${c3}(${p})^3${c2 >= 0 ? ` + ${c2}` : ` - ${Math.abs(c2)}`}(${p})^2${c >= 0 ? ` + ${c}` : ` - ${Math.abs(c)}`}(${p}) = ${exactVal}$$`
        ],
        answer: `I = ${exactVal}`
      };
    }

    // Unit 1: Vector
    function genVector() {
      const u = [Rand.nonZeroInt(-4, 4), Rand.nonZeroInt(-4, 4), Rand.nonZeroInt(-4, 4)];
      const v = [Rand.nonZeroInt(-4, 4), Rand.nonZeroInt(-4, 4), Rand.nonZeroInt(-4, 4)];
      const dot = u[0] * v[0] + u[1] * v[1] + u[2] * v[2];
      // Cross product u x v
      const cx = u[1] * v[2] - u[2] * v[1];
      const cy = u[2] * v[0] - u[0] * v[2];
      const cz = u[0] * v[1] - u[1] * v[0];
      const normSq = cx * cx + cy * cy + cz * cz;

      return {
        book: "Algebra and Vectors",
        unit: "Vector",
        statement: `In an orthonormal basis $(\\vec{i}, \\vec{j}, \\vec{k})$, consider $\\vec{u}(${u[0]}, ${u[1]}, ${u[2]})$ and $\\vec{v}(${v[0]}, ${v[1]}, ${v[2]})$. Compute the dot product $\\vec{u} \\cdot \\vec{v}$ and the norm $\\|\\vec{u} \\times \\vec{v}\\|$.`,
        steps: [
          `Compute the dot product:
          $$\\vec{u} \\cdot \\vec{v} = (${u[0]})(${v[0]}) + (${u[1]})(${v[1]}) + (${u[2]})(${v[2]}) = ${dot}$$`,
          `Compute the cross product $\\vec{u} \\times \\vec{v}$:
          $$\\vec{u} \\times \\vec{v} = \\big(${u[1]}(${v[2]}) - ${u[2]}(${v[1]}),\\; ${u[2]}(${v[0]}) - ${u[0]}(${v[2]}),\\; ${u[0]}(${v[1]}) - ${u[1]}(${v[0]})\\big) = (${cx}, ${cy}, ${cz})$$`,
          `Take the Euclidean norm:
          $$\\|\\vec{u} \\times \\vec{v}\\| = \\sqrt{(${cx})^2 + (${cy})^2 + (${cz})^2} = \\sqrt{${normSq}} = ${MathFmt.texSqrt(normSq)}$$`
        ],
        answer: `\\vec{u} \\cdot \\vec{v} = ${dot}, \\quad \\|\\vec{u} \\times \\vec{v}\\| = ${MathFmt.texSqrt(normSq)}`
      };
    }

    // Unit 2: Complex Numbers (incorporating reference argument trap)
    function genComplexNumbers() {
      const m = Rand.pick([1, 2, 3]);
      const iLabel = m === 1 ? "i" : (m === 2 ? "-1" : "-i");
      const iArg = MathFmt.frac(m, 2);

      const alphas = [
        { tex: "\\frac{\\pi}{6}", f: MathFmt.frac(1, 6) },
        { tex: "\\frac{\\pi}{4}", f: MathFmt.frac(1, 4) },
        { tex: "\\frac{\\pi}{3}", f: MathFmt.frac(1, 3) },
        { tex: "-\\frac{\\pi}{3}", f: MathFmt.frac(-1, 3) },
        { tex: "\\frac{2\\pi}{3}", f: MathFmt.frac(2, 3) }
      ];
      const alpha = Rand.pick(alphas);

      const denoms = [
        { tex: "1 - \\sqrt{3}", arg: MathFmt.frac(1, 1), reason: "$1 - \\sqrt{3} < 0 \\implies \\arg(1 - \\sqrt{3}) \\equiv \\pi \\pmod{2\\pi}$" },
        { tex: "1 + i\\sqrt{3}", arg: MathFmt.frac(1, 3), reason: "$1 + i\\sqrt{3} = 2e^{i\\pi/3} \\implies \\arg(1 + i\\sqrt{3}) \\equiv \\frac{\\pi}{3} \\pmod{2\\pi}$" },
        { tex: "-1 + i\\sqrt{3}", arg: MathFmt.frac(2, 3), reason: "$-1 + i\\sqrt{3} = 2e^{i2\\pi/3} \\implies \\arg(-1 + i\\sqrt{3}) \\equiv \\frac{2\\pi}{3} \\pmod{2\\pi}$" },
        { tex: "\\sqrt{3} + i", arg: MathFmt.frac(1, 6), reason: "$\\sqrt{3} + i = 2e^{i\\pi/6} \\implies \\arg(\\sqrt{3} + i) \\equiv \\frac{\\pi}{6} \\pmod{2\\pi}$" }
      ];
      const denom = Rand.pick(denoms);

      let rawArg = MathFmt.subFrac(MathFmt.addFrac(iArg, alpha.f), denom.arg);
      let norm = { n: rawArg.n, d: rawArg.d };
      while (norm.n > norm.d) norm = MathFmt.subFrac(norm, MathFmt.frac(2, 1));
      while (norm.n <= -norm.d) norm = MathFmt.addFrac(norm, MathFmt.frac(2, 1));

      return {
        book: "Algebra and Vectors",
        unit: "Complex Numbers",
        statement: `Find the principal argument $\\arg(Z) \\in ]-\\pi, \\pi]$ for:
        $$Z = \\frac{${iLabel} \\cdot e^{i${alpha.tex}}}{${denom.tex}}$$`,
        steps: [
          `Apply $\\arg\\!\\left(\\frac{u \\cdot v}{w}\\right) \\equiv \\arg(u) + \\arg(v) - \\arg(w) \\pmod{2\\pi}$.`,
          `Here $\\arg(${iLabel}) \\equiv ${MathFmt.texPi(iArg)}$, $\\arg(e^{i${alpha.tex}}) \\equiv ${MathFmt.texPi(alpha.f)}$, and ${denom.reason}.`,
          `Sum and reduce into $]-\\pi, \\pi]$ to get $${MathFmt.texPi(norm)}$.`
        ],
        answer: `\\arg(Z) = ${MathFmt.texPi(norm)}`
      };
    }

    // Unit 3: Applications of Complex Numbers in Geometry
    function genComplexGeometry() {
      // Three points A(z_A), B(z_B), C(z_C); angle at A is arg((z_C - z_A)/(z_B - z_A))
      // Pick z_A = 1 + i, z_B = 2 + i (so z_B - z_A = 1), z_C = 1 + 2i (so z_C - z_A = i -> angle pi/2)
      // Or pick rotation by pi/3 or pi/4 from z_B - z_A = r * e^{i*theta}
      const ax = Rand.nonZeroInt(-3, 3);
      const ay = Rand.nonZeroInt(-3, 3);
      const bx = ax + 2;
      const by = ay; // vector AB = 2 (real, argument 0)
      const angleChoice = Rand.pick([
        { tex: "\\frac{\\pi}{2}", dx: 0, dy: 2, desc: "right angle at $A$" },
        { tex: "\\frac{\\pi}{4}", dx: 2, dy: 2, desc: "isosceles right triangle at $A$" },
        { tex: "-\\frac{\\pi}{2}", dx: 0, dy: -2, desc: "right angle at $A$ (clockwise)" }
      ]);
      const cx = ax + angleChoice.dx;
      const cy = ay + angleChoice.dy;

      return {
        book: "Algebra and Vectors",
        unit: "Applications of Complex Numbers in Geometry",
        statement: `In the Argand plane, let $A$, $B$, and $C$ have affixes $z_A = ${MathFmt.linear(ax, ay, "").replace(/^0 \+ /, "") || ax}${ay >= 0 ? ` + ${ay}i` : ` - ${Math.abs(ay)}i`}$, $z_B = ${bx}${by >= 0 ? ` + ${by}i` : ` - ${Math.abs(by)}i`}$, and $z_C = ${cx}${cy >= 0 ? ` + ${cy}i` : ` - ${Math.abs(cy)}i`}$. Determine a measure of the oriented angle $\\widehat{(\\vec{AB}, \\vec{AC})}$.`,
        steps: [
          `Recall that $\\widehat{(\\vec{AB}, \\vec{AC})} \\equiv \\arg\\!\\left(\\dfrac{z_C - z_A}{z_B - z_A}\\right) \\pmod{2\\pi}$.`,
          `Compute $z_B - z_A = (${bx - ax})${by - ay >= 0 ? ` + ${by - ay}i` : ` - ${Math.abs(by - ay)}i`} = 2$ and $z_C - z_A = (${cx - ax})${cy - ay >= 0 ? ` + ${cy - ay}i` : ` - ${Math.abs(cy - ay)}i`}$.`,
          `Thus $\\dfrac{z_C - z_A}{z_B - z_A} = \\dfrac{${cx - ax}${cy - ay >= 0 ? ` + ${cy - ay}i` : ` - ${Math.abs(cy - ay)}i`}}{2}$, whose argument is $${angleChoice.tex}$ (a ${angleChoice.desc}).`
        ],
        answer: `\\widehat{(\\vec{AB}, \\vec{AC})} = ${angleChoice.tex} \\pmod{2\\pi}`
      };
    }

    // Unit 4: Harmonic Analysis
    function genHarmonicAnalysis() {
      // Express a*cos(w*t) + b*sin(w*t) in amplitude-phase form R*cos(w*t - phi)
      // Choose Pythagorean or special-angle pair (a, b): e.g. (1, 1) -> sqrt(2) cos(wt - pi/4),
      // (sqrt(3), 1) -> 2 cos(wt - pi/6), (1, sqrt(3)) -> 2 cos(wt - pi/3), or (3, 4) -> 5
      const presets = [
        { a: "1", b: "1", rTex: "\\sqrt{2}", phiTex: "\\frac{\\pi}{4}" },
        { a: "-1", b: "1", rTex: "\\sqrt{2}", phiTex: "\\frac{3\\pi}{4}" },
        { a: "1", b: "-1", rTex: "\\sqrt{2}", phiTex: "-\\frac{\\pi}{4}" },
        { a: "\\sqrt{3}", b: "1", rTex: "2", phiTex: "\\frac{\\pi}{6}" },
        { a: "1", b: "\\sqrt{3}", rTex: "2", phiTex: "\\frac{\\pi}{3}" },
        { a: "\\sqrt{3}", b: "-1", rTex: "2", phiTex: "-\\frac{\\pi}{6}" }
      ];
      const p = Rand.pick(presets);
      const w = Rand.int(2, 6);
      const bSign = p.b.startsWith("-") ? ` - ${p.b.slice(1)}` : ` + ${p.b}`;

      return {
        book: "Algebra and Vectors",
        unit: "Harmonic Analysis",
        statement: `Write the sinusoidal signal $x(t) = ${p.a}\\cos(${w}t)${bSign}\\sin(${w}t)$ in the form $R\\cos(${w}t - \\varphi)$ with $R > 0$ and $\\varphi \\in ]-\\pi, \\pi]$.`,
        steps: [
          `Compute the amplitude $R = \\sqrt{a^2 + b^2} = ${p.rTex}$.`,
          `Factor out $R$:
          $$x(t) = ${p.rTex}\\left(\\frac{${p.a}}{${p.rTex}}\\cos(${w}t) + \\frac{${p.b}}{${p.rTex}}\\sin(${w}t)\\right)$$`,
          `Identify $\\cos\\varphi = \\dfrac{${p.a}}{${p.rTex}}$ and $\\sin\\varphi = \\dfrac{${p.b}}{${p.rTex}}$, giving $\\varphi = ${p.phiTex}$.`
        ],
        answer: `x(t) = ${p.rTex}\\cos\\!\\left(${w}t - \\left(${p.phiTex}\\right)\\right)`
      };
    }

    // Unit 5: Probability
    function genProbability() {
      // Urn with r red and b blue balls; draw 2 without replacement -> P(both red)
      const r = Rand.int(3, 6);
      const b = Rand.int(2, 5);
      const total = r + b;
      const prob = MathFmt.frac(r * (r - 1), total * (total - 1));

      return {
        book: "Algebra and Vectors",
        unit: "Probability",
        statement: `An urn contains $${r}$ red balls and $${b}$ blue balls, all indistinguishable to the touch. Two balls are drawn successively without replacement. Compute the probability that both drawn balls are red.`,
        steps: [
          `Total number of balls in the urn is $N = ${r} + ${b} = ${total}$.`,
          `By the multiplication rule for conditional probability, let $R_1$ and $R_2$ be drawing a red ball on the first and second draws:
          $$P(R_1 \\cap R_2) = P(R_1) \\cdot P(R_2 \\mid R_1) = \\frac{${r}}{${total}} \\cdot \\frac{${r - 1}}{${total - 1}}$$`,
          `Simplify the fraction:
          $$P(R_1 \\cap R_2) = \\frac{${r * (r - 1)}}{${total * (total - 1)}} = ${MathFmt.texFrac(prob)}$$`
        ],
        answer: `P = ${MathFmt.texFrac(prob)}`
      };
    }

    };

    function getAvailableUnits() {
      if (state.activeBook === "all") {
        return [
          ...CURRICULUM.analysis.units,
          ...CURRICULUM["algebra-vectors"].units
        ];
      }
      return CURRICULUM[state.activeBook].units;
    }

    function renderUnitPills() {
      const units = getAvailableUnits();
      const pillsHtml = [
        `<button class="pill ${state.activeUnit === "all" ? "active" : ""}" data-unit="all">All Units (Random)</button>`,
        ...units.map(u => `<button class="pill ${state.activeUnit === u.id ? "active" : ""}" data-unit="${u.id}">${u.label}</button>`)
      ].join("");
      dom.unitPills.innerHTML = pillsHtml;
    }

    function typesetMath(element) {
      if (typeof renderMathInElement === "function") {
        renderMathInElement(element, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false }
          ],
          throwOnError: false
        });
      }
    }

    function updateStats() {
      dom.statGenerated.textContent = state.generatedCount;
      dom.statSolved.textContent = state.solvedCount;
    }

    function setSolutionVisibility(visible) {
      state.solutionVisible = visible;
      if (visible) {
        dom.solutionCard.classList.add("visible");
        dom.btnToggle.textContent = "Hide Solution";
        if (!state.currentSolved) {
          state.currentSolved = true;
          state.solvedCount += 1;
          updateStats();
        }
      } else {
        dom.solutionCard.classList.remove("visible");
        dom.btnToggle.textContent = "Show Solution";
      }
    }

    function loadNewProblem() {
      const units = getAvailableUnits();
      const selectedUnit = state.activeUnit === "all"
        ? Rand.pick(units)
        : (units.find(u => u.id === state.activeUnit) || Rand.pick(units));

      const problem = selectedUnit.fn();

      state.generatedCount += 1;
      state.currentSolved = false;
      setSolutionVisibility(false);
      updateStats();

      dom.problemBook.textContent = problem.book;
      dom.problemUnit.textContent = problem.unit;
      dom.problemId.textContent = `#${String(state.generatedCount).padStart(3, "0")}`;
      dom.problemText.innerHTML = problem.statement;

      dom.solutionSteps.innerHTML = problem.steps
        .map(step => `<li>${step}</li>`)
        .join("");
      dom.finalAnswer.innerHTML = `<strong>Final Answer:</strong> $${problem.answer}$`;

      typesetMath(dom.problemText);
      typesetMath(dom.solutionCard);
    }

    dom.bookTabs.addEventListener("click", (e) => {
      const tab = e.target.closest(".book-tab");
      if (!tab) return;
      document.querySelectorAll(".book-tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      state.activeBook = tab.dataset.book;
      state.activeUnit = "all";
      renderUnitPills();
      loadNewProblem();
    });

    dom.unitPills.addEventListener("click", (e) => {
      const pill = e.target.closest(".pill");
      if (!pill) return;
      state.activeUnit = pill.dataset.unit;
      renderUnitPills();
      loadNewProblem();
    });

    dom.btnNew.addEventListener("click", loadNewProblem);

    dom.btnToggle.addEventListener("click", () => {
      setSolutionVisibility(!state.solutionVisible);
    });

    window.addEventListener("DOMContentLoaded", () => {
      renderUnitPills();
      const waitForKatex = setInterval(() => {
        if (typeof renderMathInElement === "function") {
          clearInterval(waitForKatex);
          loadNewProblem();
        }
      }, 30);
    });
  </script>
</body>
</html>
