<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRAPS — Baccalaureate Mathematics Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg-primary: #1e1e1e;
      --bg-card: #252526;
      --bg-elevated: #2d2d30;
      --border-subtle: #333333;
      --border-active: #555555;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0a0;
      --text-muted: #767676;
      --accent: #4ea1f3;
      --accent-hover: #3b8be0;
      --accent-bg: rgba(78, 161, 243, 0.12);
      --success: #4ec9b0;
      --success-bg: rgba(78, 201, 176, 0.12);
      --danger: #f16c6c;
      --danger-bg: rgba(241, 108, 108, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.75rem 1.25rem 4rem;
    }

    .container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      position: relative;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-subtle);
      position: relative;
    }

    .brand-logo {
      position: relative;
      display: inline-block;
      font-family: "Holing", "Pacifico", cursive;
      font-size: 2.2rem;
      line-height: 1.15;
      letter-spacing: 0.02em;
      color: #ef4437;
      transform: rotate(-4deg);
      padding-right: 10px;
      padding-bottom: 6px;
      user-select: none;
      text-shadow:
        2px 2px 0 #1e1e1e,
        4px 4px 0 #26c6da,
        6px 6px 0 #111111;
    }

    .brand-logo::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      color: #ef4437;
      -webkit-text-stroke: 1.5px #ef4437;
      pointer-events: none;
    }

    .hamburger-btn {
      width: 48px;
      height: 48px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      color: var(--text-primary);
      cursor: pointer;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .hamburger-btn:hover {
      background: var(--bg-elevated);
      border-color: var(--border-active);
    }

    .hamburger-line {
      width: 18px;
      height: 2px;
      background: currentColor;
      border-radius: 2px;
    }

    .menu-drawer {
      display: none;
      position: absolute;
      top: calc(100% + 0.5rem);
      right: 0;
      width: 360px;
      max-width: 100%;
      max-height: 78vh;
      overflow-y: auto;
      background: var(--bg-card);
      border: 1px solid var(--border-active);
      border-radius: 10px;
      padding: 0.65rem;
      z-index: 50;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
    }

    .menu-drawer.open {
      display: block;
    }

    .menu-all-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-primary);
      padding: 0.5rem 0.7rem;
      border-radius: 6px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 0.35rem;
    }

    .menu-all-btn:hover,
    .menu-all-btn.active {
      background: var(--accent-bg);
      color: var(--accent);
      border-color: rgba(78, 161, 243, 0.35);
    }

    .book-section {
      border-top: 1px solid var(--border-subtle);
      padding-top: 0.35rem;
      margin-top: 0.25rem;
    }

    .book-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: transparent;
      border: none;
      color: var(--text-primary);
      padding: 0.5rem 0.65rem;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
    }

    .book-header:hover {
      background: var(--bg-elevated);
    }

    .book-chevron {
      font-size: 0.75rem;
      color: var(--text-secondary);
      transition: transform 0.15s ease;
    }

    .book-section.collapsed .book-chevron {
      transform: rotate(-90deg);
    }

    .book-section.collapsed .unit-list,
    .book-section.collapsed .saved-menu-list {
      display: none;
    }

    .unit-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      padding: 0.15rem 0 0.35rem 0.6rem;
    }

    .unit-item-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 0.42rem 0.65rem;
      border-radius: 6px;
      font-size: 0.84rem;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .unit-item-btn:hover {
      background: var(--bg-elevated);
      color: var(--text-primary);
    }

    .unit-item-btn.active {
      background: var(--accent-bg);
      color: var(--accent);
      font-weight: 500;
    }

    .saved-menu-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      padding: 0.25rem 0.25rem 0.35rem;
    }

    .saved-menu-empty {
      font-size: 0.8rem;
      color: var(--text-muted);
      padding: 0.3rem 0.4rem;
    }

    .saved-menu-item {
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 7px;
      padding: 0.55rem 0.65rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .saved-menu-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.72rem;
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
    }

    .saved-menu-preview {
      font-size: 0.82rem;
      color: var(--text-primary);
      line-height: 1.45;
      max-height: 4.5rem;
      overflow: hidden;
    }

    .saved-menu-actions {
      display: flex;
      gap: 0.4rem;
      justify-content: flex-end;
    }

    .btn-mini {
      font-family: inherit;
      font-size: 0.74rem;
      padding: 0.25rem 0.55rem;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      color: var(--text-primary);
      transition: all 0.12s ease;
    }

    .btn-mini:hover {
      border-color: var(--border-active);
    }

    .btn-mini.delete:hover {
      background: var(--danger-bg);
      border-color: rgba(241, 108, 108, 0.45);
      color: var(--danger);
    }

    /* Two-Section Problem Block */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      overflow: hidden;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      min-height: 54px;
      padding: 0.85rem 1.5rem;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
    }

    .meta-badges {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
      overflow: hidden;
    }

    .badge {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 0.24rem 0.65rem;
      border-radius: 5px;
      color: var(--accent);
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-book {
      color: var(--success);
    }

    .badge-unit {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .problem-number {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .problem-body {
      padding: 1.75rem;
    }

    .problem-statement {
      font-size: 1.08rem;
      color: var(--text-primary);
      line-height: 1.8;
    }

    .problem-statement .katex-display {
      margin: 1rem 0;
    }

    /* Centered Icon Action Controls */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
    }

    .btn-group {
      display: flex;
      gap: 0.85rem;
      align-items: center;
      justify-content: center;
    }

    button.icon-btn {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    button.icon-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    button.icon-btn.primary {
      background: var(--accent);
      color: #111111;
      border-color: var(--accent);
    }

    button.icon-btn.primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    button.icon-btn.secondary:hover {
      background: var(--bg-elevated);
      border-color: var(--border-active);
    }

    button.icon-btn.active-toggle {
      background: var(--accent-bg);
      color: var(--accent);
      border-color: var(--accent);
    }

    button.icon-btn.saved {
      background: var(--success-bg);
      color: var(--success);
      border-color: rgba(78, 201, 176, 0.45);
    }

    button.icon-btn.saved svg {
      fill: var(--success);
    }

    .status-note {
      font-size: 0.82rem;
      color: var(--text-secondary);
      min-height: 1.15rem;
      text-align: center;
    }

    .solution-card {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-left: 3px solid var(--success);
      border-radius: 10px;
      padding: 1.75rem;
    }

    .solution-card.visible {
      display: block;
    }

    .solution-header {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--success);
      font-weight: 600;
      margin-bottom: 1.1rem;
    }

    .steps-list {
      list-style: none;
      counter-reset: step-counter;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .steps-list li {
      counter-increment: step-counter;
      position: relative;
      padding-left: 2.2rem;
      font-size: 0.98rem;
      line-height: 1.75;
    }

    .steps-list li::before {
      content: counter(step-counter);
      position: absolute;
      left: 0;
      top: 0.2rem;
      width: 1.45rem;
      height: 1.45rem;
      border-radius: 50%;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 0.78rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .final-answer-box {
      margin-top: 1.35rem;
      padding: 0.9rem 1.15rem;
      background: var(--success-bg);
      border: 1px solid rgba(78, 201, 176, 0.3);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 1.05rem;
    }

    .final-answer-box strong {
      color: var(--success);
      margin-right: 0.5rem;
    }

    .katex {
      font-size: 1.06em;
    }

    @media (max-width: 600px) {
      .card-meta {
        padding: 0.75rem 1rem;
      }
      .problem-body, .solution-card {
        padding: 1.2rem;
      }
      .brand-logo {
        font-size: 1.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="brand-logo" data-text="TRAPS">TRAPS</span>

      <button class="hamburger-btn" id="btn-menu" aria-label="Toggle Curriculum Menu" aria-expanded="false">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>

      <nav class="menu-drawer" id="menu-drawer" aria-label="Books, Units and Saved Problems">
        <button class="menu-all-btn active" data-unit="all">All Books &amp; Units (Random)</button>

        <div class="book-section" data-book="analysis">
          <button class="book-header" type="button">
            <span>1. Analysis</span>
            <span class="book-chevron">▾</span>
          </button>
          <ul class="unit-list" data-book-units="analysis"></ul>
        </div>

        <div class="book-section" data-book="algebra-vectors">
          <button class="book-header" type="button">
            <span>2. Algebra and Vectors</span>
            <span class="book-chevron">▾</span>
          </button>
          <ul class="unit-list" data-book-units="algebra-vectors"></ul>
        </div>

        <div class="book-section" data-book="saved">
          <button class="book-header" type="button">
            <span>Saved Problems (<span id="menu-saved-count">0</span>)</span>
            <span class="book-chevron">▾</span>
          </button>
          <div class="saved-menu-list" id="saved-menu-container"></div>
        </div>
      </nav>
    </header>

    <main class="card">
      <div class="card-meta" id="tags-section">
        <div class="meta-badges">
          <span class="badge badge-book" id="problem-book">Loading...</span>
          <span class="badge badge-unit" id="problem-unit">Loading...</span>
        </div>
        <span class="problem-number" id="problem-id">#001</span>
      </div>
      <div class="problem-body" id="problem-section">
        <div class="problem-statement" id="problem-text"></div>
      </div>
    </main>

    <div class="controls">
      <div class="btn-group">
        <button class="icon-btn primary" id="btn-new" type="button" title="New Problem" aria-label="New Problem">
          <svg viewBox="0 0 24 24">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <polyline points="21 3 21 9 15 9" />
          </svg>
        </button>

        <button class="icon-btn secondary" id="btn-toggle-solution" type="button" title="Show Solution" aria-label="Show Solution">
          <svg id="icon-eye" viewBox="0 0 24 24">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>

        <button class="icon-btn secondary" id="btn-save-problem" type="button" title="Save Problem" aria-label="Save Problem">
          <svg viewBox="0 0 24 24">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
          </svg>
        </button>
      </div>
      <span class="status-note" id="status-note"></span>
    </div>

    <section class="solution-card" id="solution-card">
      <div class="solution-header">Step-by-Step Derivation</div>
      <ol class="steps-list" id="solution-steps"></ol>
      <div class="final-answer-box" id="final-answer"></div>
    </section>
  </div>

  <script>
    /* =========================================================================
       1. EXACT ALGEBRAIC & SYMBOLIC UTILITIES
       ========================================================================= */
    const MathFmt = {
      gcd(a, b) {
        a = Math.abs(Math.round(a));
        b = Math.abs(Math.round(b));
        while (b !== 0) {
          const t = b;
          b = a % b;
          a = t;
        }
        return a === 0 ? 1 : a;
      },

      frac(n, d = 1) {
        if (d === 0) throw new Error("Division by zero");
        if (n === 0) return { n: 0, d: 1 };
        if (d < 0) { n = -n; d = -d; }
        const g = this.gcd(n, d);
        return { n: n / g, d: d / g };
      },

      addFrac(f1, f2) {
        return this.frac(f1.n * f2.d + f2.n * f1.d, f1.d * f2.d);
      },

      subFrac(f1, f2) {
        return this.frac(f1.n * f2.d - f2.n * f1.d, f1.d * f2.d);
      },

      texFrac(f) {
        if (f.n === 0) return "0";
        const sign = f.n < 0 ? "-" : "";
        const absN = Math.abs(f.n);
        if (f.d === 1) return `${sign}${absN}`;
        return `${sign}\\frac{${absN}}{${f.d}}`;
      },

      signedNum(k) {
        if (k === 0) return "";
        return k > 0 ? ` + ${k}` : ` - ${Math.abs(k)}`;
      },

      linear(a, b, v = "x") {
        let out = "";
        if (a !== 0) {
          if (a === 1) out += v;
          else if (a === -1) out += `-${v}`;
          else out += `${a}${v}`;
        }
        if (b !== 0) {
          out += out === "" ? `${b}` : this.signedNum(b);
        }
        return out === "" ? "0" : out;
      },

      rational(a, b, c, d, v = "x") {
        return `\\frac{${this.linear(a, b, v)}}{${this.linear(c, d, v)}}`;
      },

      coeff(k, sym, leading = true) {
        if (k === 0) return "";
        if (leading) {
          if (k === 1) return sym;
          if (k === -1) return `-${sym}`;
          return `${k}${sym}`;
        }
        if (k === 1) return ` + ${sym}`;
        if (k === -1) return ` - ${sym}`;
        return k > 0 ? ` + ${k}${sym}` : ` - ${Math.abs(k)}${sym}`;
      },

      simplifySqrt(n) {
        if (n === 0) return { out: 0, inside: 1 };
        let out = 1;
        let inside = n;
        for (let i = 2; i * i <= inside; i++) {
          while (inside % (i * i) === 0) {
            out *= i;
            inside /= (i * i);
          }
        }
        return { out, inside };
      },

      texSqrt(n) {
        if (n === 0) return "0";
        const { out, inside } = this.simplifySqrt(n);
        if (inside === 1) return `${out}`;
        if (out === 1) return `\\sqrt{${inside}}`;
        return `${out}\\sqrt{${inside}}`;
      },

      texPi(f) {
        if (f.n === 0) return "0";
        const sign = f.n < 0 ? "-" : "";
        const absN = Math.abs(f.n);
        const numStr = absN === 1 ? "\\pi" : `${absN}\\pi`;
        if (f.d === 1) return `${sign}${numStr}`;
        return `${sign}\\frac{${numStr}}{${f.d}}`;
      },

      comb(n, k) {
        if (k < 0 || k > n) return 0;
        let res = 1;
        for (let i = 1; i <= k; i++) {
          res = (res * (n - i + 1)) / i;
        }
        return Math.round(res);
      },

      perm(n, k) {
        if (k < 0 || k > n) return 0;
        let res = 1;
        for (let i = 0; i < k; i++) {
          res *= (n - i);
        }
        return Math.round(res);
      }
    };

    const Rand = {
      int(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      },
      pick(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      },
      nonZeroInt(min, max) {
        let v = 0;
        while (v === 0) v = this.int(min, max);
        return v;
      }
    };

    /* =========================================================================
       2. BOOK 1: ANALYSIS GENERATORS (7 UNITS)
       ========================================================================= */

    function genSequences() {
      const mode = Rand.pick(["arithmetic-geometric", "telescoping"]);
      if (mode === "arithmetic-geometric") {
        const a = Rand.pick([2, 3, -2, -3]);
        const oneMinusA = 1 - a;
        const k = Rand.nonZeroInt(-3, 3);
        const b = k * oneMinusA;
        let u0 = k;
        while (u0 === k) {
          u0 = k + Rand.nonZeroInt(-4, 4);
        }
        const v0 = u0 - k;
        const targetN = Rand.int(4, 7);
        const aPowN = Math.pow(a, targetN);
        const uN = k + v0 * aPowN;

        return {
          book: "Analysis",
          unit: "Sequences",
          statement: `Let $(u_n)_{n \\ge 0}$ be the sequence defined by $u_0 = ${u0}$ and for all $n \\ge 0$:
          $$u_{n+1} = ${MathFmt.coeff(a, "u_n", true)}${MathFmt.signedNum(b)}$$
          Find the closed form of $u_n$ and compute $u_{${targetN}}$.`,
          steps: [
            `Solve $L = ${MathFmt.coeff(a, "L", true)}${MathFmt.signedNum(b)}$ for the fixed point:
            $$(${oneMinusA})L = ${b} \\implies L = ${k}$$`,
            `Let $v_n = u_n - ${k}$. Then $v_{n+1} = ${a}v_n$ with $v_0 = ${v0}$, so $v_n = ${v0} \\cdot (${a})^n$.`,
            `Thus $u_n = ${k}${v0 > 0 ? ` + ${v0}` : ` - ${Math.abs(v0)}`} \\cdot (${a})^n$, giving $u_{${targetN}} = ${uN}$.`
          ],
          answer: `u_n = ${k}${v0 > 0 ? ` + ${v0}` : ` - ${Math.abs(v0)}`} \\cdot (${a})^n, \\quad u_{${targetN}} = ${uN}`
        };
      } else {
        const m = Rand.int(4, 9);
        const sFrac = MathFmt.frac(m, m + 1);
        return {
          book: "Analysis",
          unit: "Sequences",
          statement: `For each integer $n \\ge 1$, let $u_n = \\dfrac{1}{n(n+1)}$ and let $S_n = \\displaystyle\\sum_{k=1}^{n} u_k$. Compute $S_{${m}}$ and find $\\displaystyle\\lim_{n \\to +\\infty} S_n$.`,
          steps: [
            `Decompose $u_k = \\dfrac{1}{k} - \\dfrac{1}{k+1}$.`,
            `Telescoping sum gives $S_n = 1 - \\dfrac{1}{n+1} = \\dfrac{n}{n+1}$.`,
            `At $n = ${m}$, $S_{${m}} = \\dfrac{${sFrac.n}}{${sFrac.d}}$, and as $n \\to +\\infty$, $S_n \\to 1$.`

    function genLimits() {
      const type = Rand.pick(["composite-trap", "floor-trap"]);
      if (type === "composite-trap") {
        const c = Rand.pick([1, 2, 3]);
        const r = Rand.nonZeroInt(-4, 4);
        const a = c * r;
        const d = -c * r;
        let b = a * r;
        while (b === a * r || a * r + b === 0) {
          b = a * r + Rand.nonZeroInt(-6, 6);
        }
        const dirSign = Rand.pick([-1, 1]);
        const dirTex = dirSign === -1 ? "-\\infty" : "+\\infty";
        const k = b - a * r;
        const approachDir = (k * dirSign > 0) ? "+" : "-";
        const numAtR = a * r + b;
        const denomSign = approachDir === "+" ? 1 : -1;
        const finalInf = (numAtR * denomSign > 0) ? "+\\infty" : "-\\infty";

        return {
          book: "Analysis",
          unit: "Limits",
          statement: `Let $f$ be defined on $\\mathbb{R} \\setminus \\{${r}\\}$ by $f(x) = ${MathFmt.rational(a, b, c, d, "x")}$. Evaluate:
          $$\\lim_{x \\to ${dirTex}} f\\big[f(x)\\big]$$`,
          steps: [
            `As $x \\to ${dirTex}$, $f(x) = ${r} + \\dfrac{${k}}{${MathFmt.linear(c, d, "x")}} \\to ${r}^{${approachDir}}$ because $\\dfrac{${k}}{${MathFmt.linear(c, d, "x")}} \\to 0^{${approachDir}}$.`,
            `Since $${r}$ is the vertical asymptote of $f$, setting $u = f(x) \\to ${r}^{${approachDir}}$ gives numerator $\\to ${numAtR}$ and denominator $\\to 0^{${approachDir}}$.`
          ],
          answer: `\\lim_{x \\to ${dirTex}} f\\big[f(x)\\big] = ${finalInf}`
        };
      } else {
        const a = Rand.int(1, 5);
        const b = Rand.int(1, 6);
        const c = Rand.int(1, 4);
        const d = Rand.int(1, 7);
        const numTex = MathFmt.linear(a, b, "(x - E(x))");
        const denTex = MathFmt.linear(c, d, "x");
        return {
          book: "Analysis",
          unit: "Limits",
          statement: `Let $E(x)$ be the floor function and $f(x) = \\sqrt{\\dfrac{${numTex}}{${denTex}}}$ on $[0, +\\infty[$. Compute $\\displaystyle\\lim_{x \\to +\\infty} f(x)$.`,
          steps: [
            `Since $0 \\le x - E(x) < 1$ for all $x \\in \\mathbb{R}$, we have $${b} \\le ${numTex} < ${a + b}$.`,
            `Dividing by $${denTex} > 0$ for $x > 0$ squeezes the radicand between two functions tending to $0$ as $x \\to +\\infty$.`,
            `By the Squeeze Theorem and continuity of $\\sqrt{\\cdot}$ at $0$, the limit is $0$.`
          ],
          answer: `\\lim_{x \\to +\\infty} f(x) = 0`
        };
      }
    }

    function genDifferentiation() {
      const k = Rand.nonZeroInt(-5, 5);
      const innerIsCos = Rand.pick([true, false]);
      const innerFn = innerIsCos ? "\\cos x" : "\\sin x";
      const innerDeriv = innerIsCos ? "-\\sin x" : "\\cos x";
      const interval = innerIsCos
        ? Rand.pick([
            { tex: "]-\\pi, 0[", sign: -1, cond: "\\sin x < 0" },
            { tex: "]0, \\pi[", sign: 1, cond: "\\sin x > 0" }
          ])
        : Rand.pick([
            { tex: "\\left]-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right[", sign: 1, cond: "\\cos x > 0" },
            { tex: "\\left]\\frac{\\pi}{2}, \\frac{3\\pi}{2}\\right[", sign: -1, cond: "\\cos x < 0" }
          ]);
      const finalConst = innerIsCos ? (-k * interval.sign) : (k * interval.sign);
      const absTex = innerIsCos ? "|\\sin x|" : "|\\cos x|";
      const signedAbs = interval.sign === 1
        ? (innerIsCos ? "\\sin x" : "\\cos x")
        : (innerIsCos ? "-\\sin x" : "-\\cos x");

      return {
        book: "Analysis",
        unit: "Differentiation",
        statement: `Let $f$ be differentiable on $]-1, 1[$ with $f'(x) = \\dfrac{${k}}{\\sqrt{1 - x^2}}$, and define $g(x) = f(${innerFn})$ on $${interval.tex}$. Find $g'(x)$.`,
        steps: [
          `By the chain rule, $g'(x) = (${innerDeriv}) \\cdot \\dfrac{${k}}{\\sqrt{1 - ${innerIsCos ? "\\cos^2 x" : "\\sin^2 x"}}}$.`,
          `Since $\\sqrt{1 - ${innerIsCos ? "\\cos^2 x" : "\\sin^2 x"}} = ${absTex}$ and $${interval.cond}$ on $${interval.tex}$, we have $${absTex} = ${signedAbs}$.`,
          `Simplify: $g'(x) = \\dfrac{${k}(${innerDeriv})}{${signedAbs}} = ${finalConst}$.`
        ],
        answer: `g'(x) = ${finalConst}`
      };
    }

    function genMonotonicitySequence() {

          Study the monotonicity of $(u_n)_{n \\ge 1}$.`,
          steps: [
            `Compute $u_{n+1} - u_n = ${a} - ${c}\\left(\\dfrac{1}{n} - \\dfrac{1}{n+1}\\right) = \\dfrac{${a}n(n+1) - ${c}}{n(n+1)}$.`,
            `For $n \\ge 1$, $n(n+1) \\ge 2$ and ${a}n(n+1) - ${c} \\ge ${2 * a - c} > 0$, so $u_{n+1} - u_n > 0$ for all $n \\ge 1$.`
          ],

        };
      } else {

          steps: [
            `Since $u_n > 0$, $\\dfrac{u_{n+1}}{u_n} = \\dfrac{${a}^{n+1}}{(n+1)!} \\cdot \\dfrac{n!}{${a}^n} = \\dfrac{${a}}{n+1}$.`,
            `We have $\\dfrac{u_{n+1}}{u_n} < 1 \\iff n + 1 > ${a} \\iff n \\ge ${a}$.`

    function genLogarithmic() {

          steps: [
            `Domain requires $x > ${minDomain}$.`,
            `Using $\\ln A + \\ln B = \\ln(AB)$, we get $(${MathFmt.linear(1, a, "x")})(${MathFmt.linear(1, b, "x")}) = ${c}$.`,
            `Substituting $x = ${r1}$ gives $(${r1 + a})(${r1 + b}) = ${c}$ with $${r1} > ${minDomain}$.`

        };

          steps: [

            `As $x \\to (${-a})^+$, $\\ln(${MathFmt.linear(1, a, "x")}) \\to -\\infty$, so $f(x) \\to ${k > 0 ? "-\\infty" : "+\\infty"}$.`
          ],

    function genExponential() {

        steps: [
          `Apply the product rule: $f'(x) = ${k}e^{${MathFmt.coeff(a, "x", true)}} + ${a}\\big(${MathFmt.linear(k, m, "x")}\\big)e^{${MathFmt.coeff(a, "x", true)}}$.`,
          `Factor out $e^{${MathFmt.coeff(a, "x", true)}}$: $f'(x) = \\big(${MathFmt.linear(xCoeff, constPart, "x")}\\big)e^{${MathFmt.coeff(a, "x", true)}}$.`,
          `As $x \\to +\\infty$, the limit is $${a < 0 ? "0" : (k > 0 ? "+\\infty" : "-\\infty")}$.`
        ],
        answer: `f'(x) = \\big(${MathFmt.linear(xCoeff, constPart, "x")}\\big)e^{${MathFmt.coeff(a, "x", true)}}, \\quad \\lim_{x \\to +\\infty} f(x) = ${a < 0 ? "0" : (k > 0 ? "+\\infty" : "-\\infty")}`

    function genIntegration() {

    function genVector() {
      const u = [Rand.nonZeroInt(-4, 4), Rand.nonZeroInt(-4, 4), Rand.nonZeroInt(-4, 4)];
      const v = [Rand.nonZeroInt(-4, 4), Rand.nonZeroInt(-4, 4), Rand.nonZeroInt(-4, 4)];
      const dot = u[0] * v[0] + u[1] * v[1] + u[2] * v[2];
      const cx = u[1] * v[2] - u[2] * v[1];
      const cy = u[2] * v[0] - u[0] * v[2];
      const cz = u[0] * v[1] - u[1] * v[0];
      const normSq = cx * cx + cy * cy + cz * cz;

      return {
        book: "Algebra and Vectors",
        unit: "Vector",
        statement: `In an orthonormal basis $(\\vec{i}, \\vec{j}, \\vec{k})$, let $\\vec{u}(${u[0]}, ${u[1]}, ${u[2]})$ and $\\vec{v}(${v[0]}, ${v[1]}, ${v[2]})$. Compute $\\vec{u} \\cdot \\vec{v}$ and $\\|\\vec{u} \\times \\vec{v}\\|$.`,
        steps: [
          `Dot product: $\\vec{u} \\cdot \\vec{v} = (${u[0]})(${v[0]}) + (${u[1]})(${v[1]}) + (${u[2]})(${v[2]}) = ${dot}$.`,
          `Cross product: $\\vec{u} \\times \\vec{v} = (${cx}, ${cy}, ${cz})$, so $\\|\\vec{u} \\times \\vec{v}\\| = \\sqrt{${normSq}} = ${MathFmt.texSqrt(normSq)}$.`
        ],
        answer: `\\vec{u} \\cdot \\vec{v} = ${dot}, \\quad \\|\\vec{u} \\times \\vec{v}\\| = ${MathFmt.texSqrt(normSq)}`
      };
    }

    function genComplexNumbers() {
      const m = Rand.pick([1, 2, 3]);
      const iLabel = m === 1 ? "i" : (m === 2 ? "-1" : "-i");
      const iArg = MathFmt.frac(m, 2);

      const alphas = [
        { tex: "\\frac{\\pi}{6}", f: MathFmt.frac(1, 6) },
        { tex: "\\frac{\\pi}{4}", f: MathFmt.frac(1, 4) },
        { tex: "\\frac{\\pi}{3}", f: MathFmt.frac(1, 3) },
        { tex: "-\\frac{\\pi}{3}", f: MathFmt.frac(-1, 3) },
        { tex: "\\frac{2\\pi}{3}", f: MathFmt.frac(2, 3) }
      ];
      const alpha = Rand.pick(alphas);

      const denoms = [
        { tex: "1 - \\sqrt{3}", arg: MathFmt.frac(1, 1), reason: "$1 - \\sqrt{3} < 0 \\implies \\arg(1 - \\sqrt{3}) \\equiv \\pi \\pmod{2\\pi}$" },
        { tex: "1 + i\\sqrt{3}", arg: MathFmt.frac(1, 3), reason: "$1 + i\\sqrt{3} = 2e^{i\\pi/3} \\implies \\arg(1 + i\\sqrt{3}) \\equiv \\frac{\\pi}{3} \\pmod{2\\pi}$" },
        { tex: "-1 + i\\sqrt{3}", arg: MathFmt.frac(2, 3), reason: "$-1 + i\\sqrt{3} = 2e^{i2\\pi/3} \\implies \\arg(-1 + i\\sqrt{3}) \\equiv \\frac{2\\pi}{3} \\pmod{2\\pi}$" },
        { tex: "\\sqrt{3} + i", arg: MathFmt.frac(1, 6), reason: "$\\sqrt{3} + i = 2e^{i\\pi/6} \\implies \\arg(\\sqrt{3} + i) \\equiv \\frac{\\pi}{6} \\pmod{2\\pi}$" }
      ];
      const denom = Rand.pick(denoms);

      let rawArg = MathFmt.subFrac(MathFmt.addFrac(iArg, alpha.f), denom.arg);
      let norm = { n: rawArg.n, d: rawArg.d };
      while (norm.n > norm.d) norm = MathFmt.subFrac(norm, MathFmt.frac(2, 1));
      while (norm.n <= -norm.d) norm = MathFmt.addFrac(norm, MathFmt.frac(2, 1));

      return {
        book: "Algebra and Vectors",
        unit: "Complex Numbers",
        statement: `Find the principal argument $\\arg(Z) \\in ]-\\pi, \\pi]$ for:
        $$Z = \\frac{${iLabel} \\cdot e^{i${alpha.tex}}}{${denom.tex}}$$`,
        steps: [
          `Use $\\arg\\!\\left(\\frac{u \\cdot v}{w}\\right) \\equiv \\arg(u) + \\arg(v) - \\arg(w) \\pmod{2\\pi}$.`,
          `Here $\\arg(${iLabel}) \\equiv ${MathFmt.texPi(iArg)}$, $\\arg(e^{i${alpha.tex}}) \\equiv ${MathFmt.texPi(alpha.f)}$, and ${denom.reason}.`,
          `Reducing into $]-\\pi, \\pi]$ gives $${MathFmt.texPi(norm)}$.`
        ],
        answer: `\\arg(Z) = ${MathFmt.texPi(norm)}`
      };
    }

    function genComplexGeometry() {
      const ax = Rand.nonZeroInt(-3, 3);
      const ay = Rand.nonZeroInt(-3, 3);
      const bx = ax + 2;
      const by = ay;
      const angleChoice = Rand.pick([

      return {

        statement: `In the Argand plane, let $A$, $B$, and $C$ have affixes $z_A = ${ax}${ay >= 0 ? ` + ${ay}i` : ` - ${Math.abs(ay)}i`}$, $z_B = ${bx}${by >= 0 ? ` + ${by}i` : ` - ${Math.abs(by)}i`}$, and $z_C = ${cx}${cy >= 0 ? ` + ${cy}i` : ` - ${Math.abs(cy)}i`}$. Determine a measure of $\\widehat{(\\vec{AB}, \\vec{AC})}$.`,
        steps: [
          `$\\widehat{(\\vec{AB}, \\vec{AC})} \\equiv \\arg\\!\\left(\\dfrac{z_C - z_A}{z_B - z_A}\\right) \\pmod{2\\pi}$.`,
          `Here $z_B - z_A = 2$ and $z_C - z_A = ${angleChoice.dx}${angleChoice.dy >= 0 ? ` + ${angleChoice.dy}i` : ` - ${Math.abs(angleChoice.dy)}i`}$, giving argument $${angleChoice.tex}$.`
        ],
        answer: `\\widehat{(\\vec{AB}, \\vec{AC})} = ${angleChoice.tex} \\pmod{2\\pi}`
      };
    }

    function genCountingTechniques() {
      const mode = Rand.pick(["combinations", "arrangements"]);
      if (mode === "combinations") {
        const men = Rand.int(4, 7);
        const women = Rand.int(3, 6);
        const kMen = Rand.int(1, 3);
        const kWomen = Rand.int(1, 3);
        const totalSize = kMen + kWomen;
        const cMen = MathFmt.comb(men, kMen);
        const cWomen = MathFmt.comb(women, kWomen);
        const ans = cMen * cWomen;

        return {
          book: "Algebra and Vectors",
          unit: "Counting Techniques",
          statement: `A committee of $${totalSize}$ members is selected simultaneously from $${men}$ men and $${women}$ women. How many committees contain exactly $${kMen}$ ${kMen === 1 ? "man" : "men"} and $${kWomen}$ ${kWomen === 1 ? "woman" : "women"}?`,
          steps: [
            `Since order does not matter in a committee, use combinations $\\binom{n}{r} = \\dfrac{n!}{r!(n-r)!}$.`,
            `Select $${kMen}$ ${kMen === 1 ? "man" : "men"} out of $${men}$ in $\\binom{${men}}{${kMen}} = ${cMen}$ ways, and $${kWomen}$ ${kWomen === 1 ? "woman" : "women"} out of $${women}$ in $\\binom{${women}}{${kWomen}} = ${cWomen}$ ways.`,
            `By the fundamental counting principle (multiplication rule), total committees $= ${cMen} \\times ${cWomen} = ${ans}$.`
          ],
          answer: `${ans}`
        };
      } else {
        const n = Rand.int(5, 8);
        const k = Rand.int(2, 4);
        const ans = MathFmt.perm(n, k);

        return {
          book: "Algebra and Vectors",
          unit: "Counting Techniques",
          statement: `From a group of $${n}$ distinct candidates, how many ordered selections of $${k}$ distinct positions (for example: President, Vice-President, Secretary, Treasurer) can be formed without repetition?`,
          steps: [
            `Because the $${k}$ positions are distinct and repetition is not allowed, use arrangements (permutations) $A_{n}^{k} = \\dfrac{n!}{(n-k)!}$.`,
            `Compute $A_{${n}}^{${k}} = ${n} \\times ${n - 1}${k >= 3 ? ` \\times ${n - 2}` : ""}${k >= 4 ? ` \\times ${n - 3}` : ""} = ${ans}$.`
          ],
          answer: `${ans}`
        };
      }
    }

    function genProbability() {

        ],
        answer: `P = ${MathFmt.texFrac(prob)}`
      };
    }

      menuAllBtn: document.querySelector(".menu-all-btn"),
      problemBook: document.getElementById("problem-book"),
      problemUnit: document.getElementById("problem-unit"),
      problemId: document.getElementById("problem-id"),
      problemText: document.getElementById("problem-text"),
      btnNew: document.getElementById("btn-new"),
      btnToggle: document.getElementById("btn-toggle-solution"),
      iconEye: document.getElementById("icon-eye"),
      btnSave: document.getElementById("btn-save-problem"),
      statusNote: document.getElementById("status-note"),
      solutionCard: document.getElementById("solution-card"),
      solutionSteps: document.getElementById("solution-steps"),
      finalAnswer: document.getElementById("final-answer"),
      menuSavedCount: document.getElementById("menu-saved-count"),
      savedMenuContainer: document.getElementById("saved-menu-container")
    };

    function populateMenuUnits() {
      Object.entries(CURRICULUM).forEach(([bookKey, bookData]) => {
        const ul = document.querySelector(`[data-book-units="${bookKey}"]`);
        ul.innerHTML = bookData.units
          .map(u => `<li><button class="unit-item-btn" type="button" data-unit="${u.id}">${u.label}</button></li>`)
          .join("");
      });
    }

    function highlightActiveUnit() {
      dom.menuAllBtn.classList.toggle("active", state.activeUnit === "all");
      document.querySelectorAll(".unit-item-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.unit === state.activeUnit);
      });
    }

    function setMenuOpen(open) {
      state.menuOpen = open;
      dom.menuDrawer.classList.toggle("open", open);
      dom.btnMenu.setAttribute("aria-expanded", String(open));
    }

    function typesetMath(element) {
      if (typeof renderMathInElement === "function") {
        renderMathInElement(element, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false }
          ],
          throwOnError: false
        });
      }
    }

    function isCurrentProblemSaved() {
      if (!state.currentProblem) return false;
      const sig = getProblemSignature(state.currentProblem);
      return state.savedProblems.some(item => item.id === sig);
    }

    function updateSaveButtonState() {
      const saved = isCurrentProblemSaved();
      dom.btnSave.classList.toggle("saved", saved);
      dom.btnSave.classList.toggle("secondary", !saved);
      const label = saved ? "Saved" : "Save Problem";
      dom.btnSave.title = label;
      dom.btnSave.setAttribute("aria-label", label);
    }

    function renderSavedInMenu() {
      dom.menuSavedCount.textContent = String(state.savedProblems.length);
      if (state.savedProblems.length === 0) {
        dom.savedMenuContainer.innerHTML = `<p class="saved-menu-empty">No saved problems yet.</p>`;
        return;
      }

      dom.savedMenuContainer.innerHTML = state.savedProblems.map((item, idx) => `
        <div class="saved-menu-item" data-id="${encodeURIComponent(item.id)}">
          <div class="saved-menu-top">
            <span>#${idx + 1} &middot; ${item.unit}</span>
          </div>
          <div class="saved-menu-preview">${item.statement}</div>
          <div class="saved-menu-actions">
            <button class="btn-mini open" type="button" data-action="open">Open</button>
            <button class="btn-mini delete" type="button" data-action="delete">Delete</button>
          </div>
        </div>
      `).join("");

      typesetMath(dom.savedMenuContainer);
    }

    function setSolutionVisibility(visible) {
      state.solutionVisible = visible;
      if (visible) {
        dom.solutionCard.classList.add("visible");
        dom.btnToggle.classList.add("active-toggle");
        dom.btnToggle.title = "Hide Solution";
        dom.btnToggle.setAttribute("aria-label", "Hide Solution");
        dom.iconEye.innerHTML = `
          <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
          <line x1="1" y1="1" x2="23" y2="23" />
        `;
      } else {
        dom.solutionCard.classList.remove("visible");
        dom.btnToggle.classList.remove("active-toggle");
        dom.btnToggle.title = "Show Solution";
        dom.btnToggle.setAttribute("aria-label", "Show Solution");
        dom.iconEye.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
          <circle cx="12" cy="12" r="3" />
        `;
      }
    }

    function renderProblem(problem, labelNumber) {
      state.currentProblem = problem;
      setSolutionVisibility(false);
      updateSaveButtonState();

      dom.problemBook.textContent = problem.book;
      dom.problemUnit.textContent = problem.unit;
      dom.problemId.textContent = `#${String(labelNumber).padStart(3, "0")}`;
      dom.problemText.innerHTML = problem.statement;

      dom.solutionSteps.innerHTML = problem.steps
        .map(step => `<li>${step}</li>`)
        .join("");
      dom.finalAnswer.innerHTML = `<strong>Final Answer:</strong> $${problem.answer}$`;

      typesetMath(dom.problemText);
      typesetMath(dom.solutionCard);
    }

    function loadNewProblem() {
      const selectedUnit = state.activeUnit === "all"
        ? Rand.pick(ALL_UNITS)
        : (ALL_UNITS.find(u => u.id === state.activeUnit) || Rand.pick(ALL_UNITS));

      const problem = selectedUnit.fn();
      state.problemIndex += 1;
      dom.statusNote.textContent = "";
      renderProblem(problem, state.problemIndex);
    }

    dom.btnSave.addEventListener("click", () => {
      if (!state.currentProblem) return;
      const sig = getProblemSignature(state.currentProblem);
      const exists = state.savedProblems.some(item => item.id === sig);
      if (exists) {
        dom.statusNote.textContent = "Already saved.";
        updateSaveButtonState();
        return;
      }

      state.savedProblems.unshift({
        id: sig,
        book: state.currentProblem.book,
        unit: state.currentProblem.unit,
        statement: state.currentProblem.statement,
        steps: state.currentProblem.steps,
        answer: state.currentProblem.answer
      });
      persistSavedToStorage(state.savedProblems);
      updateSaveButtonState();
      renderSavedInMenu();
      dom.statusNote.textContent = "Saved.";
    });

    dom.savedMenuContainer.addEventListener("click", (e) => {
      const actionBtn = e.target.closest("[data-action]");
      if (!actionBtn) return;
      const card = actionBtn.closest(".saved-menu-item");
      if (!card) return;
      const id = decodeURIComponent(card.dataset.id);
      const action = actionBtn.dataset.action;

      if (action === "delete") {
        state.savedProblems = state.savedProblems.filter(item => item.id !== id);
        persistSavedToStorage(state.savedProblems);
        updateSaveButtonState();
        renderSavedInMenu();
        dom.statusNote.textContent = "Deleted.";
      } else if (action === "open") {
        const found = state.savedProblems.find(item => item.id === id);
        if (found) {
          dom.statusNote.textContent = "Opened saved problem.";
          renderProblem(found, state.problemIndex);
          setMenuOpen(false);
        }
      }
    });

    dom.btnMenu.addEventListener("click", (e) => {
      e.stopPropagation();
      setMenuOpen(!state.menuOpen);
    });

    document.querySelectorAll(".book-header").forEach(headerBtn => {
      headerBtn.addEventListener("click", () => {
        headerBtn.parentElement.classList.toggle("collapsed");
      });
    });

    dom.menuDrawer.addEventListener("click", (e) => {
      const unitBtn = e.target.closest("[data-unit]");
      if (!unitBtn) return;
      state.activeUnit = unitBtn.dataset.unit;
      highlightActiveUnit();
      setMenuOpen(false);
      loadNewProblem();
    });

    document.addEventListener("click", (e) => {
      if (state.menuOpen && !dom.menuDrawer.contains(e.target) && !dom.btnMenu.contains(e.target)) {
        setMenuOpen(false);
      }
    });

    dom.btnNew.addEventListener("click", loadNewProblem);

    dom.btnToggle.addEventListener("click", () => {
      setSolutionVisibility(!state.solutionVisible);
    });

    window.addEventListener("DOMContentLoaded", () => {
      populateMenuUnits();
      highlightActiveUnit();
      renderSavedInMenu();
      const waitForKatex = setInterval(() => {
        if (typeof renderMathInElement === "function") {
          clearInterval(waitForKatex);
          loadNewProblem();
        }
      }, 30);
    });
  </script>
</body>
</html>
