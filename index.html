<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Windows XP — Cinematic Lyrics</title>
<style>
:root {
  --sky: #7fc7ed;
  --blue: #245edb;
  --blue-dark: #17469c;
  --green: #7da94a;
  --yellow: #fff3a6;
  --white: #fff;
  --timing: 6s;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; }
body {
  font-family: Tahoma, "Trebuchet MS", sans-serif;
  color: #17355b;
  background: #c4dff2;
  overflow: hidden;
}
button, input { font: inherit; }
button { cursor: pointer; }
.desktop {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: clamp(8px, 2vw, 22px);
  gap: 10px;
  background: linear-gradient(#e8f5ff, #c5e2f7);
}
.window {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid #1556a4;
  border-radius: 8px 8px 3px 3px;
  background: #ece9d8;
  box-shadow: 2px 3px 9px #234c6535;
}
.titlebar {
  height: 34px;
  min-height: 34px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 4px 7px 4px 12px;
  color: white;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: .1px;
  background: linear-gradient(#5aa5f8 0%, #2475e7 12%, #1460d5 55%, #1d58b6 100%);
  text-shadow: 1px 1px #234d89;
}
.title-left { display: flex; align-items: center; gap: 8px; }
.app-icon {
  width: 18px; height: 18px; border-radius: 3px;
  display: grid; place-items: center;
  color: #fff; font-size: 12px;
  background: linear-gradient(135deg, #8fd6ff, #2470cf);
  border: 1px solid #d8efff;
}
.window-buttons { display: flex; gap: 3px; }
.win-btn {
  width: 22px; height: 21px;
  padding: 0;
  border: 1px solid #fff;
  border-radius: 3px;
  color: white;
  font-size: 13px;
  font-weight: bold;
  background: linear-gradient(#77b8ff, #2469d4);
  box-shadow: inset 1px 1px #ffffff80, 1px 1px #12428e;
}
.win-btn.close { background: linear-gradient(#f6a39b, #d33126); }
.menubar {
  min-height: 28px;
  padding: 5px 12px;
  background: #ece9d8;
  border-bottom: 1px solid #c2c1b7;
  color: #343434;
  font-size: 12px;
}
.menubar span { margin-right: 18px; }
.stage {
  flex: 1;
  min-height: 0;
  position: relative;
  overflow: hidden;
  isolation: isolate;
  perspective: 1000px;
  background: linear-gradient(#79c7f3 0%, #a9e0fa 49%, #c3e6f4 65%, #d7e9bb 100%);
}
.sky-haze {
  position: absolute; inset: 0;
  z-index: -5;
  background: radial-gradient(ellipse at 50% 18%, #fff8 0%, transparent 57%);
}
.sunlight {
  position: absolute;
  inset: -25% 10% 30%;
  z-index: -4;
  opacity: .18;
  background: conic-gradient(from 230deg at 50% 100%, transparent, #fff9, transparent 12%, #fff5, transparent 28%);
  animation: rays 25s ease-in-out infinite alternate;
}
.cloud-layer {
  position: absolute; inset: 0;
  z-index: -3;
  overflow: hidden;
  transition: transform .7s ease;
}
.cloud {
  position: absolute;
  width: 125px; height: 28px;
  border-radius: 50%;
  background: #fff8;
  filter: blur(1px);
}
.cloud::before, .cloud::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  background: inherit;
}
.cloud::before { width: 57px; height: 48px; left: 22px; top: -22px; }
.cloud::after { width: 72px; height: 38px; left: 52px; top: -13px; }
.cloud.c1 { top: 16%; left: -8%; transform: scale(1.15); animation: drift 42s linear infinite; }
.cloud.c2 { top: 31%; left: 60%; transform: scale(.75); animation: drift 58s linear infinite reverse; }
.cloud.c3 { top: 10%; left: 36%; transform: scale(.6); animation: drift 66s linear infinite; }
.hills {
  position: absolute; left: -12%; right: -12%;
  bottom: -20%; height: 55%;
  border-radius: 50% 50% 0 0 / 32% 32% 0 0;
  z-index: -2;
  background: linear-gradient(165deg, #a9ce69, #79a845 66%, #68933d);
  transform-origin: center bottom;
  transition: transform .7s ease;
}
.hills.back {
  bottom: 5%; left: 28%; height: 37%; right: -25%;
  opacity: .68;
  background: linear-gradient(#9dc76c, #77a54c);
  transform: rotate(-4deg);
}
.hills.front {
  bottom: -23%; left: -20%; height: 48%; right: 16%;
  background: linear-gradient(165deg, #a9ce64, #78a346 70%);
}
.hills.foreground {
  bottom: -33%; left: 48%; height: 43%; right: -32%;
  opacity: .75;
  background: linear-gradient(170deg, #b2d36c, #699340);
}
.grass {
  position: absolute; inset: auto 0 0; height: 13%;
  z-index: -1;
  background: linear-gradient(#659540, #7ba64a);
  opacity: .65;
}
.lyric-view {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 8% 7%;
  transform-style: preserve-3d;
  will-change: transform;
}
.lyric {
  max-width: 100%;
  max-height: 100%;
  overflow-wrap: anywhere;
  text-align: center;
  color: var(--yellow);
  font-size: clamp(1.25rem, 4.5vw, 3.6rem);
  line-height: 1.35;
  font-weight: bold;
  white-space: pre-wrap;
  text-shadow: 0 2px 2px #143c24, 1px 1px 1px #143c24,
               -1px -1px 1px #143c24, 0 0 10px #315c3450;
  opacity: 0;
  transform-origin: center center;
  will-change: transform, opacity;
}
.lyric.visible { opacity: 1; }
.lyric.chorus::after {
  content: "";
  position: absolute;
  inset: -8px -15px;
  pointer-events: none;
  background: linear-gradient(110deg, transparent 35%, #ffffff00 42%, #fff9 49%, #ffffff00 56%, transparent 64%);
  transform: translateX(-120%);
  animation: sweep 1.5s ease-in-out .35s both;
  mix-blend-mode: screen;
}
.lyric-editor {
  width: 100%;
  height: 100%;
  resize: none;
  padding: 12px;
  border: 1px solid #7f9db9;
  background: #fff;
  color: #222;
  font: 14px/1.6 Tahoma, sans-serif;
}
.editor-panel {
  position: absolute;
  z-index: 10;
  inset: 8px;
  display: none;
  flex-direction: column;
  padding: 12px;
  gap: 8px;
  border: 1px solid #7f9db9;
  background: #ece9d8;
  box-shadow: 0 3px 12px #123b5940;
}
.editor-panel.open { display: flex; }
.editor-panel label { font-size: 12px; font-weight: bold; }
.editor-panel textarea { flex: 1; min-height: 100px; }
.editor-actions { display: flex; gap: 8px; justify-content: flex-end; }
.caption {
  position: absolute;
  bottom: 12px; left: 12px; right: 12px;
  text-align: center;
  font-size: 11px;
  color: #25476a;
  opacity: .8;
  pointer-events: none;
}
.toolbar {
  min-height: 58px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 9px 10px;
  border: 1px solid #8c9bb0;
  border-radius: 4px;
  background: linear-gradient(#faf9f0, #e2e0d1);
  box-shadow: inset 1px 1px #fff;
}
.xp-button {
  min-height: 30px;
  padding: 5px 13px;
  border: 1px solid #7f9db9;
  border-radius: 3px;
  color: #163c65;
  background: linear-gradient(#fff, #e1edfa 48%, #c7ddf5);
  box-shadow: inset 1px 1px #fff, 1px 1px #ffffff;
  font-size: 12px;
}
.xp-button:hover { background: linear-gradient(#fff, #d5e8fb); }
.xp-button:active { background: linear-gradient(#b6d3ee, #edf6ff); }
.xp-button:focus-visible, input:focus-visible {
  outline: 2px solid #245edb; outline-offset: 2px;
}
.spacer { flex: 1; }
.speed-label { font-size: 12px; white-space: nowrap; }
input[type="range"] { accent-color: #2468cf; width: clamp(85px, 15vw, 150px); }
.statusbar {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  min-height: 23px;
  padding: 4px 8px;
  border: 1px solid #c0c0b6;
  border-top-color: #9e9e94;
  background: #ece9d8;
  color: #4b4b4b;
  font-size: 11px;
}
@keyframes drift { from { margin-left: -12%; } to { margin-left: 35%; } }
@keyframes rays { from { transform: rotate(-3deg); opacity: .1; } to { transform: rotate(4deg); opacity: .24; } }
@keyframes sweep { 0% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
@media (max-width: 520px) {
  .desktop { padding: 6px; gap: 6px; }
  .menubar { min-height: 25px; }
  .toolbar { gap: 6px; padding: 7px; }
  .xp-button { padding: 5px 9px; }
  .speed-label { width: 100%; }
  .statusbar { font-size: 10px; }
  .lyric-view { padding: 8% 5%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    scroll-behavior: auto !important;
    transition: none !important;
  }
}
</style>
</head>
<body>
<div class="desktop">
  <main class="window">
    <header class="titlebar">
      <div class="title-left">
        <span class="app-icon">♫</span>
        <span>Cinematic Lyrics Player</span>
      </div>
      <div class="window-buttons">
        <button class="win-btn" aria-label="Minimize">_</button>
        <button class="win-btn" aria-label="Maximize">□</button>
        <button class="win-btn close" aria-label="Close" id="closeWindow">×</button>
      </div>
    </header>
    <nav class="menubar" aria-label="Menu">
      <span>File</span><span>View</span><span>Playback</span><span>Help</span>
    </nav>

    <section class="stage" id="stage" aria-label="Animated lyrics">
      <div class="sky-haze"></div>
      <div class="sunlight"></div>
      <div class="cloud-layer" id="cloudLayer">
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
        <div class="cloud c3"></div>
      </div>
      <div class="hills back" id="backHill"></div>
      <div class="hills front" id="frontHill"></div>
      <div class="hills foreground" id="nearHill"></div>
      <div class="grass"></div>

      <div class="lyric-view" id="lyricView">
        <div class="lyric" id="lyric" aria-live="off"></div>
      </div>
      <div class="caption" id="caption">A little nostalgia, one line at a time.</div>

      <section class="editor-panel" id="editorPanel" aria-label="Lyrics editor">
        <label for="lyricsInput">Paste lyrics below. Line breaks and blank stanza lines are preserved.</label>
        <textarea class="lyric-editor" id="lyricsInput" spellcheck="false">[PASTE LYRICS HERE]</textarea>
        <div class="editor-actions">
          <button class="xp-button" id="cancelEdit">Cancel</button>
          <button class="xp-button" id="applyLyrics">Apply lyrics</button>
        </div>
      </section>
    </section>
  </main>

  <div class="toolbar" role="toolbar" aria-label="Playback controls">
    <button class="xp-button" id="playPause">▶ Play</button>
    <button class="xp-button" id="restart">↺ Restart</button>
    <button class="xp-button" id="editLyrics">♫ Edit lyrics</button>
    <span class="spacer"></span>
    <label class="speed-label" for="speed">Playback speed <strong id="speedValue">1.0×</strong></label>
    <input id="speed" type="range" min="0.5" max="1.8" step="0.1" value="1" aria-label="Playback speed">
  </div>

  <footer class="statusbar">
    <span id="status">Ready</span>
    <span id="counter">Line 0 / 0</span>
  </footer>
</div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const lyric = $("lyric");
  const stage = $("stage");
  const lyricView = $("lyricView");
  const input = $("lyricsInput");
  const editor = $("editorPanel");
  const playButton = $("playPause");
  const speedInput = $("speed");
  const speedValue = $("speedValue");
  const status = $("status");
  const counter = $("counter");

  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  const motions = [
    { name: "Push in", from: "translate3d(0, 20px, -100px) scale(.88)", to: "translate3d(0, 0, 0) scale(1)" },
    { name: "Side dolly", from: "translate3d(-65px, 0, -50px) rotateY(12deg)", to: "translate3d(0, 0, 0) rotateY(0)" },
    { name: "Tilt up", from: "translate3d(0, 50px, 0) rotateX(-12deg)", to: "translate3d(0, 0, 0) rotateX(0)" },
    { name: "Orbit", from: "translate3d(45px, 12px, -60px) rotateY(-10deg) rotateZ(-2deg)", to: "translate3d(0, 0, 0) rotateY(0) rotateZ(0)" }
  ];

  let lines = [];
  let index = 0;
  let playing = false;
  let timer = null;
  let startTime = 0;
  let remaining = 6000;
  let generation = 0;
  let lastLine = "";
  let repeatCount = 0;

  function getDuration() {
    return 6000 / Number(speedInput.value);
  }

  function parseLyrics(text) {
    // Keep original line text intact. Empty lines become deliberate pauses.
    return text.replace(/\r\n?/g, "\n").split("\n");
  }

  function isChorus(line) {
    if (!line.trim()) return false;
    return lines.slice(0, index).some(previous => previous.trim() === line.trim());
  }

  function updateCounter() {
    counter.textContent = `Line ${lines.length ? Math.min(index + 1, lines.length) : 0} / ${lines.length}`;
  }

  function setStatus(message) {
    status.textContent = message;
  }

  function resetScene() {
    lyricView.style.transform = "";
    $("cloudLayer").style.transform = "";
    $("backHill").style.transform = "";
    $("frontHill").style.transform = "";
    $("nearHill").style.transform = "";
  }

  function stopTimer() {
    clearTimeout(timer);
    timer = null;
    generation++;
  }

  function updateParallax(n) {
    if (reducedMotion.matches) {
      resetScene();
      return;
    }
    const direction = n % 2 ? 1 : -1;
    $("cloudLayer").style.transform = `translateX(${direction * 9}px)`;
    $("backHill").style.transform = `translate3d(${direction * 8}px,0,0) rotate(-4deg)`;
    $("frontHill").style.transform = `translate3d(${direction * -5}px,0,0)`;
    $("nearHill").style.transform = `translate3d(${direction * 14}px,0,0)`;
  }

  function showLine(n) {
    if (!lines.length) return;
    index = n;
    const line = lines[index];
    const token = ++generation;
    clearTimeout(timer);

    lyric.className = "lyric";
    lyric.style.transition = "none";
    lyric.style.opacity = "0";
    lyric.style.transform = "none";
    lyric.textContent = line;
    updateCounter();

    if (line.trim() && line.trim() === lastLine.trim()) repeatCount++;
    else repeatCount = 0;
    if (line.trim()) lastLine = line;

    const chorus = isChorus(line);
    if (chorus) lyric.classList.add("chorus");

    if (!line.trim()) {
      lyric.textContent = "";
      lyric.style.opacity = "0";
    }

    const duration = getDuration();
    const motion = motions[index % motions.length];
    const fadeIn = Math.min(1100, duration * .23);
    const fadeOut = Math.min(900, duration * .18);
    const hold = Math.max(300, duration - fadeIn - fadeOut);

    updateParallax(index);

    if (reducedMotion.matches) {
      lyric.style.transform = "none";
      lyric.style.transition = `opacity ${fadeIn}ms ease-in-out`;
      requestAnimationFrame(() => {
        lyric.style.opacity = line.trim() ? "1" : "0";
      });
    } else {
      lyric.style.transform = motion.from;
      lyric.style.transition = `opacity ${fadeIn}ms ease-in-out, transform ${fadeIn}ms ease-in-out`;
      requestAnimationFrame(() => requestAnimationFrame(() => {
        lyric.style.opacity = line.trim() ? "1" : "0";
        lyric.style.transform = motion.to;
      }));
    }

    $("caption").textContent = line.trim()
      ? (chorus ? "♪ Returning refrain" : motion.name + " · Scene " + (index + 1))
      : "A breath between verses";

    startTime = performance.now();
    remaining = duration;
    setStatus(playing ? "Playing" : "Paused");

    timer = setTimeout(() => {
      if (token !== generation || !playing) return;
      fadeThenAdvance(token, fadeOut);
    }, hold + fadeIn);
  }

  function fadeThenAdvance(token, fadeOut) {
    if (token !== generation || !playing) return;
    lyric.style.transition = `opacity ${fadeOut}ms ease-in-out`;
    lyric.style.opacity = "0";
    timer = setTimeout(() => {
      if (token !== generation || !playing) return;
      if (index >= lines.length - 1) {
        playing = false;
        playButton.textContent = "▶ Play";
        setStatus("Finished");
        return;
      }
      showLine(index + 1);
    }, fadeOut);
  }

  function play() {
    if (!lines.length) return;
    if (index >= lines.length - 1 && !playing) {
      index = 0;
      lastLine = "";
    }
    playing = true;
    playButton.textContent = "Ⅱ Pause";
    showLine(index);
  }

  function pause() {
    playing = false;
    stopTimer();
    lyric.style.transition = "opacity 250ms ease";
    setStatus("Paused");
    playButton.textContent = "▶ Play";
  }

  function restart() {
    stopTimer();
    playing = false;
    index = 0;
    lastLine = "";
    repeatCount = 0;
    lyric.textContent = "";
    lyric.style.opacity = "0";
    resetScene();
    playButton.textContent = "▶ Play";
    setStatus("Ready");
    updateCounter();
    showLine(0);
    playing = false;
    stopTimer();
    playButton.textContent = "▶ Play";
    setStatus("Ready");
  }

  function loadLyrics() {
    stopTimer();
    lines = parseLyrics(input.value);
    index = 0;
    lastLine = "";
    repeatCount = 0;
    lyric.textContent = "";
    lyric.style.opacity = "0";
    editor.classList.remove("open");
    updateCounter();
    setStatus("Lyrics loaded");
    playing = false;
    playButton.textContent = "▶ Play";
  }

  playButton.addEventListener("click", () => {
    if (playing) pause();
    else play();
  });

  $("restart").addEventListener("click", restart);
  $("editLyrics").addEventListener("click", () => {
    if (playing) pause();
    editor.classList.add("open");
    input.focus();
  });
  $("cancelEdit").addEventListener("click", () => editor.classList.remove("open"));
  $("applyLyrics").addEventListener("click", loadLyrics);

  speedInput.addEventListener("input", () => {
    speedValue.textContent = Number(speedInput.value).toFixed(1) + "×";
    if (playing) {
      stopTimer();
      showLine(index);
    }
  });

  $("closeWindow").addEventListener("click", () => {
    if (playing) pause();
    setStatus("Window minimized to the taskbar");
  });

  reducedMotion.addEventListener?.("change", () => {
    resetScene();
    if (playing) showLine(index);
  });

  lines = parseLyrics(input.value);
  updateCounter();
  setStatus("Ready — press Play");
})();
</script>
</body>
</html>
