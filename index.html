<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRAPS — Baccalaureate Mathematics Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg-primary: #1e1e1e;
      --bg-card: #252526;
      --bg-elevated: #2d2d30;
      --border-subtle: #333333;
      --border-active: #555555;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0a0;
      --text-muted: #767676;
      --accent: #4ea1f3;
      --accent-hover: #3b8be0;
      --accent-bg: rgba(78, 161, 243, 0.12);
      --success: #4ec9b0;
      --success-bg: rgba(78, 201, 176, 0.12);
      --danger: #f16c6c;
      --danger-bg: rgba(241, 108, 108, 0.12);
      --font-mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --font-ar-mono: "IBM Plex Mono", "IBM Plex Sans Arabic", "JetBrains Mono", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-mono);
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.75rem 1.25rem 4rem;
    }

    button, input, select, textarea {
      font-family: var(--font-mono);
    }

    .container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      position: relative;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--border-subtle);
      position: relative;
    }

    /* 3x5 Grid Pixel Typography matching the reference alphabet */
    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 0.42rem;
      user-select: none;
      line-height: 1;
    }

    .pixel-letter {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 1.5px;
      width: 24px;
      height: 40px;
    }

    .pixel-cell {
      width: 100%;
      height: 100%;
      background: transparent;
      border-radius: 1px;
    }

    .pixel-cell.on {
      background: var(--text-primary);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    .hamburger-btn {
      width: 48px;
      height: 48px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      color: var(--text-primary);
      cursor: pointer;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .hamburger-btn:hover {
      background: var(--bg-elevated);
      border-color: var(--border-active);
    }

    .hamburger-line {
      width: 18px;
      height: 2px;
      background: currentColor;
      border-radius: 2px;
    }

    .menu-drawer {
      display: none;
      position: absolute;
      top: calc(100% + 0.5rem);
      right: 0;
      width: 360px;
      max-width: 100%;
      max-height: 78vh;
      overflow-y: auto;
      background: var(--bg-card);
      border: 1px solid var(--border-active);
      border-radius: 10px;
      padding: 0.65rem;
      z-index: 50;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
    }

    .menu-drawer.open {
      display: block;
    }

    .menu-lang-btn {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 0.55rem 0.7rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 0.45rem;
      transition: all 0.15s ease;
    }

    .menu-lang-btn:hover {
      border-color: var(--border-active);
      background: var(--accent-bg);
      color: var(--accent);
    }

    .menu-lang-badge {
      font-size: 0.72rem;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--accent);
    }

    .menu-all-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-primary);
      padding: 0.5rem 0.7rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 0.35rem;
    }

    .menu-all-btn:hover,
    .menu-all-btn.active {
      background: var(--accent-bg);
      color: var(--accent);
      border-color: rgba(78, 161, 243, 0.35);
    }

    .book-section {
      border-top: 1px solid var(--border-subtle);
      padding-top: 0.35rem;
      margin-top: 0.25rem;
    }

    .book-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: transparent;
      border: none;
      color: var(--text-primary);
      padding: 0.5rem 0.65rem;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
    }

    .book-header:hover {
      background: var(--bg-elevated);
    }

    .book-chevron {
      font-size: 0.75rem;
      color: var(--text-secondary);
      transition: transform 0.15s ease;
    }

    .book-section.collapsed .book-chevron {
      transform: rotate(-90deg);
    }

    .book-section.collapsed .unit-list,
    .book-section.collapsed .saved-menu-list {
      display: none;
    }

    .unit-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      padding: 0.15rem 0 0.35rem 0.6rem;
    }

    .unit-item-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 0.42rem 0.65rem;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .unit-item-btn:hover {
      background: var(--bg-elevated);
      color: var(--text-primary);
    }

    .unit-item-btn.active {
      background: var(--accent-bg);
      color: var(--accent);
      font-weight: 500;
    }

    .saved-menu-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      padding: 0.25rem 0.25rem 0.35rem;
    }

    .saved-menu-empty {
      font-size: 0.76rem;
      color: var(--text-muted);
      padding: 0.3rem 0.4rem;
    }

    .saved-menu-item {
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 7px;
      padding: 0.55rem 0.65rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .saved-menu-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.7rem;
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
    }

    .saved-menu-preview {
      font-size: 0.76rem;
      color: var(--text-primary);
      line-height: 1.45;
      max-height: 4.5rem;
      overflow: hidden;
    }

    .saved-menu-actions {
      display: flex;
      gap: 0.4rem;
      justify-content: flex-end;
    }

    .btn-mini {
      font-size: 0.72rem;
      padding: 0.25rem 0.55rem;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      color: var(--text-primary);
      transition: all 0.12s ease;
    }

    .btn-mini:hover {
      border-color: var(--border-active);
    }

    .btn-mini.delete:hover {
      background: var(--danger-bg);
      border-color: rgba(241, 108, 108, 0.45);
      color: var(--danger);
    }

    /* Two-Section Problem Block */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      overflow: hidden;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      min-height: 54px;
      padding: 0.85rem 1.5rem;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
    }

    .meta-badges {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
      overflow: hidden;
      flex-wrap: wrap;
    }

    .badge {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 0.24rem 0.65rem;
      border-radius: 5px;
      color: var(--accent);
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-book {
      color: var(--success);
    }

    .badge-unit {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta-right {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-shrink: 0;
    }

    .seed-tag {
      font-size: 0.7rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .problem-number {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .problem-body {
      padding: 1.75rem;
    }

    .problem-statement {
      font-size: 1rem;
      color: var(--text-primary);
      line-height: 1.85;
    }

    .problem-statement .katex-display {
      margin: 1rem 0;
    }

    /* Centered Icon Action Controls */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
    }

    .btn-group {
      display: flex;
      gap: 0.85rem;
      align-items: center;
      justify-content: center;
    }

    button.icon-btn {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    button.icon-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    button.icon-btn.primary {
      background: var(--accent);
      color: #111111;
      border-color: var(--accent);
    }

    button.icon-btn.primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    button.icon-btn.secondary:hover {
      background: var(--bg-elevated);
      border-color: var(--border-active);
    }

    button.icon-btn.active-toggle {
      background: var(--accent-bg);
      color: var(--accent);
      border-color: var(--accent);
    }

    button.icon-btn.saved {
      background: var(--success-bg);
      color: var(--success);
      border-color: rgba(78, 201, 176, 0.45);
    }

    button.icon-btn.saved svg {
      fill: var(--success);
    }

    button.icon-btn.copied {
      background: var(--success-bg);
      color: var(--success);
      border-color: rgba(78, 201, 176, 0.45);
    }

    .status-note {
      font-size: 0.78rem;
      color: var(--text-secondary);
      min-height: 1.15rem;
      text-align: center;
    }

    .solution-card {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-left: 3px solid var(--success);
      border-radius: 10px;
      padding: 1.75rem;
    }

    .solution-card.visible {
      display: block;
    }

    .solution-header {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--success);
      font-weight: 600;
      margin-bottom: 1.1rem;
    }

    .steps-list {
      list-style: none;
      counter-reset: step-counter;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .steps-list li {
      counter-increment: step-counter;
      position: relative;
      padding-left: 2.2rem;
      font-size: 0.92rem;
      line-height: 1.85;
    }

    .steps-list li::before {
      content: counter(step-counter);
      position: absolute;
      left: 0;
      top: 0.25rem;
      width: 1.45rem;
      height: 1.45rem;
      border-radius: 50%;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 0.74rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .final-answer-box {
      margin-top: 1.35rem;
      padding: 0.9rem 1.15rem;
      background: var(--success-bg);
      border: 1px solid rgba(78, 201, 176, 0.3);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 0.96rem;
    }

    .final-answer-box strong {
      color: var(--success);
      margin-right: 0.5rem;
    }

    /* LTR Layout Stability & Mono-Styled Arabic Typography */
    .ar-text {
      font-family: var(--font-ar-mono);
      direction: ltr;
      unicode-bidi: isolate;
      letter-spacing: 0;
      text-transform: none;
    }

    .problem-statement.ar-mode,
    .steps-list.ar-mode li,
    .final-answer-box.ar-mode,
    .saved-menu-preview.ar-mode {
      font-family: var(--font-ar-mono);
      direction: ltr;
      text-align: left;
      letter-spacing: 0;
    }

    .katex {
      font-size: 1.04em;
      direction: ltr;
      unicode-bidi: isolate;
    }

    @media (max-width: 600px) {
      .card-meta {
        padding: 0.75rem 1rem;
        flex-wrap: wrap;
      }
      .problem-body, .solution-card {
        padding: 1.2rem;
      }
      .pixel-letter {
        width: 20px;
        height: 34px;
      }
      .hamburger-btn {
        width: 42px;
        height: 42px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand-logo" aria-label="TRAPS" role="img">
        <div class="pixel-letter" aria-hidden="true">
          <span class="pixel-cell on"></span><span class="pixel-cell on"></span><span class="pixel-cell on"></span>
          <span class="pixel-cell"></span><span class="pixel-cell on"></span><span class="pixel-cell"></span>
          <span class="pixel-cell"></span><span class="pixel-cell on"></span><span class="pixel-cell"></span>
          <span class="pixel-cell"></span><span class="pixel-cell on"></span><span class="pixel-cell"></span>
          <span class="pixel-cell"></span><span class="pixel-cell on"></span><span class="pixel-cell"></span>
        </div>

        <div class="pixel-letter" aria-hidden="true">
          <span class="pixel-cell on"></span><span class="pixel-cell on"></span><span class="pixel-cell on"></span>
          <span class="pixel-cell on"></span><span class="pixel-cell"></span><span class="pixel-cell on"></span>
          <span class="pixel-cell on"></span><span class="pixel-cell on"></span><span class="pixel-cell"></span>
          <span class="pixel-cell on"></span><span class="pixel-cell"></span><span class="pixel-cell on"></span>
          <span class="pixel-cell on"></span><span class="pixel-cell"></span><span class="pixel-cell on"></span>
        </div>

        <div class="pixel-letter" aria-hidden="true">
          <span class="pixel-cell on"></span><span class="pixel-cell on"></span><span class="pixel-cell on"></span>
          <span class="pixel-cell on"></span><span class="pixel-cell"></span><span class="pixel-cell on"></span>
          <span class="pixel-cell on"></span><span class="pixel-cell on"></span><span class="pixel-cell on"></span>
          <span class="pixel-cell on"></span><span class="pixel-cell"></span><span class="pixel-cell on"></span>
          <span class="pixel-cell on"></span><span class="pixel-cell"></span><span class="pixel-cell on"></span>
        </div>

        <div class="pixel-letter" aria-hidden="true">
          <span class="pixel-cell on"></span><span class="pixel-cell on"></span><span class="pixel-cell on"></span>
          <span class="pixel-cell on"></span><span class="pixel-cell"></span><span class="pixel-cell on"></span>
          <span class="pixel-cell on"></span><span class="pixel-cell on"></span><span class="pixel-cell on"></span>
          <span class="pixel-cell on"></span><span class="pixel-cell"></span><span class="pixel-cell"></span>
          <span class="pixel-cell on"></span><span class="pixel-cell"></span><span class="pixel-cell"></span>
        </div>

        <div class="pixel-letter" aria-hidden="true">
          <span class="pixel-cell on"></span><span class="pixel-cell on"></span><span class="pixel-cell on"></span>
          <span class="pixel-cell on"></span><span class="pixel-cell"></span><span class="pixel-cell"></span>
          <span class="pixel-cell on"></span><span class="pixel-cell on"></span><span class="pixel-cell on"></span>
          <span class="pixel-cell"></span><span class="pixel-cell"></span><span class="pixel-cell on"></span>
          <span class="pixel-cell on"></span><span class="pixel-cell on"></span><span class="pixel-cell on"></span>
        </div>
      </div>

      <div class="header-actions">
        <button class="hamburger-btn" id="btn-menu" aria-label="Toggle Curriculum Menu" aria-expanded="false">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </button>
      </div>

      <nav class="menu-drawer" id="menu-drawer" aria-label="Books, Units and Saved Problems">
        <button class="menu-lang-btn" id="btn-lang-toggle" type="button" aria-label="Switch Language">
          <span id="lang-btn-label" class="ar-text">التبديل إلى العربية</span>
          <span class="menu-lang-badge" id="lang-btn-badge">EN → AR</span>
        </button>

        <button class="menu-all-btn active" data-unit="all">All Books &amp; Units (Random)</button>

        <div class="book-section" data-book="analysis">
          <button class="book-header" type="button">
            <span>1. Analysis</span>
            <span class="book-chevron">▾</span>
          </button>
          <ul class="unit-list" data-book-units="analysis"></ul>
        </div>

        <div class="book-section" data-book="algebra-vectors">
          <button class="book-header" type="button">
            <span>2. Algebra and Vectors</span>
            <span class="book-chevron">▾</span>
          </button>
          <ul class="unit-list" data-book-units="algebra-vectors"></ul>
        </div>

        <div class="book-section" data-book="saved">
          <button class="book-header" type="button">
            <span>Saved Problems (<span id="menu-saved-count">0</span>)</span>
            <span class="book-chevron">▾</span>
          </button>
          <div class="saved-menu-list" id="saved-menu-container"></div>
        </div>
      </nav>
    </header>

    <main class="card">
      <div class="card-meta" id="tags-section">
        <div class="meta-badges">
          <span class="badge badge-book" id="problem-book">Loading...</span>
          <span class="badge badge-unit" id="problem-unit">Loading...</span>
        </div>
        <div class="meta-right">
          <span class="seed-tag" id="problem-seed">SEED: --------</span>
          <span class="problem-number" id="problem-id">#001</span>
        </div>
      </div>
      <div class="problem-body" id="problem-section">
        <div class="problem-statement" id="problem-text"></div>
      </div>
    </main>

    <div class="controls">
      <div class="btn-group">
        <button class="icon-btn primary" id="btn-new" type="button" title="New Problem" aria-label="New Problem">
          <svg viewBox="0 0 24 24">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <polyline points="21 3 21 9 15 9" />
          </svg>
        </button>

        <button class="icon-btn secondary" id="btn-toggle-solution" type="button" title="Show Solution" aria-label="Show Solution">
          <svg id="icon-eye" viewBox="0 0 24 24">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>

        <button class="icon-btn secondary" id="btn-save-problem" type="button" title="Save Problem" aria-label="Save Problem">
          <svg viewBox="0 0 24 24">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
          </svg>
        </button>

        <button class="icon-btn secondary" id="btn-share-link" type="button" title="Copy Shareable Seeded Link" aria-label="Copy Shareable Seeded Link">
          <svg id="icon-share" viewBox="0 0 24 24">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
          </svg>
        </button>
      </div>
      <span class="status-note" id="status-note"></span>

  <script>
    /* =========================================================================
       1. SEEDED PRNG (MULBERRY32) & EXACT ALGEBRAIC UTILITIES
       ========================================================================= */
    const DIFFICULTY = "bac";
    let activeRng = Math.random;

    function createSeededRng(seedUint32) {
      let a = seedUint32 >>> 0;
      return function () {
        a |= 0;
        a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function generateRandomSeed() {
      if (window.crypto && typeof window.crypto.getRandomValues === "function") {
        const buf = new Uint32Array(1);
        window.crypto.getRandomValues(buf);
        return (buf[0] >>> 0) || 1;
      }
      return (Math.floor(Math.random() * 0xffffffff) >>> 0) || 1;
    }

    function encodeSeedBase36(seedUint32) {
      return (seedUint32 >>> 0).toString(36).toUpperCase();
    }

    function parseSeedParam(rawParam) {
      if (!rawParam) return null;
      const trimmed = rawParam.trim();
      if (/^[0-9a-zA-Z]{1,10}$/.test(trimmed)) {
        const parsed = parseInt(trimmed, 36);
        if (Number.isFinite(parsed) && parsed > 0) {

      }
      if (/^\d{1,12}$/.test(trimmed)) {
        const parsed = Number(trimmed);
        if (Number.isFinite(parsed) && parsed > 0) {
          return (parsed >>> 0);
        }
      }
      return null;
    }

    const MathFmt = {
      gcd(a, b) {
        a = Math.abs(Math.round(a));
        b = Math.abs(Math.round(b));
        while (b !== 0) {
          const t = b;
          b = a % b;
          a = t;
        }
        return a === 0 ? 1 : a;
      },

      frac(n, d = 1) {
        if (d === 0) throw new Error("Division by zero");
        if (n === 0) return { n: 0, d: 1 };
        if (d < 0) { n = -n; d = -d; }
        const g = this.gcd(n, d);
        return { n: n / g, d: d / g };
      },

      addFrac(f1, f2) {
        return this.frac(f1.n * f2.d + f2.n * f1.d, f1.d * f2.d);
      },

      subFrac(f1, f2) {
        return this.frac(f1.n * f2.d - f2.n * f1.d, f1.d * f2.d);
      },

      mulFrac(f1, f2) {
        return this.frac(f1.n * f2.n, f1.d * f2.d);
      },

      texFrac(f) {
        if (f.n === 0) return "0";
        const sign = f.n < 0 ? "-" : "";
        const absN = Math.abs(f.n);
        if (f.d === 1) return `${sign}${absN}`;
        return `${sign}\\frac{${absN}}{${f.d}}`;
      },

      signedNum(k) {
        if (k === 0) return "";
        return k > 0 ? ` + ${k}` : ` - ${Math.abs(k)}`;
      },

      linear(a, b, v = "x") {
        let out = "";
        if (a !== 0) {
          if (a === 1) out += v;
          else if (a === -1) out += `-${v}`;
          else out += `${a}${v}`;
        }
        if (b !== 0) {
          out += out === "" ? `${b}` : this.signedNum(b);
        }
        return out === "" ? "0" : out;
      },

      rational(a, b, c, d, v = "x") {
        return `\\frac{${this.linear(a, b, v)}}{${this.linear(c, d, v)}}`;
      },

      coeff(k, sym, leading = true) {
        if (k === 0) return "";
        if (leading) {
          if (k === 1) return sym;
          if (k === -1) return `-${sym}`;
          return `${k}${sym}`;
        }
        if (k === 1) return ` + ${sym}`;
        if (k === -1) return ` - ${sym}`;
        return k > 0 ? ` + ${k}${sym}` : ` - ${Math.abs(k)}${sym}`;
      },

      simplifySqrt(n) {
        if (n === 0) return { out: 0, inside: 1 };
        let out = 1;
        let inside = n;
        for (let i = 2; i * i <= inside; i++) {
          while (inside % (i * i) === 0) {
            out *= i;
            inside /= (i * i);
          }
        }
        return { out, inside };
      },

      texSqrt(n) {
        if (n === 0) return "0";
        const { out, inside } = this.simplifySqrt(n);
        if (inside === 1) return `${out}`;
        if (out === 1) return `\\sqrt{${inside}}`;
        return `${out}\\sqrt{${inside}}`;
      },

      texPi(f) {
        if (f.n === 0) return "0";
        const sign = f.n < 0 ? "-" : "";
        const absN = Math.abs(f.n);
        const numStr = absN === 1 ? "\\pi" : `${absN}\\pi`;
        if (f.d === 1) return `${sign}${numStr}`;
        return `${sign}\\frac{${numStr}}{${f.d}}`;
      },

      comb(n, k) {
        if (k < 0 || k > n) return 0;
        let res = 1;
        for (let i = 1; i <= k; i++) {
          res = (res * (n - i + 1)) / i;
        }
        return Math.round(res);
      },

      perm(n, k) {
        if (k < 0 || k > n) return 0;
        let res = 1;
        for (let i = 0; i < k; i++) {
          res *= (n - i);
        }
        return Math.round(res);
      }
    };

          steps: [

            `Since $\\sqrt{${a} - ${b}x^2} > 0$ on $]-${rBound}, ${rBound}[$ and $${b} > 0$, $f'(x) > 0 \\iff -x > 0 \\iff x \\in ]-${rBound}, 0[$.`

          ],
          answer: `f'(x) = \\frac{-${b}x}{\\sqrt{${a} - ${b}x^2}}; \\; f'(x) > 0 \\text{ on } ]-${rBound}, 0[`,
          answerLabelAr: "الجواب النهائي"

          statement: `For $n \\ge 1$, let $u_n = n^2${MathFmt.coeff(-2 * k, "n", false)}${MathFmt.signedNum(c)}$. Compute $u_{n+1} - u_n$ and find for which $n \\ge 1$ the sequence becomes strictly increasing.`,
          statementAr: `من أجل $n \\ge 1$، ليكن $u_n = n^2${MathFmt.coeff(-2 * k, "n", false)}${MathFmt.signedNum(c)}$. احسب $u_{n+1} - u_n$ وحدد من أجل أي $n$ تصبح المتتالية متزايدة تماماً.`,

          book: "Algebra and Vectors", bookAr: "الجبر والأشعة",
          unit: "Probability", unitAr: "الاحتمالات",
          statement: `Given $P(A \\cap B) = \\dfrac{1}{6}$ and $P(B) = \\dfrac{1}{2}$, compute $P(A \\mid B)$ (trap: dividing by $P(A)$ rather than the conditioning event $P(B)$).`,
          statementAr: `إذا كان $P(A \\cap B) = \\dfrac{1}{6}$ و $P(B) = \\dfrac{1}{2}$، احسب الاحتمال الشرطي $P(A \\mid B)$ (انتبه للقسمة على احتمال الحدث الشرطي $P(B)$).`,
          steps: [
            `By definition, $P(A \\mid B) = \\dfrac{P(A \\cap B)}{P(B)} = \\dfrac{1/6}{1/2} = ${MathFmt.texFrac(condFrac)}$.`
          ],
          stepsAr: [
            `بحسب التعريف: $P(A \\mid B) = \\dfrac{P(A \\cap B)}{P(B)} = ${MathFmt.texFrac(condFrac)}$.`
          ],
          answer: `P(A \\mid B) = ${MathFmt.texFrac(condFrac)}`,
          answerLabelAr: "الجواب النهائي"
        };
      } else if (idx === 2) {
        const pA = MathFmt.frac(1, 2);
        const pB = MathFmt.frac(1, 3);
        const pInter = MathFmt.frac(1, 6);
        const unionFrac = MathFmt.subFrac(MathFmt.addFrac(pA, pB), pInter);

        return {
          book: "Algebra and Vectors", bookAr: "الجبر والأشعة",
          unit: "Probability", unitAr: "الاحتمالات",
          statement: `If $P(A) = \\dfrac{1}{2}$, $P(B) = \\dfrac{1}{3}$, and $P(A \\cap B) = \\dfrac{1}{6}$, find $P(A \\cup B)$ (trap: adding $P(A) + P(B)$ without subtracting $P(A \\cap B)$).`,
          statementAr: `إذا كان $P(A) = \\dfrac{1}{2}$ و $P(B) = \\dfrac{1}{3}$ و $P(A \\cap B) = \\dfrac{1}{6}$، احسب $P(A \\cup B)$ (انتبه لطرح التقاطع).`,
          steps: [
            `$P(A \\cup B) = P(A) + P(B) - P(A \\cap B) = \\dfrac{1}{2} + \\dfrac{1}{3} - \\dfrac{1}{6} = ${MathFmt.texFrac(unionFrac)}$.`
          ],
          stepsAr: [
            `$P(A \\cup B) = \\dfrac{1}{2} + \\dfrac{1}{3} - \\dfrac{1}{6} = ${MathFmt.texFrac(unionFrac)}$.`
          ],
          answer: `P(A \\cup B) = ${MathFmt.texFrac(unionFrac)}`,
          answerLabelAr: "الجواب النهائي"
        };
      } else if (idx === 3) {
        const pE1 = MathFmt.frac(1, 4);
        const pE2 = MathFmt.frac(3, 4);
        const pAonE1 = MathFmt.frac(2, 3);
        const pAonE2 = MathFmt.frac(1, 3);
        const totalP = MathFmt.addFrac(MathFmt.mulFrac(pE1, pAonE1), MathFmt.mulFrac(pE2, pAonE2));

        return {
          book: "Algebra and Vectors", bookAr: "الجبر والأشعة",
          unit: "Probability", unitAr: "الاحتمالات",
          statement: `A partition $\\{E_1, E_2\\}$ has $P(E_1) = \\dfrac{1}{4}$ and $P(E_2) = \\dfrac{3}{4}$, with $P(A \\mid E_1) = \\dfrac{2}{3}$ and $P(A \\mid E_2) = \\dfrac{1}{3}$. Compute $P(A)$.`,
          statementAr: `تجزئة $\\{E_1, E_2\\}$ تحقق $P(E_1) = \\dfrac{1}{4}$ و $P(E_2) = \\dfrac{3}{4}$، مع $P(A \\mid E_1) = \\dfrac{2}{3}$ و $P(A \\mid E_2) = \\dfrac{1}{3}$. احسب $P(A)$.`,
          steps: [
            `Law of total probability: $P(A) = P(E_1)P(A \\mid E_1) + P(E_2)P(A \\mid E_2)$.`,
            `$P(A) = \\dfrac{1}{4}\\cdot\\dfrac{2}{3} + \\dfrac{3}{4}\\cdot\\dfrac{1}{3} = \\dfrac{1}{6} + \\dfrac{1}{4} = ${MathFmt.texFrac(totalP)}$.`
          ],
          stepsAr: [
            `بحسب قانون الاحتمال الكلي: $P(A) = \\dfrac{1}{4}\\cdot\\dfrac{2}{3} + \\dfrac{3}{4}\\cdot\\dfrac{1}{3} = ${MathFmt.texFrac(totalP)}$.`
          ],
          answer: `P(A) = ${MathFmt.texFrac(totalP)}`,
          answerLabelAr: "الجواب النهائي"
        };
      } else {
        const prob = MathFmt.frac(4, 9);

        return {
          book: "Algebra and Vectors", bookAr: "الجبر والأشعة",
          unit: "Probability", unitAr: "الاحتمالات",
          statement: `In $3$ independent Bernoulli trials with success probability $p = \\dfrac{1}{3}$, find the probability of getting exactly $1$ success (trap: forgetting the binomial coefficient $\\binom{3}{1} = 3$ for the positions of the success).`,
          statementAr: `في $3$ تجارب برنولي مستقلة احتمال النجاح في كل منها $p = \\dfrac{1}{3}$، احسب احتمال الحصول على نجاح واحد بالضبط (انتبه لمعامل التوفيقة $\\binom{3}{1}$).`,
          steps: [
            `$P(X = 1) = \\binom{3}{1} \\left(\\dfrac{1}{3}\\right)^1 \\left(\\dfrac{2}{3}\\right)^2 = 3 \\cdot \\dfrac{1}{3} \\cdot \\dfrac{4}{9} = ${MathFmt.texFrac(prob)}$.`
          ],
          stepsAr: [
            `$P(X = 1) = \\binom{3}{1} \\left(\\dfrac{1}{3}\\right)^1 \\left(\\dfrac{2}{3}\\right)^2 = ${MathFmt.texFrac(prob)}$.`
          ],
          answer: `P(X = 1) = ${MathFmt.texFrac(prob)}`,
          answerLabelAr: "الجواب النهائي"
        };
      }
    }

    /* =========================================================================
       4. CURRICULUM, SEEDED URL ENCODING, PERSISTENT ARABIC TOGGLE & STATE
       ========================================================================= */
    const STORAGE_KEY = "traps_saved_problems_v1";
    const LANG_STORAGE_KEY = "traps_lang_pref_v1";

    const CURRICULUM = {
      analysis: {
        label: "1. Analysis",
        units: [
          { id: "sequences", label: "Sequences", fn: genSequences },
          { id: "limits", label: "Limits", fn: genLimits },
          { id: "differentiation", label: "Differentiation", fn: genDifferentiation },
          { id: "monotonicity", label: "Monotonicity of a Sequence", fn: genMonotonicitySequence },
          { id: "logarithmic", label: "Logarithmic Function", fn: genLogarithmic },
          { id: "exponential", label: "Exponential Function", fn: genExponential },
          { id: "integration", label: "Integration", fn: genIntegration }
        ]
      },
      "algebra-vectors": {
        label: "2. Algebra and Vectors",
        units: [
          { id: "vector", label: "Vector", fn: genVector },
          { id: "complex-numbers", label: "Complex Numbers", fn: genComplexNumbers },
          { id: "complex-geometry", label: "Applications of Complex Numbers in Geometry", fn: genComplexGeometry },
          { id: "counting-techniques", label: "Counting Techniques", fn: genCountingTechniques },
          { id: "probability", label: "Probability", fn: genProbability }
        ]
      }
    };

    const ALL_UNITS = [
      ...CURRICULUM.analysis.units,
      ...CURRICULUM["algebra-vectors"].units
    ];

    function loadSavedFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function persistSavedToStorage(list) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      } catch {
        // Ignore storage quota errors
      }
    }

    function loadLangPrefFromStorage() {
      try {
        return localStorage.getItem(LANG_STORAGE_KEY) === "ar";
      } catch {
        return false;
      }
    }

    function persistLangPrefToStorage(isAr) {
      try {
        localStorage.setItem(LANG_STORAGE_KEY, isAr ? "ar" : "en");
      } catch {
        // Ignore storage errors
      }
    }

    function getProblemSignature(problem) {
      return `${problem.book}::${problem.unit}::${problem.statement}`.replace(/\s+/g, " ").trim();
    }

    const state = {
      activeUnit: "all",
      arabicMode: loadLangPrefFromStorage(),
      problemIndex: 0,
      currentProblem: null,
      currentMeta: null,
      solutionVisible: false,
      menuOpen: false,
      savedProblems: loadSavedFromStorage()
    };

    const dom = {
      btnLangToggle: document.getElementById("btn-lang-toggle"),
      langBtnLabel: document.getElementById("lang-btn-label"),
      langBtnBadge: document.getElementById("lang-btn-badge"),
      btnMenu: document.getElementById("btn-menu"),
      menuDrawer: document.getElementById("menu-drawer"),
      menuAllBtn: document.querySelector(".menu-all-btn"),
      problemBook: document.getElementById("problem-book"),
      problemUnit: document.getElementById("problem-unit"),
      problemSeed: document.getElementById("problem-seed"),
      problemId: document.getElementById("problem-id"),
      problemText: document.getElementById("problem-text"),
      btnNew: document.getElementById("btn-new"),
      btnToggle: document.getElementById("btn-toggle-solution"),
      iconEye: document.getElementById("icon-eye"),
      btnSave: document.getElementById("btn-save-problem"),
      btnShare: document.getElementById("btn-share-link"),
      iconShare: document.getElementById("icon-share"),
      statusNote: document.getElementById("status-note"),
      solutionCard: document.getElementById("solution-card"),
      solutionHeader: document.getElementById("solution-header"),
      solutionSteps: document.getElementById("solution-steps"),
      finalAnswer: document.getElementById("final-answer"),
      menuSavedCount: document.getElementById("menu-saved-count"),
      savedMenuContainer: document.getElementById("saved-menu-container")
    };

    function updateLangToggleUI() {
      const isAr = state.arabicMode;
      document.documentElement.lang = isAr ? "ar" : "en";
      if (isAr) {
        dom.langBtnLabel.textContent = "Switch to English";
        dom.langBtnLabel.classList.remove("ar-text");
        dom.langBtnBadge.textContent = "AR → EN";
        dom.btnLangToggle.setAttribute("aria-label", "Switch to English");
      } else {
        dom.langBtnLabel.textContent = "التبديل إلى العربية";
        dom.langBtnLabel.classList.add("ar-text");
        dom.langBtnBadge.textContent = "EN → AR";
        dom.btnLangToggle.setAttribute("aria-label", "Switch to Arabic");
      }
    }

    function populateMenuUnits() {
      Object.entries(CURRICULUM).forEach(([bookKey, bookData]) => {
        const ul = document.querySelector(`[data-book-units="${bookKey}"]`);
        ul.innerHTML = bookData.units
          .map(u => `<li><button class="unit-item-btn" type="button" data-unit="${u.id}">${u.label}</button></li>`)
          .join("");
      });
    }

    function highlightActiveUnit() {
      dom.menuAllBtn.classList.toggle("active", state.activeUnit === "all");
      document.querySelectorAll(".unit-item-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.unit === state.activeUnit);
      });
    }

    function setMenuOpen(open) {
      state.menuOpen = open;
      dom.menuDrawer.classList.toggle("open", open);
      dom.btnMenu.setAttribute("aria-expanded", String(open));
    }

    function typesetMath(element) {
      if (typeof renderMathInElement === "function") {
        renderMathInElement(element, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false }
          ],
          throwOnError: false
        });
      }
    }

    function buildShareUrl(meta) {
      const url = new URL(window.location.href);
      url.searchParams.set("gen", meta.generatorId);
      url.searchParams.set("diff", DIFFICULTY);
      url.searchParams.set("seed", encodeSeedBase36(meta.seed));
      return url.toString();
    }

    function syncUrlToProblem(meta) {
      try {
        const url = new URL(window.location.href);
        url.searchParams.set("gen", meta.generatorId);
        url.searchParams.set("diff", DIFFICULTY);
        url.searchParams.set("seed", encodeSeedBase36(meta.seed));
        window.history.replaceState(null, "", url.toString());
      } catch {
        // Ignore history restrictions in sandboxed environments
      }
    }

    function isCurrentProblemSaved() {
      if (!state.currentProblem) return false;
      const sig = getProblemSignature(state.currentProblem);
      return state.savedProblems.some(item => item.id === sig);
    }

    function updateSaveButtonState() {
      const saved = isCurrentProblemSaved();
      dom.btnSave.classList.toggle("saved", saved);
      dom.btnSave.classList.toggle("secondary", !saved);
      const label = saved ? "Saved" : "Save Problem";
      dom.btnSave.title = label;
      dom.btnSave.setAttribute("aria-label", label);
    }

    function renderSavedInMenu() {
      dom.menuSavedCount.textContent = String(state.savedProblems.length);
      if (state.savedProblems.length === 0) {
        dom.savedMenuContainer.innerHTML = `<p class="saved-menu-empty">No saved problems yet.</p>`;
        return;
      }

      dom.savedMenuContainer.innerHTML = state.savedProblems.map((item, idx) => {
        const previewText = state.arabicMode && item.statementAr ? item.statementAr : item.statement;
        const unitLabel = state.arabicMode && item.unitAr ? item.unitAr : item.unit;
        return `
          <div class="saved-menu-item" data-id="${encodeURIComponent(item.id)}">
            <div class="saved-menu-top">
              <span>#${idx + 1} &middot; <span class="${state.arabicMode ? "ar-text" : ""}">${unitLabel}</span></span>
            </div>
            <div class="saved-menu-preview ${state.arabicMode ? "ar-mode" : ""}">${previewText}</div>
            <div class="saved-menu-actions">
              <button class="btn-mini open" type="button" data-action="open">Open</button>
              <button class="btn-mini delete" type="button" data-action="delete">Delete</button>
            </div>
          </div>
        `;
      }).join("");

      typesetMath(dom.savedMenuContainer);
    }

    function setSolutionVisibility(visible) {
      state.solutionVisible = visible;
      if (visible) {
        dom.solutionCard.classList.add("visible");
        dom.btnToggle.classList.add("active-toggle");
        dom.btnToggle.title = "Hide Solution";
        dom.btnToggle.setAttribute("aria-label", "Hide Solution");
        dom.iconEye.innerHTML = `
          <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
          <line x1="1" y1="1" x2="23" y2="23" />
        `;
      } else {
        dom.solutionCard.classList.remove("visible");
        dom.btnToggle.classList.remove("active-toggle");
        dom.btnToggle.title = "Show Solution";
        dom.btnToggle.setAttribute("aria-label", "Show Solution");
        dom.iconEye.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
          <circle cx="12" cy="12" r="3" />
        `;
      }
    }

    function applyProblemDisplay() {
      const problem = state.currentProblem;
      if (!problem) return;

      const isAr = state.arabicMode;
      const bookLabel = isAr && problem.bookAr ? problem.bookAr : problem.book;
      const unitLabel = isAr && problem.unitAr ? problem.unitAr : problem.unit;
      const statementContent = isAr && problem.statementAr ? problem.statementAr : problem.statement;
      const stepsList = isAr && problem.stepsAr ? problem.stepsAr : problem.steps;
      const answerLabel = isAr && problem.answerLabelAr ? problem.answerLabelAr : "Final Answer";

      dom.problemBook.textContent = bookLabel;
      dom.problemBook.classList.toggle("ar-text", isAr);

      dom.problemUnit.textContent = unitLabel;
      dom.problemUnit.classList.toggle("ar-text", isAr);

      dom.problemText.innerHTML = statementContent;
      dom.problemText.classList.toggle("ar-mode", isAr);

      dom.solutionHeader.textContent = isAr ? "خطوات الحل" : "Step-by-Step Derivation";
      dom.solutionHeader.classList.toggle("ar-text", isAr);

      dom.solutionSteps.innerHTML = stepsList
        .map(step => `<li>${step}</li>`)
        .join("");
      dom.solutionSteps.classList.toggle("ar-mode", isAr);

      dom.finalAnswer.innerHTML = `<strong>${answerLabel}:</strong> $${problem.answer}$`;
      dom.finalAnswer.classList.toggle("ar-mode", isAr);

      typesetMath(dom.problemText);
      typesetMath(dom.solutionCard);
    }

    function renderProblem(problem, labelNumber, meta) {
      state.currentProblem = problem;
      state.currentMeta = meta;
      setSolutionVisibility(false);
      updateSaveButtonState();

      dom.problemSeed.textContent = `SEED:${encodeSeedBase36(meta.seed)}`;
      dom.problemId.textContent = `#${String(labelNumber).padStart(3, "0")}`;

      applyProblemDisplay();
      syncUrlToProblem(meta);
    }

    function generateSeededProblem({ generatorId, seed }) {
      const seedNum = (seed >>> 0) || 1;
      const unitObj = ALL_UNITS.find(u => u.id === generatorId);

      activeRng = createSeededRng(seedNum);
      const selectedUnit = unitObj || Rand.pick(ALL_UNITS);
      const problem = selectedUnit.fn();
      activeRng = Math.random;

      return {
        problem,
        meta: {
          generatorId: selectedUnit.id,
          difficulty: DIFFICULTY,
          seed: seedNum
        }
      };
    }

    function loadNewProblem(forcedSeed = null, forcedGenId = null) {
      const genId = forcedGenId || (state.activeUnit === "all" ? null : state.activeUnit);
      const seed = forcedSeed !== null ? forcedSeed : generateRandomSeed();
      const { problem, meta } = generateSeededProblem({
        generatorId: genId,
        seed
      });

      state.problemIndex += 1;
      dom.statusNote.textContent = "";
      renderProblem(problem, state.problemIndex, meta);
    }

    dom.btnLangToggle.addEventListener("click", () => {
      state.arabicMode = !state.arabicMode;
      persistLangPrefToStorage(state.arabicMode);
      updateLangToggleUI();
      applyProblemDisplay();
      renderSavedInMenu();
      dom.statusNote.textContent = state.arabicMode ? "Arabic translation active." : "English active.";
    });

    async function copyShareLink() {
      if (!state.currentMeta) return;
      const shareUrl = buildShareUrl(state.currentMeta);
      let copied = false;

      if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
        try {
          await navigator.clipboard.writeText(shareUrl);
          copied = true;
        } catch {
          copied = false;
        }
      }

      if (!copied) {
        const tempInput = document.createElement("input");
        tempInput.value = shareUrl;
        document.body.appendChild(tempInput);
        tempInput.select();
        try {
          copied = document.execCommand("copy");
        } catch {
          copied = false;
        }
        document.body.removeChild(tempInput);
      }

      if (copied) {
        dom.btnShare.classList.add("copied");
        dom.btnShare.classList.remove("secondary");
        dom.iconShare.innerHTML = `<polyline points="20 6 9 17 4 12" />`;
        dom.statusNote.textContent = "Copied seeded link.";
        setTimeout(() => {
          dom.btnShare.classList.remove("copied");
          dom.btnShare.classList.add("secondary");
          dom.iconShare.innerHTML = `
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
          `;
        }, 1600);
      } else {
        dom.statusNote.textContent = shareUrl;
      }
    }

    dom.btnShare.addEventListener("click", copyShareLink);

    dom.btnSave.addEventListener("click", () => {
      if (!state.currentProblem) return;
      const sig = getProblemSignature(state.currentProblem);
      const exists = state.savedProblems.some(item => item.id === sig);
      if (exists) {
        dom.statusNote.textContent = "Already saved.";
        updateSaveButtonState();
        return;
      }

      state.savedProblems.unshift({
        id: sig,
        book: state.currentProblem.book,
        bookAr: state.currentProblem.bookAr,
        unit: state.currentProblem.unit,
        unitAr: state.currentProblem.unitAr,
        statement: state.currentProblem.statement,
        statementAr: state.currentProblem.statementAr,
        steps: state.currentProblem.steps,
        stepsAr: state.currentProblem.stepsAr,
        answer: state.currentProblem.answer,
        answerLabelAr: state.currentProblem.answerLabelAr,
        meta: state.currentMeta ? { ...state.currentMeta } : null
      });
      persistSavedToStorage(state.savedProblems);
      updateSaveButtonState();
      renderSavedInMenu();
      dom.statusNote.textContent = "Saved.";
    });

    dom.savedMenuContainer.addEventListener("click", (e) => {
      const actionBtn = e.target.closest("[data-action]");
      if (!actionBtn) return;
      const card = actionBtn.closest(".saved-menu-item");
      if (!card) return;
      const id = decodeURIComponent(card.dataset.id);
      const action = actionBtn.dataset.action;

      if (action === "delete") {
        state.savedProblems = state.savedProblems.filter(item => item.id !== id);
        persistSavedToStorage(state.savedProblems);
        updateSaveButtonState();
        renderSavedInMenu();
        dom.statusNote.textContent = "Deleted.";
      } else if (action === "open") {
        const found = state.savedProblems.find(item => item.id === id);
        if (found) {
          dom.statusNote.textContent = "Opened saved problem.";
          if (found.meta && found.meta.seed) {
            const rebuilt = generateSeededProblem(found.meta);
            renderProblem(rebuilt.problem, state.problemIndex, rebuilt.meta);
          } else {
            renderProblem(found, state.problemIndex, state.currentMeta || {
              generatorId: "sequences",
              difficulty: DIFFICULTY,
              seed: generateRandomSeed()
            });
          }
          setMenuOpen(false);
        }
      }
    });

    dom.btnMenu.addEventListener("click", (e) => {
      e.stopPropagation();
      setMenuOpen(!state.menuOpen);
    });

    document.querySelectorAll(".book-header").forEach(headerBtn => {
      headerBtn.addEventListener("click", () => {
        headerBtn.parentElement.classList.toggle("collapsed");
      });
    });

    dom.menuDrawer.addEventListener("click", (e) => {
      const unitBtn = e.target.closest("[data-unit]");
      if (!unitBtn) return;
      state.activeUnit = unitBtn.dataset.unit;
      highlightActiveUnit();
      setMenuOpen(false);
      loadNewProblem();
    });

    document.addEventListener("click", (e) => {
      if (state.menuOpen && !dom.menuDrawer.contains(e.target) && !dom.btnMenu.contains(e.target)) {
        setMenuOpen(false);
      }
    });

    dom.btnNew.addEventListener("click", () => loadNewProblem());

    dom.btnToggle.addEventListener("click", () => {
      setSolutionVisibility(!state.solutionVisible);
    });

    function initFromUrlOrRandom() {
      const params = new URLSearchParams(window.location.search);
      const paramGen = params.get("gen");
      const paramSeed = parseSeedParam(params.get("seed"));

      const matchedUnit = ALL_UNITS.find(u => u.id === paramGen);
      if (matchedUnit && paramSeed !== null) {
        state.activeUnit = matchedUnit.id;
        highlightActiveUnit();
        const { problem, meta } = generateSeededProblem({
          generatorId: matchedUnit.id,
          seed: paramSeed
        });
        state.problemIndex += 1;
        dom.statusNote.textContent = "Loaded from seeded link.";
        renderProblem(problem, state.problemIndex, meta);
      } else if (paramSeed !== null) {
        highlightActiveUnit();
        const { problem, meta } = generateSeededProblem({
          generatorId: null,
          seed: paramSeed
        });
        state.problemIndex += 1;
        dom.statusNote.textContent = "Loaded from seeded link.";
        renderProblem(problem, state.problemIndex, meta);
      } else {
        if (matchedUnit) {
          state.activeUnit = matchedUnit.id;
        }
        highlightActiveUnit();
        loadNewProblem();
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      updateLangToggleUI();
      populateMenuUnits();
      renderSavedInMenu();
      const waitForKatex = setInterval(() => {
        if (typeof renderMathInElement === "function") {
          clearInterval(waitForKatex);
          initFromUrlOrRandom();
        }
      }, 30);
    });
  </script>
</body>
