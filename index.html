    // --- Audio Visualizer ---
    function AudioVisualizer({ isPlaying, accentColor }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        let animationFrameId;
        let bars = Array.from({ length: 28 }, () => Math.random() * 15 + 5);

        const render = () => {
          try {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const barWidth = (canvas.width / bars.length) - 3;

            bars.forEach((bar, i) => {
              const targetHeight = isPlaying 
                ? Math.min(50, Math.max(4, bar + (Math.random() * 8 - 4))) 
                : 3;
              bars[i] = targetHeight;

              const x = i * (barWidth + 3);
              const y = canvas.height - targetHeight;

              ctx.fillStyle = accentColor || '#f59e0b';
              ctx.shadowBlur = isPlaying ? 6 : 0;
              ctx.shadowColor = accentColor || '#f59e0b';
              
              ctx.fillRect(x, y, barWidth, targetHeight);
            });

            animationFrameId = requestAnimationFrame(render);
          } catch (e) {
            console.warn("Canvas animation frame bypassed", e);
          }
        };

        render();
        return () => {
          if (animationFrameId) cancelAnimationFrame(animationFrameId);
        };
      }, [isPlaying, accentColor]);

      return (
        <div className="relative overflow-hidden w-full max-w-xs h-14 flex items-center justify-center my-2 pointer-events-none -z-0">
          <canvas 
            ref={canvasRef} 
            width={280} 
            height={56} 
            className="w-full h-full opacity-80" 
          />
        </div>
      );
    }

    // --- Add Custom Song / Station Modal ---
    function AddCustomModal({ isOpen, onClose, onAddStation }) {
      const [title, setTitle] = useState('');
      const [artist, setArtist] = useState('');
      const [category, setCategory] = useState('Jazz Lounge');
      const [streamUrl, setStreamUrl] = useState('');
      const [coverUrl, setCoverUrl] = useState('');
      const [testing, setTesting] = useState(false);
      const [error, setError] = useState('');

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title.trim() || !streamUrl.trim()) {
          setError('Please fill in the title and stream URL.');
          return;
        }

        setError('');
        setTesting(true);

        // HTML5 Audio Test Buffer
        const testAudio = new Audio();
        testAudio.src = streamUrl;

        const cleanup = () => {
          testAudio.removeEventListener('canplay', handleSuccess);
          testAudio.removeEventListener('error', handleError);
        };

        const handleSuccess = () => {
          cleanup();
          setTesting(false);
          const newStation = {
            id: 'custom-' + Date.now(),
            category: category,
            genreTag: category === 'Other Genres' ? 'My Songs' : category,
            title: title,
            subtitle: 'User Custom Station',
            artist: artist || 'Custom Artist',
            currentTrack: title,
            cover: coverUrl || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&q=80&w=800',
            streamUrl: streamUrl,
            badge: 'CUSTOM',
            accentColor: '#f59e0b',
            isCustom: true
          };
          onAddStation(newStation);
          onClose();
        };

        const handleError = () => {
          cleanup();
          setTesting(false);
          setError('Unable to load audio stream from URL. Please check the link.');
        };

        testAudio.addEventListener('canplay', handleSuccess);
        testAudio.addEventListener('error', handleError);
        testAudio.load();

        // Fallback timeout in case stream hangs
        setTimeout(() => {
          if (testing) {
            cleanup();
            setTesting(false);
            // Allow adding anyway if network test times out
            handleSuccess();
          }
        }, 4000);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-[#18181b] border border-zinc-800 rounded-2xl w-full max-w-md p-6 relative shadow-2xl">

            </button>

            <h3 className="font-serif text-xl font-bold text-white mb-1">Add Song / Station</h3>
            <p className="text-xs text-zinc-400 mb-5">Enter an MP3 or live stream URL to add to your library.</p>

            {error && (
              <div className="mb-4 p-3 bg-red-500/10 border border-red-500/30 rounded-lg text-red-400 text-xs">
                {error}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4 text-sm">
              <div>
                <label className="block text-xs font-mono text-zinc-400 mb-1">Title / Track Name *</label>
                <input 
                  type="text" 
                  value={title} 
                  onChange={e => setTitle(e.target.value)}
                  placeholder="e.g. Autumn Leaves" 
                  className="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500"
                  required
                />
              </div>

              <div>
                <label className="block text-xs font-mono text-zinc-400 mb-1">Artist Name</label>
                <input 
                  type="text" 
                  value={artist} 
                  onChange={e => setArtist(e.target.value)}
                  placeholder="e.g. Chet Baker" 
                  className="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500"
                />
              </div>

              <div>
                <label className="block text-xs font-mono text-zinc-400 mb-1">Category / Genre</label>
                <select 
                  value={category} 
                  onChange={e => setCategory(e.target.value)}
                  className="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500"
                >
                  <option value="Jazz Lounge">Jazz Lounge</option>
                  <option value="Michael Jackson">Michael Jackson</option>
                  <option value="Queen">Queen</option>
                  <option value="Pink Floyd">Pink Floyd</option>
                  <option value="Other Genres">Other / My Songs</option>
                </select>
              </div>

              <div>
                <label className="block text-xs font-mono text-zinc-400 mb-1">Audio Stream URL (.mp3 / .m3u8) *</label>
                <input 
                  type="url" 
                  value={streamUrl} 
                  onChange={e => setStreamUrl(e.target.value)}
                  placeholder="https://example.com/audio.mp3" 
                  className="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500"
                  required
                />
              </div>

              <div>
                <label className="block text-xs font-mono text-zinc-400 mb-1">Cover Image URL (Optional)</label>
                <input 
                  type="url" 
                  value={coverUrl} 
                  onChange={e => setCoverUrl(e.target.value)}
                  placeholder="https://images.unsplash.com/..." 
                  className="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500"
                />
              </div>

              <div className="pt-2 flex justify-end space-x-3">
                <button

                  className="px-4 py-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs transition"

                >
                  {testing ? 'Testing URL...' : 'Add & Play'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- Main App ---
    function App() {
      const [stations, setStations] = useState(() => {
        const saved = localStorage.getItem('velvet_custom_stations');
        return saved ? [...INITIAL_STATIONS, ...JSON.parse(saved)] : INITIAL_STATIONS;
      });

      const [currentStation, setCurrentStation] = useState(stations[0]);
      const [isPlaying, setIsPlaying] = useState(false);
      const [volume, setVolume] = useState(0.8);
      const [isMuted, setIsMuted] = useState(false);
      const [isLiked, setIsLiked] = useState(false);
      const [audioQuality, setAudioQuality] = useState('HD');
      const [activeCategory, setActiveCategory] = useState('All');
      const [isZenMode, setIsZenMode] = useState(false);
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [sleepTimer, setSleepTimer] = useState(null);

      // Dedicated Audio Engine Reference
      const audioRef = useRef(null);

      // Clean Audio Sync Effect with Safe Async Handling
      useEffect(() => {
        const audio = audioRef.current;
        if (!audio) return;

        if (isPlaying) {
          const playPromise = audio.play();
          if (playPromise !== undefined) {
            playPromise.catch((error) => {
              console.warn("Playback error gracefully handled:", error);
              setIsPlaying(false);
            });
          }
        } else {
          audio.pause();
        }
      }, [isPlaying, currentStation]);

      useEffect(() => {
        if (audioRef.current) {
          audioRef.current.volume = isMuted ? 0 : volume;
        }
      }, [volume, isMuted]);

      const togglePlay = useCallback(() => {
        setIsPlaying(prev => !prev);
      }, []);

      const selectStation = (station) => {
        if (currentStation.id === station.id) {
          togglePlay();
        } else {
          setCurrentStation(station);
          setIsPlaying(true);
        }
      };

      const handleAddStation = (newStation) => {
        const customStations = stations.filter(s => s.isCustom);
        const updatedCustom = [...customStations, newStation];
        localStorage.setItem('velvet_custom_stations', JSON.stringify(updatedCustom));
        
        setStations([...INITIAL_STATIONS, ...updatedCustom]);
        setCurrentStation(newStation);
        setIsPlaying(true);
      };

      const handleDeleteStation = (e, stationId) => {
        e.stopPropagation();
        const updated = stations.filter(s => s.id !== stationId);
        const customOnly = updated.filter(s => s.isCustom);
        localStorage.setItem('velvet_custom_stations', JSON.stringify(customOnly));
        
        setStations(updated);
        if (currentStation.id === stationId) {
          setCurrentStation(updated[0] || INITIAL_STATIONS[0]);
          setIsPlaying(false);
        }
      };

      const handleSleepTimer = (minutes) => {
        setSleepTimer(minutes);
        if (minutes) {
          setTimeout(() => {
            setIsPlaying(false);
            setSleepTimer(null);
          }, minutes * 60 * 1000);
        }
      };

      const filteredStations = stations.filter(s => {
        if (activeCategory === 'All') return true;
        if (activeCategory === 'My Songs') return s.isCustom;
        if (OTHER_GENRES.includes(activeCategory)) return s.genreTag === activeCategory;
        return s.category === activeCategory;
      });

      return (
        <div className="min-h-screen bg-[#121212] text-zinc-100 font-sans antialiased flex flex-col justify-between relative">
          
          {/* Native Standard Audio Element */}
          <audio 
            ref={audioRef} 
            src={currentStation.streamUrl} 
            preload="none"
            playsInline
            webkit-playsinline="true"
            x5-playsinline="true"
          />

          {/* Header */}
          <header className="px-6 py-4 border-b border-zinc-800/40 bg-[#0d0d0d]/80 backdrop-blur-md sticky top-0 z-30 flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <div className="p-2 rounded-xl bg-amber-500/10 text-amber-500 border border-amber-500/20">
                <Icons.Radio />
              </div>
              <div>
                <h1 className="font-serif text-lg tracking-tight font-bold text-white">VELVET FM</h1>
                <p className="text-[10px] text-zinc-500 font-mono tracking-widest uppercase">Late Night Lounge</p>
              </div>
            </div>

            <div className="flex items-center space-x-3">
              {/* Add Custom Song Button */}
              <button 
                onClick={() => setIsAddModalOpen(true)}
                className="flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs hover:bg-amber-500/20 transition"
              >
                <Icons.Plus />
                <span className="font-medium">Add Station</span>
              </button>

              {/* Sleep Timer */}
              <div className="relative group">
                <button className="flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-zinc-900 border border-zinc-800 text-xs text-zinc-400 hover:text-white transition">
                  <Icons.Clock />
                  <span>{sleepTimer ? `${sleepTimer}m` : 'Sleep'}</span>
                </button>
                <div className="absolute right-0 mt-2 w-32 bg-zinc-900 border border-zinc-800 rounded-xl shadow-xl opacity-0 group-hover:opacity-100 transition pointer-events-none group-hover:pointer-events-auto p-1 z-40">
                  {[15, 30, 60].map((mins) => (
                    <button
                      key={mins}
                      onClick={() => handleSleepTimer(mins)}
                      className="w-full text-left px-3 py-1.5 text-xs text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-lg transition"
                    >
                      {mins} Minutes
                    </button>
                  ))}
                </div>
              </div>

              {/* Zen Mode Button */}
              <button 
                onClick={() => setIsZenMode(true)}
                className="p-2 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-amber-500 transition"
                title="Zen Mode"
              >
                <Icons.Maximize />
              </button>
            </div>
          </header>

          {/* Main Workspace */}
          <main className="max-w-7xl mx-auto w-full px-6 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8 flex-1">
            
            {/* Center Player Hero */}
            <div className="lg:col-span-7 flex flex-col items-center justify-center bg-[#0d0d0d]/50 rounded-3xl p-8 border border-zinc-800/30 backdrop-blur-sm relative overflow-hidden">
              
              {/* Soft Ambient Glow */}
              <div 
                className="absolute inset-0 opacity-10 blur-3xl pointer-events-none -z-10 transition-colors duration-700"
                style={{ backgroundColor: currentStation.accentColor }}
              />

              <span className="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-400 text-xs font-mono mb-6">
                <span className="w-2 h-2 rounded-full bg-amber-500 animate-ping" />
                <span>{currentStation.badge}</span>
              </span>

              <div className="relative mb-6">
                <img 
                  src={currentStation.cover} 
                  alt={currentStation.title} 
                  className="w-60 h-60 md:w-72 md:h-72 object-cover rounded-2xl shadow-2xl border border-zinc-800/80"
                />
              </div>

              <div className="text-center space-y-1 mb-2">
                <h2 className="font-serif text-2xl md:text-3xl font-semibold tracking-tight text-white">
                  {currentStation.currentTrack}
                </h2>
                <p className="text-zinc-400 font-sans text-sm">
                  {currentStation.artist} — <span className="text-zinc-500">{currentStation.title}</span>
                </p>
              </div>

              <AudioVisualizer isPlaying={isPlaying} accentColor={currentStation.accentColor} />

              {/* Player Controls */}
              <div className="flex items-center space-x-6 mt-4">
                <button 
                  onClick={() => setIsLiked(!isLiked)}
                  className={`p-3 rounded-full border border-zinc-800/60 transition ${
                    isLiked ? 'text-amber-500 bg-amber-500/10 border-amber-500/30' : 'text-zinc-400 hover:text-white bg-zinc-900/50'
                  }`}
                >
                  <Icons.Heart filled={isLiked} />
                </button>

                <button 
                  onClick={togglePlay}
                  className="p-5 rounded-full bg-amber-500 hover:bg-amber-400 text-black shadow-xl shadow-amber-500/20 transition transform active:scale-95"
                >
                  {isPlaying ? <Icons.Pause className="w-7 h-7" /> : <Icons.Play className="w-7 h-7 ml-0.5" />}
                </button>

                <button 
                  onClick={() => setAudioQuality(audioQuality === 'HD' ? 'SD' : 'HD')}
                  className="px-3 py-1.5 text-xs font-mono rounded-lg border border-zinc-800 bg-zinc-900/50 text-zinc-400 hover:text-white transition"
                >
                  {audioQuality}
                </button>
              </div>
            </div>

            {/* Channels & Station Grid */}
            <div className="lg:col-span-5 flex flex-col space-y-6">
              <div className="space-y-3">
                <h3 className="text-xs uppercase tracking-wider text-zinc-500 font-mono">Curated Channels</h3>
                <div className="flex flex-wrap gap-2">
                  {['All', 'Jazz Lounge', 'Michael Jackson', 'Queen', 'Pink Floyd', ...OTHER_GENRES].map((cat) => (
                    <button
                      key={cat}
                      onClick={() => setActiveCategory(cat)}
                      className={`px-3 py-1.5 rounded-xl text-xs font-medium transition ${
                        activeCategory === cat
                          ? 'bg-amber-500 text-black font-semibold'
                          : 'bg-zinc-900/80 text-zinc-400 hover:text-white border border-zinc-800'
                      }`}
                    >
                      {cat}
                    </button>
                  ))}
                </div>
              </div>

              {/* Station List */}
              <div className="space-y-3 overflow-y-auto max-h-[460px] pr-1">
                {filteredStations.map((station) => {
                  const isActive = currentStation.id === station.id;
                  return (
                    <div
                      key={station.id}
                      onClick={() => selectStation(station)}
                      className={`p-3.5 rounded-2xl border transition cursor-pointer flex items-center justify-between group ${
                        isActive
                          ? 'bg-amber-500/10 border-amber-500/40 text-white'
                          : 'bg-zinc-900/40 hover:bg-zinc-900/80 border-zinc-800/60 text-zinc-300'
                      }`}
                    >
                      <div className="flex items-center space-x-3.5 overflow-hidden">
                        <img 
                          src={station.cover} 
                          alt={station.title} 
                          className="w-12 h-12 rounded-xl object-cover border border-zinc-800/80 flex-shrink-0"
                        />
                        <div className="truncate">
                          <h4 className="font-semibold text-sm truncate">{station.title}</h4>
                          <p className="text-xs text-zinc-400 truncate">{station.artist}</p>
                        </div>
                      </div>

                      <div className="flex items-center space-x-2">
                        {station.isCustom && (
                          <button
                            onClick={(e) => handleDeleteStation(e, station.id)}
                            className="p-1.5 text-zinc-500 hover:text-red-400 transition"
                            title="Delete custom station"
                          >
                            <Icons.Trash />
                          </button>
                        )}
                        <button className={`p-2.5 rounded-full transition ${
                          isActive && isPlaying 
                            ? 'bg-amber-500 text-black' 
                            : 'bg-zinc-800 text-zinc-400 group-hover:text-white'
                        }`}>
                          {isActive && isPlaying ? <Icons.Pause className="w-4 h-4" /> : <Icons.Play className="w-4 h-4" />}
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </main>

          {/* Footer */}
          <footer className="px-6 py-4 border-t border-zinc-900 text-center text-xs text-zinc-600">
            Velvet FM — Late Night Jazz & Curated Audio Streaming Experience
          </footer>

          {/* Modals */}
          {isZenMode && (
            <ZenMode 
              station={currentStation} 
              isPlaying={isPlaying} 
              togglePlay={togglePlay} 
              onClose={() => setIsZenMode(false)}
              isLiked={isLiked}
              toggleLike={() => setIsLiked(!isLiked)}
            />
          )}

          <AddCustomModal 
            isOpen={isAddModalOpen} 
            onClose={() => setIsAddModalOpen(false)} 
            onAddStation={handleAddStation}
          />

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
