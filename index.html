<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COBE - Interactive 3D Dot Matrix Globe</title>
  <style>
    :root {
      --bg-color: #FAF8F5;
      --fg-color: #1A1A1A;
      --highlight-color: #1A1A1A;
      --faded-color: #A09E9B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--fg-color);
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    header {
      position: absolute;
      top: 40px;
      left: 40px;
      z-index: 10;
      pointer-events: none;
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
    }

    header p {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.05em;
      opacity: 0.6;
      text-transform: uppercase;
    }

    #selected-country-banner {
      position: absolute;
      bottom: 40px;
      left: 40px;
      z-index: 10;
      pointer-events: none;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #selected-country-banner.visible {
      opacity: 1;
    }

    .label {
      position: absolute;
      top: 0;
      left: 0;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--fg-color);
      pointer-events: none;
      white-space: nowrap;
      transform: translate(-50%, -100%);
      transition: opacity 0.3s ease;
      opacity: 0;
    }

    .label::before {
      content: '';
      display: block;
      width: 4px;
      height: 4px;
      background-color: var(--fg-color);
      border-radius: 50%;
      margin: 0 auto 4px auto;
    }

    .label.visible {
      opacity: 1;
    }
  </style>

  <!-- External Libraries: Three.js, OrbitControls, D3-Geo -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
</head>
<body>

  <header>
    <h1>COBE</h1>
    <p>Interactive webgl globe</p>
  </header>

  <div id="selected-country-banner">Selected: <span id="country-name">None</span></div>

  <div id="canvas-container"></div>
  <div id="labels-container"></div>

  <script>
    const COLOR_BG = 0xFAF8F5;
    const COLOR_FG = 0x1A1A1A;
    const COLOR_FADED = 0xB8B5B0;
    const GLOBE_RADIUS = 200;

    let scene, camera, renderer, controls;
    let globeGroup, pointsMesh;
    let locationLabels = [];
    let isAnimatingToLocation = false;

    let geoData = [];
    let pointData = []; 
    let selectedCountryId = null;

    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();
    let pointerDownPos = { x: 0, y: 0 };

    let locations = [
      { id: 'sf', name: 'SAN FRANCISCO', lat: 37.7749, lng: -122.4194 },
      { id: 'ny', name: 'NEW YORK', lat: 40.7128, lng: -74.0060 }
    ];

    let connections = [{ from: 'sf', to: 'ny' }];

    function latLngToVector3(lat, lng, radius) {
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lng + 180) * (Math.PI / 180);

      const x = -(radius * Math.sin(phi) * Math.cos(theta));
      const z = radius * Math.sin(phi) * Math.sin(theta);
      const y = radius * Math.cos(phi);

      return new THREE.Vector3(x, y, z);
    }

    async function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(COLOR_BG);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
      camera.position.set(0, 150, 600);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.enablePan = false;
      controls.minDistance = 300;
      controls.maxDistance = 900;

      globeGroup = new THREE.Group();
      scene.add(globeGroup);

      // Load accurate GeoJSON dataset
      const res = await fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson');
      const data = await res.json();
      geoData = data.features;

      createAccurateDotMatrixGlobe();
      renderMarkersAndConnections();

      // Click / Selection Event Listeners
      renderer.domElement.addEventListener('pointerdown', (e) => {
        pointerDownPos = { x: e.clientX, y: e.clientY };
      });

      renderer.domElement.addEventListener('pointerup', (e) => {
        // Prevent trigger on camera drag
        const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
        if (dist < 5) onGlobeClick(e);
      });

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function createAccurateDotMatrixGlobe() {
      const positions = [];
      const colors = [];
      const baseColor = new THREE.Color(COLOR_FG);

      pointData = [];

      // Grid sampling across latitude and longitude
      const step = 1.6;
      for (let lat = -85; lat <= 85; lat += step) {
        for (let lng = -180; lng <= 180; lng += step) {
          const feature = geoData.find(f => d3.geoContains(f, [lng, lat]));

          if (feature) {
            const p = latLngToVector3(lat, lng, GLOBE_RADIUS);
            positions.push(p.x, p.y, p.z);
            colors.push(baseColor.r, baseColor.g, baseColor.b);

            pointData.push({
              pos: p,
              countryId: feature.id || feature.properties.ISO_A3 || feature.properties.ADMIN,
              countryName: feature.properties.ADMIN || feature.properties.name,
              lat: lat,
              lng: lng
            });
          }
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

      // Circular Point Texture
      const canvas = document.createElement('canvas');
      canvas.width = 16;
      canvas.height = 16;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(8, 8, 6, 0, Math.PI * 2);
      ctx.fill();

      const texture = new THREE.CanvasTexture(canvas);

      const material = new THREE.PointsMaterial({
        size: 3.2,
        vertexColors: true,
        map: texture,
        transparent: true,
        alphaTest: 0.5
      });

      pointsMesh = new THREE.Points(geometry, material);
      globeGroup.add(pointsMesh);
    }

    function onGlobeClick(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      raycaster.params.Points.threshold = 4;

      const intersects = raycaster.intersectObject(pointsMesh);

      if (intersects.length > 0) {
        const index = intersects[0].index;
        const clickedPoint = pointData[index];

        if (clickedPoint && clickedPoint.countryId) {
          selectCountry(clickedPoint.countryId, clickedPoint.countryName);
        }
      }
    }

    function selectCountry(countryId, countryName) {
      selectedCountryId = countryId;

      const colors = pointsMesh.geometry.attributes.color;
      const colorActive = new THREE.Color(COLOR_FG);
      const colorInactive = new THREE.Color(COLOR_FADED);

      pointData.forEach((pt, idx) => {
        if (pt.countryId === countryId) {
          colors.setXYZ(idx, colorActive.r, colorActive.g, colorActive.b);
        } else {
          colors.setXYZ(idx, colorInactive.r, colorInactive.g, colorInactive.b);
        }
      });

      colors.needsUpdate = true;

      // Update UI Banner
      const banner = document.getElementById('selected-country-banner');
      const nameSpan = document.getElementById('country-name');
      nameSpan.innerText = countryName;
      banner.classList.add('visible');
    }

    function renderMarkersAndConnections() {
      const labelsContainer = document.getElementById('labels-container');
      labelsContainer.innerHTML = '';
      locationLabels = [];

      locations.forEach(loc => {
        const pos = latLngToVector3(loc.lat, loc.lng, GLOBE_RADIUS);

        const markerGeo = new THREE.SphereGeometry(3, 16, 16);
        const markerMat = new THREE.MeshBasicMaterial({ color: COLOR_FG });
        const markerMesh = new THREE.Mesh(markerGeo, markerMat);
        markerMesh.position.copy(pos);
        globeGroup.add(markerMesh);

        const labelDiv = document.createElement('div');
        labelDiv.className = 'label';
        labelDiv.innerText = loc.name;
        labelsContainer.appendChild(labelDiv);

        locationLabels.push({ element: labelDiv, pos: pos });
      });

      connections.forEach(conn => {
        const startLoc = locations.find(l => l.id === conn.from);
        const endLoc = locations.find(l => l.id === conn.to);

        if (startLoc && endLoc) {
          const vStart = latLngToVector3(startLoc.lat, startLoc.lng, GLOBE_RADIUS);
          const vEnd = latLngToVector3(endLoc.lat, endLoc.lng, GLOBE_RADIUS);

          const distance = vStart.distanceTo(vEnd);
          const mid = vStart.clone().add(vEnd).multiplyScalar(0.5);
          mid.normalize().multiplyScalar(GLOBE_RADIUS + distance * 0.25);

          const curve = new THREE.QuadraticBezierCurve3(vStart, mid, vEnd);
          const points = curve.getPoints(50);
          const curveGeometry = new THREE.BufferGeometry().setFromPoints(points);

          const curveMaterial = new THREE.LineBasicMaterial({
            color: COLOR_FG,
            linewidth: 1.5,
            transparent: true,
            opacity: 0.85
          });

          const arcLine = new THREE.Line(curveGeometry, curveMaterial);
          globeGroup.add(arcLine);
        }
      });
    }

    function updateLabels() {
      const tempV = new THREE.Vector3();

      locationLabels.forEach(label => {
        tempV.copy(label.pos);
        tempV.applyMatrix4(globeGroup.matrixWorld);

        const cameraToPoint = tempV.clone().sub(camera.position).normalize();
        const surfaceNormal = tempV.clone().normalize();
        const dot = cameraToPoint.dot(surfaceNormal);

        if (dot < -0.2) {
          tempV.project(camera);
          const x = (tempV.x * .5 + .5) * window.innerWidth;
          const y = (tempV.y * -.5 + .5) * window.innerHeight;

          label.element.style.transform = `translate(-50%, -100%) translate(${x}px,${y}px)`;
          label.element.classList.add('visible');
        } else {
          label.element.classList.remove('visible');
        }
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      if (!controls.state == -1 && !isAnimatingToLocation && !selectedCountryId) {
        globeGroup.rotation.y += 0.001;
      }

      controls.update();
      updateLabels();
      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
