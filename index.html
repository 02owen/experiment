<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Velvet FM — Live Global Radio Browser</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts: Inter & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #0d0d0d !important;
      color: #f4f4f5;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    .font-serif {
      font-family: 'Playfair Display', serif;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-[#0d0d0d] text-zinc-100 antialiased selection:bg-amber-500/30 min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const PRESET_TAGS = [
      { label: 'Jazz', query: 'jazz' },
      { label: 'Michael Jackson', query: 'michael jackson' },
      { label: 'Queen', query: 'queen' },
      { label: 'Pink Floyd', query: 'pink floyd' },
      { label: 'Rock', query: 'rock' },
      { label: 'Lofi', query: 'lofi' },
      { label: 'Blues', query: 'blues' },
      { label: 'Favorites', query: 'favorites' }
    ];

    const DEFAULT_COVER = 'https://images.unsplash.com/photo-1511192336575-5a79af67a629?auto=format&fit=crop&q=80&w=800';

    // --- SVG Icons ---
    const Icons = {
      Radio: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457-.315-2.84-.877-4.085" /></svg>,
      Play: ({ className = "w-6 h-6" }) => <svg className={className} fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>,
      Pause: ({ className = "w-6 h-6" }) => <svg className={className} fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>,
      Search: () => <svg className="w-4 h-4 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>,
      Heart: ({ filled }) => <svg className="w-5 h-5" fill={filled ? "currentColor" : "none"} stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>,
      Refresh: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>,
      Globe: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 002 2h1.5a2.5 2.5 0 002.5-2.5V11.08M12 21a9 9 0 100-18 9 9 0 000 18z" /></svg>
    };

    // --- Audio Visualizer Component ---
    function AudioVisualizer({ isPlaying, accentColor }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        let animationFrameId;
        let bars = Array.from({ length: 28 }, () => Math.random() * 15 + 5);

        const render = () => {
          try {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const barWidth = (canvas.width / bars.length) - 3;

            bars.forEach((bar, i) => {
              const targetHeight = isPlaying 
                ? Math.min(50, Math.max(4, bar + (Math.random() * 8 - 4))) 
                : 3;
              bars[i] = targetHeight;

              const x = i * (barWidth + 3);
              const y = canvas.height - targetHeight;

              ctx.fillStyle = accentColor || '#f59e0b';
              ctx.shadowBlur = isPlaying ? 6 : 0;
              ctx.shadowColor = accentColor || '#f59e0b';
              
              ctx.fillRect(x, y, barWidth, targetHeight);
            });

            animationFrameId = requestAnimationFrame(render);
          } catch (e) {
            console.warn("Canvas animation frame error", e);
          }
        };

        render();
        return () => {
          if (animationFrameId) cancelAnimationFrame(animationFrameId);
        };
      }, [isPlaying, accentColor]);

      return (
        <div className="relative overflow-hidden w-full max-w-xs h-14 flex items-center justify-center my-2 pointer-events-none -z-0">
          <canvas 
            ref={canvasRef} 
            width={280} 
            height={56} 
            className="w-full h-full opacity-80" 
          />
        </div>
      );
    }

    // --- Main App ---
    function App() {
      const [stations, setStations] = useState([]);
      const [currentStation, setCurrentStation] = useState(null);
      const [isPlaying, setIsPlaying] = useState(false);
      const [isLoading, setIsLoading] = useState(true);
      const [isStreamLoading, setIsStreamLoading] = useState(false);
      const [streamError, setStreamError] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedTag, setSelectedTag] = useState('jazz');
      
      // LocalStorage Favorites Persistent State
      const [favorites, setFavorites] = useState(() => {
        const saved = localStorage.getItem('velvet_radio_favorites');
        return saved ? JSON.parse(saved) : [];
      });

      const audioRef = useRef(null);

      // Fetch Stations from Radio-Browser API
      const fetchStations = async (query, isTag = true) => {
        setIsLoading(true);
        setStreamError(null);
        try {
          let url = '';
          if (query === 'favorites') {
            setStations(favorites);
            setIsLoading(false);
            if (!currentStation && favorites.length > 0) {
              setCurrentStation(favorites[0]);
            }
            return;
          }

          if (isTag) {
            url = `https://de1.api.radio-browser.info/json/stations/bytag/${encodeURIComponent(query)}?limit=40&order=votes&reverse=true`;
          } else {
            url = `https://de1.api.radio-browser.info/json/stations/search?name=${encodeURIComponent(query)}&limit=40&order=votes&reverse=true`;
          }

          const response = await fetch(url);
          const data = await response.json();

          const formatted = data.map(st => ({
            id: st.stationuuid,
            name: st.name ? st.name.trim() : 'Live Station',
            tags: st.tags ? st.tags.split(',').slice(0, 3).join(', ') : 'Music',
            country: st.countrycode || st.country || 'Global',
            bitrate: st.bitrate ? `${st.bitrate} kbps` : 'HD Stream',
            favicon: st.favicon && st.favicon.startsWith('http') ? st.favicon : DEFAULT_COVER,
            streamUrl: st.url_resolved || st.url,
            votes: st.votes || 0
          })).filter(st => st.streamUrl);

          setStations(formatted);
          if (formatted.length > 0 && !currentStation) {
            setCurrentStation(formatted[0]);
          }
        } catch (err) {
          console.error('Failed to fetch radio stations', err);
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        fetchStations(selectedTag, true);
      }, [selectedTag]);

      // Save Favorites to LocalStorage
      useEffect(() => {
        localStorage.setItem('velvet_radio_favorites', JSON.stringify(favorites));
      }, [favorites]);

      // Audio Playback Handling
      useEffect(() => {
        const audio = audioRef.current;
        if (!audio || !currentStation) return;

        setIsStreamLoading(isPlaying);
        setStreamError(null);

        if (isPlaying) {
          const playPromise = audio.play();
          if (playPromise !== undefined) {
            playPromise.then(() => {
              setIsStreamLoading(false);
            }).catch((error) => {
              console.warn("Playback error:", error);
              setIsPlaying(false);
              setIsStreamLoading(false);
              setStreamError('Failed to load stream. URL might be offline.');
            });
          }
        } else {
          audio.pause();
          setIsStreamLoading(false);
        }
      }, [isPlaying, currentStation]);

      const togglePlay = useCallback(() => {
        if (!currentStation && stations.length > 0) {
          setCurrentStation(stations[0]);
        }
        setIsPlaying(prev => !prev);
      }, [currentStation, stations]);

      const selectStation = (station) => {
        if (currentStation && currentStation.id === station.id) {
          togglePlay();
        } else {
          setCurrentStation(station);
          setIsPlaying(true);
        }
      };

      const toggleFavorite = (station) => {
        const exists = favorites.some(f => f.id === station.id);
        if (exists) {
          setFavorites(favorites.filter(f => f.id !== station.id));
        } else {
          setFavorites([...favorites, station]);
        }
      };

      const handleSearchSubmit = (e) => {
        e.preventDefault();
        if (searchQuery.trim()) {
          setSelectedTag('');
          fetchStations(searchQuery, false);
        }
      };

      const isCurrentFavorite = currentStation && favorites.some(f => f.id === currentStation.id);

      return (
        <div className="min-h-screen bg-[#121212] text-zinc-100 font-sans antialiased flex flex-col justify-between relative">
          
          {/* HTML5 Native Audio Player */}
          {currentStation && (
            <audio 
              ref={audioRef} 
              src={currentStation.streamUrl} 
              preload="none"
              playsInline
              webkit-playsinline="true"
              x5-playsinline="true"
              onError={() => {
                setIsPlaying(false);
                setIsStreamLoading(false);
                setStreamError('Stream is temporarily offline.');
              }}
            />
          )}

          {/* Header */}
          <header className="px-6 py-4 border-b border-zinc-800/40 bg-[#0d0d0d]/80 backdrop-blur-md sticky top-0 z-30 flex items-center justify-between flex-wrap gap-4">
            <div className="flex items-center space-x-3">
              <div className="p-2 rounded-xl bg-amber-500/10 text-amber-500 border border-amber-500/20">
                <Icons.Radio />
              </div>
              <div>
                <h1 className="font-serif text-lg tracking-tight font-bold text-white">VELVET FM</h1>
                <p className="text-[10px] text-zinc-500 font-mono tracking-widest uppercase">Live Global Radio</p>
              </div>
            </div>

            {/* Search Input Bar */}
            <form onSubmit={handleSearchSubmit} className="relative w-full max-w-xs">
              <input 
                type="text" 
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="Search station, artist, or genre..." 
                className="w-full bg-zinc-900/90 border border-zinc-800 rounded-full pl-9 pr-4 py-1.5 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-amber-500/50 transition"
              />
              <div className="absolute left-3 top-2.5">
                <Icons.Search />
              </div>
            </form>
          </header>

          {/* Main Workspace */}
          <main className="max-w-7xl mx-auto w-full px-6 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8 flex-1">
            
            {/* Center Player Hero */}
            <div className="lg:col-span-7 flex flex-col items-center justify-center bg-[#0d0d0d]/50 rounded-3xl p-8 border border-zinc-800/30 backdrop-blur-sm relative overflow-hidden min-h-[420px]">
              
              {currentStation ? (
                <>
                  <span className="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-400 text-xs font-mono mb-6">
                    <span className={`w-2 h-2 rounded-full ${isPlaying ? 'bg-amber-500 animate-ping' : 'bg-zinc-600'}`} />
                    <span>{isStreamLoading ? 'CONNECTING...' : isPlaying ? '24/7 LIVE STREAM' : 'PAUSED'}</span>
                  </span>

                  <div className="relative mb-6">
                    <img 
                      src={currentStation.favicon} 
                      onError={(e) => { e.target.src = DEFAULT_COVER; }}
                      alt={currentStation.name} 
                      className="w-56 h-56 md:w-64 md:h-64 object-cover rounded-2xl shadow-2xl border border-zinc-800/80 bg-zinc-900"
                    />
                  </div>

                  <div className="text-center space-y-1 mb-2 max-w-md">
                    <h2 className="font-serif text-2xl md:text-3xl font-semibold tracking-tight text-white truncate">
                      {currentStation.name}
                    </h2>
                    <p className="text-zinc-400 font-sans text-xs flex items-center justify-center gap-2">
                      <span className="text-amber-500/90 font-mono">{currentStation.bitrate}</span>
                      <span>•</span>
                      <span className="uppercase text-zinc-500">{currentStation.country}</span>
                    </p>
                  </div>

                  {/* Error Notification */}
                  {streamError && (
                    <div className="mt-2 text-xs text-red-400 bg-red-500/10 border border-red-500/20 px-3 py-1 rounded-lg">
                      {streamError}
                    </div>
                  )}

                  <AudioVisualizer isPlaying={isPlaying && !isStreamLoading} accentColor="#f59e0b" />

                  {/* Controls */}
                  <div className="flex items-center space-x-6 mt-4">
                    <button 
                      onClick={() => toggleFavorite(currentStation)}
                      className={`p-3 rounded-full border border-zinc-800/60 transition ${
                        isCurrentFavorite ? 'text-amber-500 bg-amber-500/10 border-amber-500/30' : 'text-zinc-400 hover:text-white bg-zinc-900/50'
                      }`}
                    >
                      <Icons.Heart filled={isCurrentFavorite} />
                    </button>

                    <button 
                      onClick={togglePlay}
                      disabled={isStreamLoading}
                      className="p-5 rounded-full bg-amber-500 hover:bg-amber-400 text-black shadow-xl shadow-amber-500/20 transition transform active:scale-95 disabled:opacity-50"
                    >
                      {isPlaying ? <Icons.Pause className="w-7 h-7" /> : <Icons.Play className="w-7 h-7 ml-0.5" />}
                    </button>
                  </div>
                </>
              ) : (
                <div className="text-zinc-500 text-sm">Select a station to start listening</div>
              )}
            </div>

            {/* Live Stations Sidebar List */}
            <div className="lg:col-span-5 flex flex-col space-y-6">
              
              {/* Category & Preset Tags */}
              <div className="space-y-3">
                <h3 className="text-xs uppercase tracking-wider text-zinc-500 font-mono">Filter by Tag</h3>
                <div className="flex flex-wrap gap-2">
                  {PRESET_TAGS.map((tag) => (
                    <button
                      key={tag.query}
                      onClick={() => {
                        setSelectedTag(tag.query);
                        fetchStations(tag.query, true);
                      }}
                      className={`px-3 py-1.5 rounded-xl text-xs font-medium transition ${
                        selectedTag === tag.query
                          ? 'bg-amber-500 text-black font-semibold'
                          : 'bg-zinc-900/80 text-zinc-400 hover:text-white border border-zinc-800'
                      }`}
                    >
                      {tag.label}
                    </button>
                  ))}
                </div>
              </div>

              {/* Live Stations Feed */}
              <div className="space-y-3 overflow-y-auto max-h-[460px] pr-1">
                {isLoading ? (
                  <div className="text-center py-12 text-zinc-500 text-xs font-mono animate-pulse">
                    Loading live streams...
                  </div>
                ) : stations.length === 0 ? (
                  <div className="text-center py-12 text-zinc-500 text-xs">
                    No live streams found. Try another tag or search term.
                  </div>
                ) : (
                  stations.map((station) => {
                    const isActive = currentStation && currentStation.id === station.id;
                    const isFav = favorites.some(f => f.id === station.id);

                    return (
                      <div
                        key={station.id}
                        onClick={() => selectStation(station)}
                        className={`p-3.5 rounded-2xl border transition cursor-pointer flex items-center justify-between group ${
                          isActive
                            ? 'bg-amber-500/10 border-amber-500/40 text-white'
                            : 'bg-zinc-900/40 hover:bg-zinc-900/80 border-zinc-800/60 text-zinc-300'
                        }`}
                      >
                        <div className="flex items-center space-x-3.5 overflow-hidden">
                          <img 
                            src={station.favicon} 
                            onError={(e) => { e.target.src = DEFAULT_COVER; }}
                            alt={station.name} 
                            className="w-11 h-11 rounded-xl object-cover border border-zinc-800/80 bg-zinc-900 flex-shrink-0"
                          />
                          <div className="truncate">
                            <h4 className="font-semibold text-sm truncate">{station.name}</h4>
                            <div className="flex items-center gap-2 text-xs text-zinc-500 truncate">
                              <span className="text-amber-500/80">{station.bitrate}</span>
                              <span>•</span>
                              <span className="truncate">{station.tags}</span>
                            </div>
                          </div>
                        </div>

                        <div className="flex items-center space-x-2">
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              toggleFavorite(station);
                            }}
                            className={`p-1.5 transition ${isFav ? 'text-amber-500' : 'text-zinc-600 hover:text-zinc-300'}`}
                          >
                            <Icons.Heart filled={isFav} />
                          </button>

                          <button className={`p-2.5 rounded-full transition ${
                            isActive && isPlaying 
                              ? 'bg-amber-500 text-black' 
                              : 'bg-zinc-800 text-zinc-400 group-hover:text-white'
                          }`}>
                            {isActive && isPlaying ? <Icons.Pause className="w-4 h-4" /> : <Icons.Play className="w-4 h-4" />}
                          </button>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            </div>
          </main>

          {/* Footer */}
          <footer className="px-6 py-4 border-t border-zinc-900 text-center text-xs text-zinc-600">
            Powered by Radio-Browser Open API — Velvet FM
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
