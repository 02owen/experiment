<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velvet FM — Late Night Jazz & Curated Radio</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts: Inter & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #0d0d0d;
      color: #f4f4f5;
      font-family: 'Inter', sans-serif;
    }
    .font-serif {
      font-family: 'Playfair Display', serif;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-[#0d0d0d] text-zinc-100 antialiased selection:bg-amber-500/30">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Station Data
    const STATIONS = [
      {
        id: 'jazz-lounge',
        category: 'Jazz Lounge',
        title: 'Midnight Velvet Radio',
        subtitle: 'Smooth Jazz & Vocal Standards',
        artist: 'Miles Davis',
        currentTrack: 'Blue in Green',
        cover: 'https://images.unsplash.com/photo-1511192336575-5a79af67a629?auto=format&fit=crop&q=80&w=800',
        streamUrl: 'https://stream.zeno.fm/f3wvbbqmdg8uv',
        badge: '24/7 LIVE',
        accentColor: '#f59e0b',
      },
      {
        id: 'mj-king',
        category: 'Michael Jackson',
        title: 'MJ: The King Stream',
        subtitle: 'Hits, Demos & Live Concerts',
        artist: 'Michael Jackson',
        currentTrack: 'Human Nature (Studio Mix)',
        cover: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&q=80&w=800',
        streamUrl: 'https://stream.zeno.fm/f3wvbbqmdg8uv',
        badge: 'CURATED',
        accentColor: '#e11d48',
      },
      {
        id: 'queen-rock',
        category: 'Queen',
        title: 'Bohemian Radio',
        subtitle: 'Anthems, Deep Cuts & Solo Works',
        artist: 'Queen',
        currentTrack: "Don't Stop Me Now",
        cover: 'https://images.unsplash.com/photo-1465847899084-d164df4dedc6?auto=format&fit=crop&q=80&w=800',
        streamUrl: 'https://stream.zeno.fm/f3wvbbqmdg8uv',
        badge: '24/7 LIVE',
        accentColor: '#fbbf24',
      },
      {
        id: 'pink-floyd',
        category: 'Pink Floyd',
        title: 'Dark Side Echoes',
        subtitle: 'Progressive & Psychedelic Rock',
        artist: 'Pink Floyd',
        currentTrack: 'Shine On You Crazy Diamond',
        cover: 'https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?auto=format&fit=crop&q=80&w=800',
        streamUrl: 'https://stream.zeno.fm/f3wvbbqmdg8uv',
        badge: 'HQ AUDIO',
        accentColor: '#8b5cf6',
      },
      {
        id: 'lofi-beats',
        category: 'Other Genres',
        genreTag: 'Lo-Fi Beats',
        title: 'Midnight Chill Beats',
        subtitle: 'Lofi Hip Hop & Ambient Beats',
        artist: 'Lofi Girl & Friends',
        currentTrack: 'Coffee on a Rainy Sunday',
        cover: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&q=80&w=800',
        streamUrl: 'https://stream.zeno.fm/f3wvbbqmdg8uv',
        badge: 'CHILL',
        accentColor: '#10b981',
      },
    ];

    const OTHER_GENRES = ['Lo-Fi Beats', 'Blues & Soul', 'Classic 80s Rock', 'Chillout'];

    // Safe Canvas Visualizer Component
    function AudioVisualizer({ isPlaying, accentColor }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return; // Guard Context initialization

        let animationFrameId;
        let bars = Array.from({ length: 32 }, () => Math.random() * 20 + 5);

        const render = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const barWidth = (canvas.width / bars.length) - 3;

          bars.forEach((bar, i) => {
            const targetHeight = isPlaying 
              ? Math.min(60, Math.max(5, bar + (Math.random() * 12 - 6))) 
              : 4;
            bars[i] = targetHeight;

            const x = i * (barWidth + 3);
            const y = canvas.height - targetHeight;

            ctx.fillStyle = accentColor || '#f59e0b';
            ctx.shadowBlur = isPlaying ? 8 : 0;
            ctx.shadowColor = accentColor || '#f59e0b';
            
            ctx.beginPath();
            if (typeof ctx.roundRect === 'function') {
              ctx.roundRect(x, y, barWidth, targetHeight, [4, 4, 0, 0]);
            } else {
              ctx.rect(x, y, barWidth, targetHeight);
            }
            ctx.fill();
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();
        return () => {
          if (animationFrameId) cancelAnimationFrame(animationFrameId);
        };
      }, [isPlaying, accentColor]);

      return (
        <canvas 
          ref={canvasRef} 
          width={320} 
          height={64} 
          className="w-full max-w-xs h-16 opacity-80 pointer-events-none relative z-10" 
        />
      );
    }

    // Explicit Zen Mode Overlay
    function ZenMode({ station, isPlaying, togglePlay, onClose, isLiked, toggleLike }) {
      return (
        <div className="fixed inset-0 z-50 bg-[#0d0d0d]/95 backdrop-blur-2xl flex flex-col items-center justify-between p-8 text-center text-zinc-100">
          <div className="w-full max-w-4xl flex justify-between items-center z-20">
            <span className="text-xs uppercase tracking-widest text-amber-500/80 font-mono">Zen Mode</span>
            <button 
              onClick={onClose} 
              className="p-3 rounded-full bg-zinc-900/80 hover:bg-zinc-800 text-zinc-400 hover:text-white transition"
            >
              <i data-lucide="minimize-2"></i>
            </button>
          </div>

          <div className="flex flex-col items-center my-auto space-y-8 z-20">
            <div className="relative group">
              <div 
                className={`absolute -inset-2 rounded-full blur-2xl opacity-40 transition duration-1000 ${
                  isPlaying ? 'animate-pulse' : ''
                }`}
                style={{ backgroundColor: station.accentColor }}
              />
              <img 
                src={station.cover} 
                alt={station.title} 
                className="relative w-64 h-64 md:w-80 md:h-80 object-cover rounded-full shadow-2xl border border-zinc-800/50"
              />
            </div>

            <div className="space-y-2">
              <h2 className="font-serif text-3xl md:text-4xl tracking-tight">{station.currentTrack}</h2>
              <p className="text-zinc-400 text-lg font-sans">{station.artist} — <span className="text-zinc-500">{station.title}</span></p>
            </div>

            <AudioVisualizer isPlaying={isPlaying} accentColor={station.accentColor} />
          </div>

          <div className="flex items-center space-x-6 mb-8 z-20">
            <button 
              onClick={toggleLike}
              className={`p-4 rounded-full transition ${isLiked ? 'text-amber-500 bg-amber-500/10' : 'text-zinc-500 hover:text-white'}`}
            >
              <i data-lucide="heart" fill={isLiked ? "currentColor" : "none"}></i>
            </button>

            <button 
              onClick={togglePlay}
              className="p-6 rounded-full bg-amber-500 hover:bg-amber-400 text-black shadow-lg shadow-amber-500/20 transition transform hover:scale-105 active:scale-95"
            >
              <i data-lucide={isPlaying ? "pause" : "play"} className={!isPlaying ? "ml-1" : ""}></i>
            </button>
          </div>
        </div>
      );
    }

    // Main App Component
    function App() {
      const [currentStation, setCurrentStation] = useState(STATIONS[0]);
      const [isPlaying, setIsPlaying] = useState(false);
      const [volume, setVolume] = useState(0.8);
      const [isMuted, setIsMuted] = useState(false);
      const [isLiked, setIsLiked] = useState(false);
      const [audioQuality, setAudioQuality] = useState('HD');
      const [activeCategory, setActiveCategory] = useState('All');
      const [isZenMode, setIsZenMode] = useState(false);
      const [sleepTimer, setSleepTimer] = useState(null);

      const audioRef = useRef(null);

      // Re-render Lucide Icons dynamically
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Synchronize Audio playback smoothly without full-screen state triggers
      useEffect(() => {
        if (audioRef.current) {
          if (isPlaying) {
            audioRef.current.play().catch((err) => {
              console.warn("Audio play prevented:", err);
              setIsPlaying(false);
            });
          } else {
            audioRef.current.pause();
          }
        }
      }, [isPlaying, currentStation]);

      useEffect(() => {
        if (audioRef.current) {
          audioRef.current.volume = isMuted ? 0 : volume;
        }
      }, [volume, isMuted]);

      const togglePlay = () => setIsPlaying(prev => !prev);

      const selectStation = (station) => {
        setCurrentStation(station);
        setIsPlaying(true);
      };

      const handleSleepTimer = (minutes) => {
        setSleepTimer(minutes);
        if (minutes) {
          setTimeout(() => {
            setIsPlaying(false);
            setSleepTimer(null);
          }, minutes * 60 * 1000);
        }
      };

      const filteredStations = STATIONS.filter(s => {
        if (activeCategory === 'All') return true;
        if (OTHER_GENRES.includes(activeCategory)) return s.genreTag === activeCategory;
        return s.category === activeCategory;
      });

      return (
        <div className="min-h-screen bg-[#121212] text-zinc-100 font-sans antialiased flex flex-col justify-between relative overflow-x-hidden">
          {/* Native Media Element with strict Inline Execution Attributes */}
          <audio 
            ref={audioRef} 
            src={currentStation.streamUrl} 
            preload="none"
            playsInline
            webkit-playsinline="true"
            x5-playsinline="true"
          />

          {/* Header */}
          <header className="px-6 py-5 border-b border-zinc-800/40 bg-[#0d0d0d]/80 backdrop-blur-md sticky top-0 z-30 flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <div className="p-2 rounded-xl bg-amber-500/10 text-amber-500 border border-amber-500/20">
                <i data-lucide="radio"></i>
              </div>
              <div>
                <h1 className="font-serif text-lg tracking-tight font-bold">VELVET FM</h1>
                <p className="text-[10px] text-zinc-500 font-mono tracking-widest uppercase">Late Night Lounge</p>
              </div>
            </div>

            <div className="flex items-center space-x-3">
              <div className="relative group">
                <button className="flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-zinc-900 border border-zinc-800 text-xs text-zinc-400 hover:text-white transition">
                  <i data-lucide="clock" className="w-3.5 h-3.5"></i>
                  <span>{sleepTimer ? `${sleepTimer}m` : 'Sleep'}</span>
                </button>
                <div className="absolute right-0 mt-2 w-32 bg-zinc-900 border border-zinc-800 rounded-xl shadow-xl opacity-0 group-hover:opacity-100 transition pointer-events-none group-hover:pointer-events-auto p-1 z-40">
                  {[15, 30, 60].map((mins) => (
                    <button
                      key={mins}
                      onClick={() => handleSleepTimer(mins)}
                      className="w-full text-left px-3 py-1.5 text-xs text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-lg transition"
                    >
                      {mins} Minutes
                    </button>
                  ))}
                </div>
              </div>

              {/* Explicit Zen Mode Button */}
              <button 
                onClick={() => setIsZenMode(true)}
                className="p-2 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-amber-500 transition"
                title="Zen Mode"
              >
                <i data-lucide="maximize-2" className="w-4 h-4"></i>
              </button>
            </div>
          </header>

          {/* Main Layout */}
          <main className="max-w-7xl mx-auto w-full px-6 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8 flex-1">
            
            {/* Center Hero Player */}
            <div className="lg:col-span-7 flex flex-col items-center justify-center bg-[#0d0d0d]/40 rounded-3xl p-8 border border-zinc-800/30 backdrop-blur-sm relative overflow-hidden">
              
              {/* Background Glow contained behind UI with z-0 */}
              <div 
                className="absolute inset-0 opacity-15 blur-3xl pointer-events-none transition-all duration-1000 -z-0"
                style={{ backgroundColor: currentStation.accentColor }}
              />

              <span className="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-400 text-xs font-mono mb-6 z-10">
                <span className="w-2 h-2 rounded-full bg-amber-500 animate-ping" />
                <span>{currentStation.badge}</span>
              </span>

              <div className="relative mb-6 z-10">
                <img 
                  src={currentStation.cover} 
                  alt={currentStation.title} 
                  className="w-64 h-64 md:w-80 md:h-80 object-cover rounded-2xl shadow-2xl border border-zinc-800/80"
                />
              </div>

              <div className="text-center space-y-1 mb-4 z-10">
                <h2 className="font-serif text-2xl md:text-3xl font-semibold tracking-tight text-white">
                  {currentStation.currentTrack}
                </h2>
                <p className="text-zinc-400 font-sans text-sm">
                  {currentStation.artist} — <span className="text-zinc-500">{currentStation.title}</span>
                </p>
              </div>

              <AudioVisualizer isPlaying={isPlaying} accentColor={currentStation.accentColor} />

              {/* Controls */}
              <div className="flex items-center space-x-6 mt-6 z-10">
                <button 
                  onClick={() => setIsLiked(!isLiked)}
                  className={`p-3 rounded-full border border-zinc-800/60 transition ${
                    isLiked ? 'text-amber-500 bg-amber-500/10 border-amber-500/30' : 'text-zinc-400 hover:text-white bg-zinc-900/50'
                  }`}
                >
                  <i data-lucide="heart" fill={isLiked ? 'currentColor' : 'none'} className="w-5 h-5"></i>
                </button>

                <button 
                  onClick={togglePlay}
                  className="p-5 rounded-full bg-amber-500 hover:bg-amber-400 text-black shadow-xl shadow-amber-500/20 transition transform active:scale-95"
                >
                  <i data-lucide={isPlaying ? "pause" : "play"} className={!isPlaying ? "ml-1" : ""}></i>
                </button>

                <button 
                  onClick={() => setAudioQuality(audioQuality === 'HD' ? 'SD' : 'HD')}
                  className="px-3 py-1.5 text-xs font-mono rounded-lg border border-zinc-800 bg-zinc-900/50 text-zinc-400 hover:text-white transition"
                >
                  {audioQuality}
                </button>
              </div>
            </div>

            {/* Right Column: Channel Selector */}
            <div className="lg:col-span-5 flex flex-col space-y-6">
              <div className="space-y-3">
                <h3 className="text-xs uppercase tracking-wider text-zinc-500 font-mono">Curated Channels</h3>
                <div className="flex flex-wrap gap-2">
                  {['All', 'Jazz Lounge', 'Michael Jackson', 'Queen', 'Pink Floyd', ...OTHER_GENRES].map((cat) => (
                    <button
                      key={cat}
                      onClick={() => setActiveCategory(cat)}
                      className={`px-3 py-1.5 rounded-xl text-xs transition duration-200 ${
                        activeCategory === cat 
                          ? 'bg-amber-500 text-black font-semibold shadow-md shadow-amber-500/10' 
                          : 'bg-zinc-900/80 hover:bg-zinc-800 text-zinc-400 border border-zinc-800/60'
                      }`}
                    >
                      {cat}
                    </button>
                  ))}
                </div>
              </div>

              {/* Station List */}
              <div className="space-y-3 flex-1 overflow-y-auto max-h-[460px] pr-1">
                {filteredStations.map((station) => {
                  const isActive = currentStation.id === station.id;
                  return (
                    <div
                      key={station.id}
                      onClick={() => selectStation(station)}
                      className={`p-3.5 rounded-2xl cursor-pointer border transition flex items-center justify-between group ${
                        isActive 
                          ? 'bg-zinc-900 border-amber-500/40 shadow-lg' 
                          : 'bg-zinc-900/30 border-zinc-800/40 hover:bg-zinc-900/60'
                      }`}
                    >
                      <div className="flex items-center space-x-3.5">
                        <img src={station.cover} alt={station.title} className="w-12 h-12 rounded-xl object-cover" />
                        <div>
                          <h4 className="font-serif text-sm font-medium text-zinc-200 group-hover:text-amber-400 transition">
                            {station.title}
                          </h4>
                          <p className="text-xs text-zinc-500">{station.subtitle}</p>
                        </div>
                      </div>

                      {isActive && isPlaying ? (
                        <div className="flex space-x-1 items-end h-4">
                          <span className="w-1 h-full bg-amber-500 animate-bounce rounded-full" />
                          <span className="w-1 h-2/3 bg-amber-500 animate-bounce rounded-full" />
                          <span className="w-1 h-4/5 bg-amber-500 animate-bounce rounded-full" />
                        </div>
                      ) : (
                        <i data-lucide="play" className="w-4 h-4 text-zinc-600 group-hover:text-zinc-300 transition"></i>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          </main>

          {/* Bottom Dock */}
          <footer className="border-t border-zinc-800/60 bg-[#0d0d0d]/90 backdrop-blur-xl px-6 py-4 sticky bottom-0 z-30">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <div className="flex items-center space-x-3 w-1/3">
                <img src={currentStation.cover} alt="Thumb" className="w-10 h-10 rounded-lg object-cover" />
                <div className="hidden sm:block truncate">
                  <p className="text-xs font-semibold text-zinc-200 truncate">{currentStation.currentTrack}</p>
                  <p className="text-[10px] text-zinc-500 truncate">{currentStation.artist}</p>
                </div>
              </div>

              <div className="flex items-center space-x-4">
                <button 
                  onClick={togglePlay}
                  className="p-3 rounded-full bg-amber-500 text-black hover:bg-amber-400 transition"
                >
                  <i data-lucide={isPlaying ? "pause" : "play"} className={!isPlaying ? "ml-0.5" : ""}></i>
                </button>
              </div>

              <div className="flex items-center justify-end space-x-2 w-1/3">
                <button 
                  onClick={() => setIsMuted(!isMuted)} 
                  className="text-zinc-400 hover:text-white transition"
                >
                  <i data-lucide={isMuted || volume === 0 ? "volume-x" : "volume-2"} className="w-4 h-4"></i>
                </button>
                <input 
                  type="range" 
                  min="0" 
                  max="1" 
                  step="0.01" 
                  value={isMuted ? 0 : volume} 
                  onChange={(e) => {
                    setVolume(parseFloat(e.target.value));
                    setIsMuted(false);
                  }}
                  className="w-20 accent-amber-500 bg-zinc-800 rounded-lg h-1 cursor-pointer"
                />
              </div>
            </div>
          </footer>

          {/* Zen Mode triggered explicitly */}
          {isZenMode && (
            <ZenMode 
              station={currentStation} 
              isPlaying={isPlaying} 
              togglePlay={togglePlay} 
              onClose={() => setIsZenMode(false)} 
              isLiked={isLiked}
              toggleLike={() => setIsLiked(!isLiked)}
            />
          )}
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
