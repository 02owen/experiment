<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obsidian Web Clone</title>
    <style>
        :root {
            --bg-main: #1e1e1e;
            --bg-sidebar: #171717;
            --border: #2d2d2d;
            --text-main: #dcddde;
            --text-muted: #888888;
            --accent: #7f6df2;
            --accent-hover: #9686f5;
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'Consolas', 'Courier New', Courier, monospace;
            --danger: #e06c75;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-size: 14px;
        }

        /* Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* Layout Structure */
        .sidebar {
            width: 250px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease;
            position: relative;
        }
        .sidebar.collapsed {
            width: 0;
            overflow: hidden;
        }
        
        #left-sidebar {
            border-right: 1px solid var(--border);
        }
        
        #right-sidebar {
            border-left: 1px solid var(--border);
            width: 300px;
        }
        #right-sidebar.collapsed {
            width: 0;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* Sidebar Headers */
        .sidebar-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:hover {
            color: var(--text-main);
            background: var(--border);
        }

        /* File Tree */
        .file-tree {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .file-item {
            padding: 6px 10px;
            margin-bottom: 2px;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-muted);
        }
        .file-item:hover {
            background-color: var(--border);
            color: var(--text-main);
        }
        .file-item.active {
            background-color: rgba(127, 109, 242, 0.15);
            color: var(--accent);
            font-weight: 500;
        }
        .file-item-delete {
            opacity: 0;
            color: var(--danger);
            border: none;
            background: none;
            cursor: pointer;
        }
        .file-item:hover .file-item-delete {
            opacity: 1;
        }

        /* Main Editor Area */
        .editor-header {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            border-bottom: 1px solid var(--border);
            gap: 15px;
        }
        .sidebar-toggle {
            cursor: pointer;
            color: var(--text-muted);
        }
        .sidebar-toggle:hover {
            color: var(--text-main);
        }
        
        .title-input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            font-weight: 600;
            outline: none;
            font-family: inherit;
        }

        .view-toggles {
            display: flex;
            background: var(--bg-sidebar);
            border-radius: 6px;
            padding: 3px;
            border: 1px solid var(--border);
        }
        .view-toggles button {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
        }
        .view-toggles button.active {
            background: var(--border);
            color: var(--text-main);
        }

        .editor-body {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
        }

        #markdown-editor, #markdown-preview {
            width: 100%;
            height: 100%;
            padding: 30px;
            overflow-y: auto;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.2s;
        }

        #markdown-editor {
            background: none;
            border: none;
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        #markdown-preview {
            opacity: 0;
            pointer-events: none;
            line-height: 1.6;
        }
        #markdown-preview.active {
            opacity: 1;
            pointer-events: auto;
        }

        #markdown-editor.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Markdown Styles in Preview */
        #markdown-preview h1, #markdown-preview h2, #markdown-preview h3 {
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            font-weight: 600;
        }
        #markdown-preview p {
            margin-bottom: 1em;
        }
        #markdown-preview a.wiki-link {
            color: var(--accent);
            text-decoration: none;
            cursor: pointer;
        }
        #markdown-preview a.wiki-link:hover {
            text-decoration: underline;
        }
        #markdown-preview pre {
            background: var(--bg-sidebar);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            overflow-x: auto;
            margin-bottom: 1em;
        }
        #markdown-preview code {
            font-family: var(--font-mono);
            font-size: 0.9em;
            color: var(--accent-hover);
        }
        #markdown-preview ul, #markdown-preview ol {
            padding-left: 25px;
            margin-bottom: 1em;
        }
        #markdown-preview input[type="checkbox"] {
            margin-right: 8px;
        }

        /* Status Bar */
        .status-bar {
            height: 30px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 15px;
            font-size: 11px;
            color: var(--text-muted);
            background: var(--bg-sidebar);
        }
        .status-item {
            margin-left: 15px;
        }

        /* Right Sidebar elements */
        .graph-container {
            height: 250px;
            border-bottom: 1px solid var(--border);
            position: relative;
            background: var(--bg-main);
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .backlinks-panel {
            padding: 15px;
            overflow-y: auto;
            flex: 1;
        }
        .backlinks-title {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 600;
        }
        .backlink-item {
            padding: 8px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 4px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 12px;
            color: var(--text-muted);
        }
        .backlink-item:hover {
            border-color: var(--accent);
            color: var(--text-main);
        }

        /* Command Palette */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 15vh;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .command-palette {
            width: 600px;
            max-width: 90%;
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .cmd-input {
            width: 100%;
            padding: 15px 20px;
            background: none;
            border: none;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
            font-size: 16px;
            outline: none;
            font-family: inherit;
        }
        .cmd-results {
            max-height: 300px;
            overflow-y: auto;
        }
        .cmd-item {
            padding: 12px 20px;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
        }
        .cmd-item:hover, .cmd-item.selected {
            background: var(--border);
            color: var(--text-main);
        }
        .cmd-item-title {
            font-weight: 500;
        }

        svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <!-- Left Sidebar -->
    <aside id="left-sidebar" class="sidebar">
        <div class="sidebar-header">
            <span>Vault</span>
            <button class="icon-btn" id="btn-new-note" title="New Note">
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </button>
        </div>
        <div class="file-tree" id="file-tree">
            <!-- Files injected here -->
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="editor-header">
            <div class="sidebar-toggle" id="toggle-left" title="Toggle Left Sidebar">
                <svg viewBox="0 0 24 24"><path d="M3 3h18v18H3V3zm16 16V5H5v14h14zM7 7h2v10H7V7z"/></svg>
            </div>
            <input type="text" class="title-input" id="note-title" placeholder="Untitled">
            <div class="view-toggles">
                <button id="btn-edit" class="active">Edit</button>
                <button id="btn-preview">Preview</button>
            </div>
            <div class="sidebar-toggle" id="toggle-right" title="Toggle Right Sidebar">
                <svg viewBox="0 0 24 24"><path d="M21 3H3v18h18V3zM5 19V5h14v14H5zm10-12h2v10h-2V7z"/></svg>
            </div>
        </div>
        
        <div class="editor-body">
            <textarea id="markdown-editor" placeholder="Start typing..."></textarea>
            <div id="markdown-preview"></div>
        </div>

        <div class="status-bar">
            <div class="status-item" id="word-count">0 words</div>
            <div class="status-item" id="char-count">0 chars</div>
        </div>
    </main>

    <!-- Right Sidebar -->
    <aside id="right-sidebar" class="sidebar">
        <div class="sidebar-header">
            <span>Graph View</span>
        </div>
        <div class="graph-container">
            <canvas id="graph-canvas"></canvas>
        </div>
        <div class="backlinks-panel">
            <div class="backlinks-title">Backlinks</div>
            <div id="backlinks-container">
                <!-- Backlinks injected here -->
            </div>
        </div>
    </aside>

    <!-- Command Palette Modal -->
    <div class="modal-overlay" id="cmd-palette-modal">
        <div class="command-palette">
            <input type="text" class="cmd-input" id="cmd-input" placeholder="Search notes... (↑/↓ to navigate, Enter to select)">
            <div class="cmd-results" id="cmd-results">
                <!-- Results injected here -->
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        const defaultContent = `# Welcome to Obsidian Web\n\nThis is a minimalist, local-first note taking app.\n\n## Features\n- **Markdown Support:** Bold, italics, headers, lists.\n- **Wiki-links:** Type double brackets to link to another note, like [[Ideas]]. Clicking it in preview creates the note if it doesn't exist!\n- **Graph View:** See connections between notes in the right sidebar.\n- **Command Palette:** Press \`Ctrl+K\` or \`Cmd+K\` to quick jump.\n\n## Tasks\n[x] Try the editor\n[ ] Create a new note\n[ ] Check the graph view\n\n\`\`\`javascript\nconsole.log('Enjoy your writing!');\n\`\`\`\n`;
        
        let notes = JSON.parse(localStorage.getItem('obsidian_notes')) || [
            { id: '1', title: 'Welcome', content: defaultContent },
            { id: '2', title: 'Ideas', content: 'Brainstorming note.\n\nLinking back to [[Welcome]].' }
        ];
        let activeNoteId = localStorage.getItem('obsidian_active') || '1';
        let isPreview = false;

        // --- DOM Elements ---
        const fileTreeEl = document.getElementById('file-tree');
        const noteTitleEl = document.getElementById('note-title');
        const editorEl = document.getElementById('markdown-editor');
        const previewEl = document.getElementById('markdown-preview');
        const wordCountEl = document.getElementById('word-count');
        const charCountEl = document.getElementById('char-count');
        const backlinksContainerEl = document.getElementById('backlinks-container');
        const btnNewNote = document.getElementById('btn-new-note');
        const btnEdit = document.getElementById('btn-edit');
        const btnPreview = document.getElementById('btn-preview');
        const modalOverlay = document.getElementById('cmd-palette-modal');
        const cmdInput = document.getElementById('cmd-input');
        const cmdResults = document.getElementById('cmd-results');
        
        // --- Utility ---
        const generateId = () => Math.random().toString(36).substr(2, 9);
        
        function saveState() {
            localStorage.setItem('obsidian_notes', JSON.stringify(notes));
            localStorage.setItem('obsidian_active', activeNoteId);
            updateGraphData();
            renderBacklinks();
        }

        function getActiveNote() {
            return notes.find(n => n.id === activeNoteId);
        }

        function getNoteByTitle(title) {
            return notes.find(n => n.title.toLowerCase() === title.toLowerCase());
        }

        // --- Core Functions ---
        function renderFileTree() {
            fileTreeEl.innerHTML = '';
            // Sort alphabetically by title
            const sortedNotes = [...notes].sort((a,b) => a.title.localeCompare(b.title));
            
            sortedNotes.forEach(note => {
                const div = document.createElement('div');
                div.className = `file-item ${note.id === activeNoteId ? 'active' : ''}`;
                
                const titleSpan = document.createElement('span');
                titleSpan.textContent = note.title;
                div.appendChild(titleSpan);

                const delBtn = document.createElement('button');
                delBtn.className = 'file-item-delete';
                delBtn.innerHTML = '✕';
                delBtn.title = "Delete Note";
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteNote(note.id);
                };
                div.appendChild(delBtn);

                div.onclick = () => openNote(note.id);
                fileTreeEl.appendChild(div);
            });
        }

        function openNote(id) {
            activeNoteId = id;
            const note = getActiveNote();
            if(!note) return;
            
            noteTitleEl.value = note.title;
            editorEl.value = note.content;
            
            renderFileTree();
            updateCounts();
            if(isPreview) {
                renderPreview();
            }
            saveState();
        }

        function openNoteByTitle(title) {
            let note = getNoteByTitle(title);
            if(!note) {
                // Create it if it doesn't exist
                note = { id: generateId(), title: title, content: '' };
                notes.push(note);
            }
            openNote(note.id);
            setEditMode();
        }

        function createNewNote() {
            const newId = generateId();
            let title = 'Untitled';
            let counter = 1;
            while(getNoteByTitle(title)) {
                title = `Untitled ${counter}`;
                counter++;
            }

            notes.push({ id: newId, title: title, content: '' });
            openNote(newId);
            setEditMode();
            noteTitleEl.focus();
            noteTitleEl.select();
        }

        function deleteNote(id) {
            if(notes.length <= 1) {
                alert("Cannot delete the last note.");
                return;
            }
            notes = notes.filter(n => n.id !== id);
            if(activeNoteId === id) {
                activeNoteId = notes[0].id;
            }
            openNote(activeNoteId);
        }

        function updateCounts() {
            const text = editorEl.value;
            charCountEl.textContent = `${text.length} chars`;
            const words = text.trim().split(/\s+/).filter(w => w.length > 0);
            wordCountEl.textContent = `${words.length} words`;
        }

        function renderPreview() {
            const raw = editorEl.value;
            let html = raw
                // Sanitize basic tags
                .replace(/</g, '&lt;').replace(/>/g, '&gt;')
                // Wiki links [[Title]]
                .replace(/\[\[(.*?)\]\]/g, (match, p1) => {
                    return `<a class="wiki-link" onclick="openNoteByTitle('${p1}')">${p1}</a>`;
                })
                // Code blocks
                .replace(/```([\s\S]*?)```/gim, '<pre><code>$1</code></pre>')
                // Inline code
                .replace(/`(.*?)`/gim, '<code>$1</code>')
                // Headers
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                // Bold
                .replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>')
                // Italic
                .replace(/\*(.*?)\*/gim, '<em>$1</em>')
                // Tasks
                .replace(/^\[ \]\s+(.*$)/gim, '<input type="checkbox" disabled> $1<br>')
                .replace(/^\[x\]\s+(.*$)/gim, '<input type="checkbox" checked disabled> $1<br>')
                // Lists
                .replace(/^\* (.*$)/gim, '<ul><li>$1</li></ul>')
                .replace(/<\/ul>\n<ul>/gim, '')
                // Paragraphs/Newlines
                .replace(/\n\n/g, '<p></p>')
                .replace(/\n/g, '<br/>');

            previewEl.innerHTML = html;
        }

        function setEditMode() {
            isPreview = false;
            btnEdit.classList.add('active');
            btnPreview.classList.remove('active');
            editorEl.classList.remove('hidden');
            previewEl.classList.remove('active');
            editorEl.focus();
        }

        function setPreviewMode() {
            isPreview = true;
            btnPreview.classList.add('active');
            btnEdit.classList.remove('active');
            editorEl.classList.add('hidden');
            previewEl.classList.add('active');
            renderPreview();
        }

        function renderBacklinks() {
            backlinksContainerEl.innerHTML = '';
            const activeNote = getActiveNote();
            if(!activeNote) return;

            const targetTitle = activeNote.title.toLowerCase();
            const backlinks = notes.filter(n => {
                if(n.id === activeNote.id) return false;
                const matches = [...n.content.matchAll(/\[\[(.*?)\]\]/g)];
                return matches.some(m => m[1].toLowerCase() === targetTitle);
            });

            if(backlinks.length === 0) {
                backlinksContainerEl.innerHTML = '<div style="color: var(--text-muted); font-size: 12px;">No backlinks found.</div>';
                return;
            }

            backlinks.forEach(n => {
                const div = document.createElement('div');
                div.className = 'backlink-item';
                div.textContent = n.title;
                div.onclick = () => openNote(n.id);
                backlinksContainerEl.appendChild(div);
            });
        }

        // --- Event Listeners ---
        btnNewNote.addEventListener('click', createNewNote);
        
        noteTitleEl.addEventListener('input', (e) => {
            const note = getActiveNote();
            if(note) {
                note.title = e.target.value || 'Untitled';
                renderFileTree();
                saveState();
            }
        });

        editorEl.addEventListener('input', (e) => {
            const note = getActiveNote();
            if(note) {
                note.content = e.target.value;
                updateCounts();
                saveState(); // In a real app, debounce this
            }
        });

        btnEdit.addEventListener('click', setEditMode);
        btnPreview.addEventListener('click', setPreviewMode);

        // Sidebar Toggles
        document.getElementById('toggle-left').addEventListener('click', () => {
            document.getElementById('left-sidebar').classList.toggle('collapsed');
        });
        document.getElementById('toggle-right').addEventListener('click', () => {
            document.getElementById('right-sidebar').classList.toggle('collapsed');
        });

        // --- Command Palette Logic ---
        let cmdSelectedIndex = 0;
        let cmdFilteredNotes = [];

        function openCmdPalette() {
            modalOverlay.classList.add('active');
            cmdInput.value = '';
            cmdInput.focus();
            filterCmdResults('');
        }

        function closeCmdPalette() {
            modalOverlay.classList.remove('active');
            editorEl.focus();
        }

        function filterCmdResults(query) {
            const q = query.toLowerCase();
            cmdFilteredNotes = notes.filter(n => n.title.toLowerCase().includes(q));
            cmdSelectedIndex = 0;
            renderCmdResults();
        }

        function renderCmdResults() {
            cmdResults.innerHTML = '';
            cmdFilteredNotes.forEach((n, index) => {
                const div = document.createElement('div');
                div.className = `cmd-item ${index === cmdSelectedIndex ? 'selected' : ''}`;
                div.innerHTML = `<span class="cmd-item-title">${n.title}</span>`;
                div.onmouseover = () => {
                    cmdSelectedIndex = index;
                    renderCmdResults();
                };
                div.onclick = () => {
                    openNote(n.id);
                    closeCmdPalette();
                };
                cmdResults.appendChild(div);
            });
        }

        cmdInput.addEventListener('input', (e) => filterCmdResults(e.target.value));
        cmdInput.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowDown') {
                e.preventDefault();
                cmdSelectedIndex = (cmdSelectedIndex + 1) % cmdFilteredNotes.length;
                renderCmdResults();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                cmdSelectedIndex = (cmdSelectedIndex - 1 + cmdFilteredNotes.length) % cmdFilteredNotes.length;
                renderCmdResults();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if(cmdFilteredNotes[cmdSelectedIndex]) {
                    openNote(cmdFilteredNotes[cmdSelectedIndex].id);
                    closeCmdPalette();
                }
            } else if (e.key === 'Escape') {
                closeCmdPalette();
            }
        });

        modalOverlay.addEventListener('click', (e) => {
            if(e.target === modalOverlay) closeCmdPalette();
        });

        document.addEventListener('keydown', (e) => {
            if((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                openCmdPalette();
            }
        });

        // --- Graph View (Force Directed Canvas) ---
        const canvas = document.getElementById('graph-canvas');
        const ctx = canvas.getContext('2d');
        let graphNodes = [];
        let graphEdges = [];
        let animationFrameId;

        function updateGraphData() {
            // Extract Nodes
            graphNodes = notes.map(n => {
                let existing = graphNodes.find(gn => gn.id === n.id);
                return {
                    id: n.id,
                    title: n.title,
                    x: existing ? existing.x : Math.random() * 250,
                    y: existing ? existing.y : Math.random() * 250,
                    vx: 0,
                    vy: 0
                };
            });

            // Extract Edges
            graphEdges = [];
            notes.forEach(sourceNote => {
                const matches = [...sourceNote.content.matchAll(/\[\[(.*?)\]\]/g)];
                matches.forEach(m => {
                    const targetTitle = m[1].toLowerCase();
                    const targetNote = notes.find(n => n.title.toLowerCase() === targetTitle);
                    if(targetNote && sourceNote.id !== targetNote.id) {
                        graphEdges.push({ source: sourceNote.id, target: targetNote.id });
                    }
                });
            });
        }

        function drawGraph() {
            const width = canvas.offsetWidth;
            const height = canvas.offsetHeight;
            canvas.width = width;
            canvas.height = height;

            ctx.clearRect(0, 0, width, height);

            if(graphNodes.length === 0) {
                animationFrameId = requestAnimationFrame(drawGraph);
                return;
            }

            // Simple physics simulation
            const k = Math.sqrt((width * height) / (graphNodes.length || 1)) * 0.5;

            // Repulsion
            for (let i = 0; i < graphNodes.length; i++) {
                for (let j = i + 1; j < graphNodes.length; j++) {
                    const n1 = graphNodes[i];
                    const n2 = graphNodes[j];
                    let dx = n1.x - n2.x;
                    let dy = n1.y - n2.y;
                    let dist = Math.sqrt(dx * dx + dy * dy) || 1;
                    let force = (k * k) / dist;
                    let fx = (dx / dist) * force;
                    let fy = (dy / dist) * force;
                    n1.vx += fx; n1.vy += fy;
                    n2.vx -= fx; n2.vy -= fy;
                }
            }

            // Attraction (Springs)
            graphEdges.forEach(edge => {
                const source = graphNodes.find(n => n.id === edge.source);
                const target = graphNodes.find(n => n.id === edge.target);
                if(source && target) {
                    let dx = source.x - target.x;
                    let dy = source.y - target.y;
                    let dist = Math.sqrt(dx * dx + dy * dy) || 1;
                    let force = (dist * dist) / (k * 3);
                    let fx = (dx / dist) * force;
                    let fy = (dy / dist) * force;
                    source.vx -= fx; source.vy -= fy;
                    target.vx += fx; target.vy += fy;
                }
            });

            // Gravity & Update
            graphNodes.forEach(n => {
                // Gravity to center
                let dx = (width / 2) - n.x;
                let dy = (height / 2) - n.y;
                n.vx += dx * 0.05;
                n.vy += dy * 0.05;

                // Friction & Apply
                n.vx *= 0.6;
                n.vy *= 0.6;
                n.x += n.vx * 0.1;
                n.y += n.vy * 0.1;

                // Bounds
                n.x = Math.max(10, Math.min(width - 10, n.x));
                n.y = Math.max(10, Math.min(height - 10, n.y));
            });

            // Draw Edges
            ctx.strokeStyle = '#2d2d2d';
            ctx.lineWidth = 1;
            graphEdges.forEach(edge => {
                const source = graphNodes.find(n => n.id === edge.source);
                const target = graphNodes.find(n => n.id === edge.target);
                if(source && target) {
                    ctx.beginPath();
                    ctx.moveTo(source.x, source.y);
                    ctx.lineTo(target.x, target.y);
                    ctx.stroke();
                }
            });

            // Draw Nodes
            graphNodes.forEach(n => {
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.id === activeNoteId ? 6 : 4, 0, 2 * Math.PI);
                ctx.fillStyle = n.id === activeNoteId ? '#7f6df2' : '#888888';
                ctx.fill();

                // Labels
                ctx.font = '10px Inter, sans-serif';
                ctx.fillStyle = '#dcddde';
                ctx.fillText(n.title, n.x + 8, n.y + 3);
            });

            animationFrameId = requestAnimationFrame(drawGraph);
        }

        // Graph Interaction (Click node to open)
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            for (let n of graphNodes) {
                const dx = mouseX - n.x;
                const dy = mouseY - n.y;
                if (Math.sqrt(dx*dx + dy*dy) < 10) {
                    openNote(n.id);
                    break;
                }
            }
        });

        // --- Initialization ---
        function init() {
            if(!getActiveNote() && notes.length > 0) {
                activeNoteId = notes[0].id;
            }
            openNote(activeNoteId);
            setEditMode();
            updateGraphData();
            drawGraph();
        }

        init();

    </script>
</body>
</html>
