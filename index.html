<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bad to the Bone - 3D Street Walk</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            letter-spacing: 1px;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="info">🕶️ Clean Nerd Swagger — "Bad to the Bone" Vibe 🕶️</div>

    <!-- Include Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Scene, Camera, Renderer setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x221f1e); // Gritty atmospheric sky
        scene.fog = new THREE.FogExp2(0x221f1e, 0.035);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.8, 5); // Cinematic low-angle tracking shot

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffedd0, 0.6); // Warm street glow
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffaed, 1.2);
        sunLight.position.set(5, 8, 3);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        scene.add(sunLight);

        // --- ENVIRONMENT: THE DIRTY HOOD & MARKET STALLS ---
        
        // Dusty/Muddy Ground
        const groundGeo = new THREE.PlaneGeometry(30, 200);
        const groundMat = new THREE.MeshStandardMaterial({ 
            color: 0x3d342f, 
            roughness: 0.9,
            metalness: 0.1 
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Environment chunks pool to create endless walking effect
        const environmentGroup = new THREE.Group();
        scene.add(environmentGroup);

        function createMarketStall(xPos, zPos) {
            const stallGroup = new THREE.Group();

            // Wooden Crate/Table
            const tableGeo = new THREE.BoxGeometry(1.8, 0.8, 1.2);
            const tableMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.8 });
            const table = new THREE.Mesh(tableGeo, tableMat);
            table.position.set(0, 0.4, 0);
            table.castShadow = true;
            table.receiveShadow = true;
            stallGroup.add(table);

            // Piles of fruits & vegetables (spheres and cones)
            const fruitColors = [0xd9381e, 0xef832e, 0xf4d03f, 0x27ae60, 0x8e44ad];
            for (let i = 0; i < 12; i++) {
                const size = 0.15 + Math.random() * 0.1;
                const fruitGeo = new THREE.SphereGeometry(size, 8, 8);
                const fruitMat = new THREE.MeshStandardMaterial({ 
                    color: fruitColors[Math.floor(Math.random() * fruitColors.length)],
                    roughness: 0.4
                });
                const fruit = new THREE.Mesh(fruitGeo, fruitMat);
                fruit.position.set(
                    (Math.random() - 0.5) * 1.4,
                    0.8 + size * 0.8,
                    (Math.random() - 0.5) * 0.8
                );
                fruit.castShadow = true;
                stallGroup.add(fruit);
            }

            stallGroup.position.set(xPos, 0, zPos);
            environmentGroup.add(stallGroup);
        }

        // Generate stalls along both sides (right and left)
        for (let z = -80; z <= 20; z += 4) {
            createMarketStall(-2.5, z); // Left side
            createMarketStall(2.5, z);  // Right side
            
            // Add grungy building walls behind stalls
            if (z % 8 === 0) {
                const wallGeo = new THREE.BoxGeometry(4, 6, 7);
                const wallMat = new THREE.MeshStandardMaterial({ color: 0x4a403b, roughness: 0.9 });
                const leftWall = new THREE.Mesh(wallGeo, wallMat);
                leftWall.position.set(-5.5, 3, z);
                environmentGroup.add(leftWall);

                const rightWall = new THREE.Mesh(wallGeo, wallMat);
                rightWall.position.set(5.5, 3, z);
                environmentGroup.add(rightWall);
            }
        }

        // --- CHARACTER: THE CLEAN NERD GUY WITH SWAGGER ---
        const characterGroup = new THREE.Group();
        scene.add(characterGroup);

        // Materials
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xf5d0b1, roughness: 0.6 });
        const winePoloMat = new THREE.MeshStandardMaterial({ color: 0x722f37, roughness: 0.5 }); // Wine colored Lacoste polo
        const pantsMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.7 }); // Clean dark trousers
        const shoeMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3 }); // Pristine clean shoes
        const hairMat = new THREE.MeshStandardMaterial({ color: 0x2c1d0c, roughness: 0.8 });
        const glassFrameMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.2 });

        // Torso (Wine-colored polo)
        const torsoGeo = new THREE.BoxGeometry(0.55, 0.75, 0.3);
        const torso = new THREE.Mesh(torsoGeo, winePoloMat);
        torso.position.set(0, 1.15, 0);
        torso.castShadow = true;
        characterGroup.add(torso);

        // Head Group
        const headGroup = new THREE.Group();
        headGroup.position.set(0, 1.65, 0);
        characterGroup.add(headGroup);

        // Head Base
        const headGeo = new THREE.BoxGeometry(0.32, 0.38, 0.32);
        const head = new THREE.Mesh(headGeo, skinMat);
        head.castShadow = true;
        headGroup.add(head);

        // Hair
        const hairGeo = new THREE.BoxGeometry(0.34, 0.15, 0.34);
        const hair = new THREE.Mesh(hairGeo, hairMat);
        hair.position.set(0, 0.13, 0);
        headGroup.add(hair);

        // Nerd Glasses (Sharp, stylish frames)
        const glassFrameLeft = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.1, 0.04), glassFrameMat);
        glassFrameLeft.position.set(-0.08, 0.02, 0.17);
        headGroup.add(glassFrameLeft);

        const glassFrameRight = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.1, 0.04), glassFrameMat);
        glassFrameRight.position.set(0.08, 0.02, 0.17);
        headGroup.add(glassFrameRight);

        const glassBridge = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.02, 0.02), glassFrameMat);
        glassBridge.position.set(0, 0.04, 0.17);
        headGroup.add(glassBridge);

        // Limbs (Pivots for animation)
        const leftArmGroup = new THREE.Group();
        leftArmGroup.position.set(-0.35, 1.45, 0);
        characterGroup.add(leftArmGroup);
        const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.6, 0.14), winePoloMat);
        leftArm.position.set(0, -0.25, 0);
        leftArm.castShadow = true;
        leftArmGroup.add(leftArm);

        const rightArmGroup = new THREE.Group();
        rightArmGroup.position.set(0.35, 1.45, 0);
        characterGroup.add(rightArmGroup);
        const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.6, 0.14), winePoloMat);
        rightArm.position.set(0, -0.25, 0);
        rightArm.castShadow = true;
        rightArmGroup.add(rightArm);

        const leftLegGroup = new THREE.Group();
        leftLegGroup.position.set(-0.15, 0.8, 0);
        characterGroup.add(leftLegGroup);
        const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.75, 0.18), pantsMat);
        leftLeg.position.set(0, -0.35, 0);
        leftLeg.castShadow = true;
        leftLegGroup.add(leftLeg);
        // Clean Shoe
        const leftShoe = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.12, 0.26), shoeMat);
        leftShoe.position.set(0, -0.75, 0.04);
        leftLegGroup.add(leftShoe);

        const rightLegGroup = new THREE.Group();
        rightLegGroup.position.set(0.15, 0.8, 0);
        characterGroup.add(rightLegGroup);
        const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.75, 0.18), pantsMat);
        rightLeg.position.set(0, -0.35, 0);
        rightLeg.castShadow = true;
        rightLegGroup.add(rightLeg);
        // Clean Shoe
        const rightShoe = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.12, 0.26), shoeMat);
        rightShoe.position.set(0, -0.75, 0.04);
        rightLegGroup.add(rightLeg);


        // --- ANIMATION & RENDER LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime() * 5; // Walk frequency synced to heavy swagger rhythm
            const walkCycle = Math.sin(time);
            const swaggerLean = Math.cos(time * 0.5);

            // Character swagger & walk dynamics
            characterGroup.position.y = Math.abs(Math.sin(time)) * 0.08; // Bounce
            characterGroup.rotation.z = swaggerLean * 0.05; // Confident shoulder sway
            headGroup.rotation.y = Math.sin(time * 0.5) * 0.1; // Cool confident head turns

            // Limb swings (opposite arm and leg)
            leftLegGroup.rotation.x = walkCycle * 0.6;
            rightLegGroup.rotation.x = -walkCycle * 0.6;
            leftArmGroup.rotation.x = -walkCycle * 0.5;
            rightArmGroup.rotation.x = walkCycle * 0.5;

            // Scroll environment toward the camera to simulate walking forward endlessly
            environmentGroup.position.z += 0.08;
            if (environmentGroup.position.z > 4) {
                environmentGroup.position.z = 0; // Loop environment
            }

            // Subtle cinematic camera tracking drift
            camera.position.x = Math.sin(clock.getElapsedTime() * 0.5) * 0.3;

            renderer.render(scene, camera);
        }

        animate();

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
