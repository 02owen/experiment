<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Velvet FM — Late Night Jazz & Curated Radio</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts: Inter & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #0d0d0d !important;
      color: #f4f4f5;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    .font-serif {
      font-family: 'Playfair Display', serif;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-[#0d0d0d] text-zinc-100 antialiased selection:bg-amber-500/30 min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // --- Reliable Free MP3 / Stream URLs ---
    const STATIONS = [
      {
        id: 'jazz-lounge',
        category: 'Jazz Lounge',
        title: 'Midnight Velvet Radio',
        subtitle: 'Smooth Jazz & Vocal Standards',
        artist: 'Miles Davis',
        currentTrack: 'Blue in Green',
        cover: 'https://images.unsplash.com/photo-1511192336575-5a79af67a629?auto=format&fit=crop&q=80&w=800',
        streamUrl: 'https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3',
        badge: '24/7 LIVE',
        accentColor: '#f59e0b',
      },
      {
        id: 'mj-king',
        category: 'Michael Jackson',
        title: 'MJ: The King Stream',
        subtitle: 'Hits, Demos & Live Concerts',
        artist: 'Michael Jackson',
        currentTrack: 'Human Nature (Studio Mix)',
        cover: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&q=80&w=800',
        streamUrl: 'https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3?filename=smooth-jazz-10887.mp3',
        badge: 'CURATED',
        accentColor: '#e11d48',
      },
      {
        id: 'queen-rock',
        category: 'Queen',
        title: 'Bohemian Radio',
        subtitle: 'Anthems, Deep Cuts & Solo Works',
        artist: 'Queen',
        currentTrack: "Don't Stop Me Now",
        cover: 'https://images.unsplash.com/photo-1465847899084-d164df4dedc6?auto=format&fit=crop&q=80&w=800',
        streamUrl: 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=rock-classic-11003.mp3',
        badge: '24/7 LIVE',
        accentColor: '#fbbf24',
      },
      {
        id: 'pink-floyd',
        category: 'Pink Floyd',
        title: 'Dark Side Echoes',
        subtitle: 'Progressive & Psychedelic Rock',
        artist: 'Pink Floyd',
        currentTrack: 'Shine On You Crazy Diamond',
        cover: 'https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?auto=format&fit=crop&q=80&w=800',
        streamUrl: 'https://cdn.pixabay.com/download/audio/2022/11/06/audio_c062024e0b.mp3?filename=ambient-rock-12400.mp3',
        badge: 'HQ AUDIO',
        accentColor: '#8b5cf6',
      },
      {
        id: 'lofi-beats',
        category: 'Other Genres',
        genreTag: 'Lo-Fi Beats',
        title: 'Midnight Chill Beats',
        subtitle: 'Lofi Hip Hop & Ambient Beats',
        artist: 'Lofi Girl & Friends',
        currentTrack: 'Coffee on a Rainy Sunday',
        cover: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&q=80&w=800',
        streamUrl: 'https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3',
        badge: 'CHILL',
        accentColor: '#10b981',
      },
    ];

    const OTHER_GENRES = ['Lo-Fi Beats', 'Blues & Soul', 'Classic 80s Rock', 'Chillout'];

    // --- Isolated SVG Icons ---
    const Icons = {
      Radio: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457-.315-2.84-.877-4.085" /></svg>,
      Play: ({ className = "w-6 h-6" }) => <svg className={className} fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>,
      Pause: ({ className = "w-6 h-6" }) => <svg className={className} fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>,
      Clock: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
      Maximize: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 8V4m0 0h4M4 4l5 5m11-2V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" /></svg>,
      Minimize: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 14h6m0 0v6m0-6L3 21m17-7h-6m0 0v6m0-6l7 7M10 4v6m0 0H4m6 0L3 3m14 7d-6 0m0 0V4m0 6l7-7" /></svg>,
      Heart: ({ filled }) => <svg className="w-5 h-5" fill={filled ? "currentColor" : "none"} stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>,
      Volume: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z" /></svg>,
      Mute: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" /></svg>
    };

    // --- Isolated Safe Visualizer ---
    function AudioVisualizer({ isPlaying, accentColor }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        let animationFrameId;
        let bars = Array.from({ length: 28 }, () => Math.random() * 15 + 5);

        const render = () => {
          try {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const barWidth = (canvas.width / bars.length) - 3;

            bars.forEach((bar, i) => {
              const targetHeight = isPlaying 
                ? Math.min(50, Math.max(4, bar + (Math.random() * 8 - 4))) 
                : 3;
              bars[i] = targetHeight;

              const x = i * (barWidth + 3);
              const y = canvas.height - targetHeight;

              ctx.fillStyle = accentColor || '#f59e0b';
              ctx.shadowBlur = isPlaying ? 6 : 0;
              ctx.shadowColor = accentColor || '#f59e0b';
              
              ctx.fillRect(x, y, barWidth, targetHeight);
            });

            animationFrameId = requestAnimationFrame(render);
          } catch (e) {
            console.warn("Canvas animation frame bypassed", e);
          }
        };

        render();
        return () => {
          if (animationFrameId) cancelAnimationFrame(animationFrameId);
        };
      }, [isPlaying, accentColor]);

      return (
        <div className="relative overflow-hidden w-full max-w-xs h-14 flex items-center justify-center my-2 pointer-events-none -z-0">
          <canvas 
            ref={canvasRef} 
            width={280} 
            height={56} 
            className="w-full h-full opacity-80" 
          />
        </div>
      );
    }

    // --- Zen Mode Modal ---
    function ZenMode({ station, isPlaying, togglePlay, onClose, isLiked, toggleLike }) {
      return (
        <div className="fixed inset-0 z-50 bg-[#0d0d0d] bg-opacity-95 backdrop-blur-2xl flex flex-col items-center justify-between p-8 text-center text-zinc-100">
          <div className="w-full max-w-4xl flex justify-between items-center">
            <span className="text-xs uppercase tracking-widest text-amber-500/80 font-mono">Zen Mode</span>
            <button 
              onClick={onClose} 
              className="p-3 rounded-full bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-white transition"
            >
              <Icons.Minimize />
            </button>
          </div>

          <div className="flex flex-col items-center my-auto space-y-6">
            <div className="relative">
              <div 
                className={`absolute -inset-2 rounded-full blur-2xl opacity-30 transition duration-1000 ${
                  isPlaying ? 'animate-pulse' : ''
                }`}
                style={{ backgroundColor: station.accentColor }}
              />
              <img 
                src={station.cover} 
                alt={station.title} 
                className="relative w-64 h-64 md:w-72 md:h-72 object-cover rounded-full shadow-2xl border border-zinc-800/80"
              />
            </div>

            <div className="space-y-1">
              <h2 className="font-serif text-2xl md:text-3xl font-semibold tracking-tight">{station.currentTrack}</h2>
              <p className="text-zinc-400 text-sm font-sans">{station.artist} — <span className="text-zinc-500">{station.title}</span></p>
            </div>

            <AudioVisualizer isPlaying={isPlaying} accentColor={station.accentColor} />
          </div>

          <div className="flex items-center space-x-6 mb-4">
            <button 
              onClick={toggleLike}
              className={`p-3.5 rounded-full transition ${isLiked ? 'text-amber-500 bg-amber-500/10' : 'text-zinc-500 hover:text-white'}`}
            >
              <Icons.Heart filled={isLiked} />
            </button>

            <button 
              onClick={togglePlay}
              className="p-5 rounded-full bg-amber-500 hover:bg-amber-400 text-black shadow-lg shadow-amber-500/20 transition transform active:scale-95"
            >
              {isPlaying ? <Icons.Pause /> : <Icons.Play className="w-6 h-6 ml-0.5" />}
            </button>
          </div>
        </div>
      );
    }

    // --- Main App ---
    function App() {
      const [currentStation, setCurrentStation] = useState(STATIONS[0]);
      const [isPlaying, setIsPlaying] = useState(false);
      const [volume, setVolume] = useState(0.8);
      const [isMuted, setIsMuted] = useState(false);
      const [isLiked, setIsLiked] = useState(false);
      const [audioQuality, setAudioQuality] = useState('HD');
      const [activeCategory, setActiveCategory] = useState('All');
      const [isZenMode, setIsZenMode] = useState(false);
      const [sleepTimer, setSleepTimer] = useState(null);

      // Dedicated Audio Engine Reference
      const audioRef = useRef(null);

      // Clean Audio Sync Effect with Safe Async Handling
      useEffect(() => {
        const audio = audioRef.current;
        if (!audio) return;

        if (isPlaying) {
          const playPromise = audio.play();
          if (playPromise !== undefined) {
            playPromise.catch((error) => {
              console.warn("Playback error gracefully handled:", error);
              setIsPlaying(false);
            });
          }
        } else {
          audio.pause();
        }
      }, [isPlaying, currentStation]);

      useEffect(() => {
        if (audioRef.current) {
          audioRef.current.volume = isMuted ? 0 : volume;
        }
      }, [volume, isMuted]);

      const togglePlay = useCallback(() => {
        setIsPlaying(prev => !prev);
      }, []);

      const selectStation = (station) => {
        if (currentStation.id === station.id) {
          togglePlay();
        } else {
          setCurrentStation(station);
          setIsPlaying(true);
        }
      };

      const handleSleepTimer = (minutes) => {
        setSleepTimer(minutes);
        if (minutes) {
          setTimeout(() => {
            setIsPlaying(false);
            setSleepTimer(null);
          }, minutes * 60 * 1000);
        }
      };

      const filteredStations = STATIONS.filter(s => {
        if (activeCategory === 'All') return true;
        if (OTHER_GENRES.includes(activeCategory)) return s.genreTag === activeCategory;
        return s.category === activeCategory;
      });

      return (
        <div className="min-h-screen bg-[#121212] text-zinc-100 font-sans antialiased flex flex-col justify-between relative">
          
          {/* Native Standard Audio Element */}
          <audio 
            ref={audioRef} 
            src={currentStation.streamUrl} 
            preload="none"
            playsInline
            webkit-playsinline="true"
            x5-playsinline="true"
          />

          {/* Header */}
          <header className="px-6 py-4 border-b border-zinc-800/40 bg-[#0d0d0d]/80 backdrop-blur-md sticky top-0 z-30 flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <div className="p-2 rounded-xl bg-amber-500/10 text-amber-500 border border-amber-500/20">
                <Icons.Radio />
              </div>
              <div>
                <h1 className="font-serif text-lg tracking-tight font-bold text-white">VELVET FM</h1>
                <p className="text-[10px] text-zinc-500 font-mono tracking-widest uppercase">Late Night Lounge</p>
              </div>
            </div>

            <div className="flex items-center space-x-3">
              {/* Sleep Timer */}
              <div className="relative group">
                <button className="flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-zinc-900 border border-zinc-800 text-xs text-zinc-400 hover:text-white transition">
                  <Icons.Clock />
                  <span>{sleepTimer ? `${sleepTimer}m` : 'Sleep'}</span>
                </button>
                <div className="absolute right-0 mt-2 w-32 bg-zinc-900 border border-zinc-800 rounded-xl shadow-xl opacity-0 group-hover:opacity-100 transition pointer-events-none group-hover:pointer-events-auto p-1 z-40">
                  {[15, 30, 60].map((mins) => (
                    <button
                      key={mins}
                      onClick={() => handleSleepTimer(mins)}
                      className="w-full text-left px-3 py-1.5 text-xs text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-lg transition"
                    >
                      {mins} Minutes
                    </button>
                  ))}
                </div>
              </div>

              {/* Zen Mode Button */}
              <button 
                onClick={() => setIsZenMode(true)}
                className="p-2 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-amber-500 transition"
                title="Zen Mode"
              >
                <Icons.Maximize />
              </button>
            </div>
          </header>

          {/* Main Workspace */}
          <main className="max-w-7xl mx-auto w-full px-6 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8 flex-1">
            
            {/* Center Player Hero */}
            <div className="lg:col-span-7 flex flex-col items-center justify-center bg-[#0d0d0d]/50 rounded-3xl p-8 border border-zinc-800/30 backdrop-blur-sm relative overflow-hidden">
              
              {/* Soft Radial Ambient Glow */}
              <div 
                className="absolute inset-0 opacity-10 blur-3xl pointer-events-none -z-10 transition-colors duration-700"
                style={{ backgroundColor: currentStation.accentColor }}
              />

              <span className="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-400 text-xs font-mono mb-6">
                <span className="w-2 h-2 rounded-full bg-amber-500 animate-ping" />
                <span>{currentStation.badge}</span>
              </span>

              <div className="relative mb-6">
                <img 
                  src={currentStation.cover} 
                  alt={currentStation.title} 
                  className="w-60 h-60 md:w-72 md:h-72 object-cover rounded-2xl shadow-2xl border border-zinc-800/80"
                />
              </div>

              <div className="text-center space-y-1 mb-2">
                <h2 className="font-serif text-2xl md:text-3xl font-semibold tracking-tight text-white">
                  {currentStation.currentTrack}
                </h2>
                <p className="text-zinc-400 font-sans text-sm">
                  {currentStation.artist} — <span className="text-zinc-500">{currentStation.title}</span>
                </p>
              </div>

              <AudioVisualizer isPlaying={isPlaying} accentColor={currentStation.accentColor} />

              {/* Player Controls */}
              <div className="flex items-center space-x-6 mt-4">
                <button 
                  onClick={() => setIsLiked(!isLiked)}
                  className={`p-3 rounded-full border border-zinc-800/60 transition ${
                    isLiked ? 'text-amber-500 bg-amber-500/10 border-amber-500/30' : 'text-zinc-400 hover:text-white bg-zinc-900/50'
                  }`}
                >
                  <Icons.Heart filled={isLiked} />
                </button>

                <button 
                  onClick={togglePlay}
                  className="p-5 rounded-full bg-amber-500 hover:bg-amber-400 text-black shadow-xl shadow-amber-500/20 transition transform active:scale-95"
                >
                  {isPlaying ? <Icons.Pause className="w-7 h-7" /> : <Icons.Play className="w-7 h-7 ml-0.5" />}
                </button>

                <button 
                  onClick={() => setAudioQuality(audioQuality === 'HD' ? 'SD' : 'HD')}
                  className="px-3 py-1.5 text-xs font-mono rounded-lg border border-zinc-800 bg-zinc-900/50 text-zinc-400 hover:text-white transition"
                >
                  {audioQuality}
                </button>
              </div>
            </div>

            {/* Channels & Station Grid */}
            <div className="lg:col-span-5 flex flex-col space-y-6">
              <div className="space-y-3">
                <h3 className="text-xs uppercase tracking-wider text-zinc-500 font-mono">Curated Channels</h3>
                <div className="flex flex-wrap gap-2">
                  {['All', 'Jazz Lounge', 'Michael Jackson', 'Queen', 'Pink Floyd', ...OTHER_GENRES].map((cat) => (
                    <button
                      key={cat}
                      onClick={() => setActiveCategory(cat)}
                      className={`px-3 py-1.5 rounded-xl text-xs transition duration-200 ${
                        activeCategory === cat 
                          ? 'bg-amber-500 text-black font-semibold shadow-md shadow-amber-500/10' 
                          : 'bg-zinc-900/80 hover:bg-zinc-800 text-zinc-400 border border-zinc-800/60'
                      }`}
                    >
                      {cat}
                    </button>
                  ))}
                </div>
              </div>

              {/* Station Card List */}
              <div className="space-y-3 flex-1 overflow-y-auto max-h-[460px] pr-1">
                {filteredStations.map((station) => {
                  const isActive = currentStation.id === station.id;
                  return (
                    <div
                      key={station.id}
                      onClick={() => selectStation(station)}
                      className={`p-3.5 rounded-2xl cursor-pointer border transition flex items-center justify-between group ${
                        isActive 
                          ? 'bg-zinc-900 border-amber-500/40 shadow-lg' 
                          : 'bg-zinc-900/30 border-zinc-800/40 hover:bg-zinc-900/60'
                      }`}
                    >
                      <div className="flex items-center space-x-3.5">
                        <img src={station.cover} alt={station.title} className="w-12 h-12 rounded-xl object-cover" />
                        <div>
                          <h4 className="font-serif text-sm font-medium text-zinc-200 group-hover:text-amber-400 transition">
                            {station.title}
                          </h4>
                          <p className="text-xs text-zinc-500">{station.subtitle}</p>
                        </div>
                      </div>

                      {isActive && isPlaying ? (
                        <div className="flex space-x-1 items-end h-4">
                          <span className="w-1 h-full bg-amber-500 animate-bounce rounded-full" />
                          <span className="w-1 h-2/3 bg-amber-500 animate-bounce rounded-full" />
                          <span className="w-1 h-4/5 bg-amber-500 animate-bounce rounded-full" />
                        </div>
                      ) : (
                        <div className="text-zinc-600 group-hover:text-zinc-300 transition">
                          <Icons.Play className="w-4 h-4" />
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          </main>

          {/* Sticky Dock Player Bar */}
          <footer className="border-t border-zinc-800/60 bg-[#0d0d0d]/90 backdrop-blur-xl px-6 py-4 sticky bottom-0 z-30">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <div className="flex items-center space-x-3 w-1/3">
                <img src={currentStation.cover} alt="Thumb" className="w-10 h-10 rounded-lg object-cover" />
                <div className="hidden sm:block truncate">
                  <p className="text-xs font-semibold text-zinc-200 truncate">{currentStation.currentTrack}</p>
                  <p className="text-[10px] text-zinc-500 truncate">{currentStation.artist}</p>
                </div>
              </div>

              <div className="flex items-center space-x-4">
                <button 
                  onClick={togglePlay}
                  className="p-3 rounded-full bg-amber-500 text-black hover:bg-amber-400 transition"
                >
                  {isPlaying ? <Icons.Pause className="w-5 h-5" /> : <Icons.Play className="w-5 h-5 ml-0.5" />}
                </button>
              </div>

              <div className="flex items-center justify-end space-x-2 w-1/3">
                <button 
                  onClick={() => setIsMuted(!isMuted)} 
                  className="text-zinc-400 hover:text-white transition"
                >
                  {isMuted || volume === 0 ? <Icons.Mute /> : <Icons.Volume />}
                </button>
                <input 
                  type="range" 
                  min="0" 
                  max="1" 
                  step="0.01" 
                  value={isMuted ? 0 : volume} 
                  onChange={(e) => {
                    setVolume(parseFloat(e.target.value));
                    setIsMuted(false);
                  }}
                  className="w-20 accent-amber-500 bg-zinc-800 rounded-lg h-1 cursor-pointer"
                />
              </div>
            </div>
          </footer>

          {/* Explicit Zen Mode Overlay */}
          {isZenMode && (
            <ZenMode 
              station={currentStation} 
              isPlaying={isPlaying} 
              togglePlay={togglePlay} 
              onClose={() => setIsZenMode(false)} 
              isLiked={isLiked}
              toggleLike={() => setIsLiked(!isLiked)}
            />
          )}
        </div>
      );
    }

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
